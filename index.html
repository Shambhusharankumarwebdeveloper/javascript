ndation hai - project structure aur plan, taaki har aage wala din solid base pe bane.", "why": "Real projects don't start with the fanciest feature - they start with a clean, organized setup that makes everything afterward easier to build and debug.", "analogy": "Think of today like laying the foundation of a house before building any rooms - unglamorous, but everything else depends on getting this right.", "syntax": "(Project structure, not new JS syntax today)"}, "teacher": {"intro": "Let's set up the JS Store project structure: one HTML file, one CSS file, and one JS file, with a basic page layout.", "code": "<!-- index.html -->\n<!DOCTYPE html>\n<html>\n<head>\n  <title>JS Store</title>\n  <link rel=\"stylesheet\" href=\"style.css\">\n</head>\n<body>\n  <header><h1>JS Store</h1></header>\n  <main id=\"productGrid\"></main>\n  <script src=\"script.js\"><\/script>\n</body>\n</html>\n\n// script.js\nconsole.log(\"JS Store project initialized!\");", "explanation": ["A clean separation - HTML for structure, CSS for style, JS for behavior - keeps the project organized as it grows over the next 14 days.", "#productGrid is an empty container where we'll render products starting Day 63 - planning ahead for where content will go.", "Starting with a simple console.log() confirms everything is correctly linked before adding real functionality.", "Every day from here builds DIRECTLY on top of this same project - nothing is thrown away, it all accumulates into one real store."]}, "practice": {"easy": {"task": "Create the three files (index.html, style.css, script.js) with the basic structure shown, and confirm the console.log message appears.", "answerCode": "// Just set up the three files as shown in the teaching example\n// and open index.html in a browser with DevTools open.", "answerExplain": "Confirming the console message appears verifies your files are correctly linked before building further.", "output": "JS Store project initialized!"}, "medium": {"task": "Add a simple CSS reset and a basic header style to style.css (e.g. removing default margin, setting a font-family).", "answerCode": "/* style.css */\n* { margin: 0; padding: 0; box-sizing: border-box; }\nbody { font-family: Arial, sans-serif; }\nheader { background: #222; color: white; padding: 16px; }", "answerExplain": "A minimal reset and basic styling gives the project a clean baseline to build visual features on top of later.", "output": "(the header now has a dark background with white text, and default browser spacing is removed)"}, "challenge": {"task": "Add a <footer> to the HTML with a copyright line, and use JavaScript to insert the CURRENT YEAR dynamically into it (hint: new Date().getFullYear()).", "answerCode": "// HTML: <footer id=\"pageFooter\"></footer>\nconst year = new Date().getFullYear();\ndocument.getElementById(\"pageFooter\").textContent = `© ${year} JS Store`;", "answerExplain": "new Date().getFullYear() gets the current year directly from the browser's clock - a small preview of JavaScript's built-in Date object.", "output": "(the footer shows something like '© 2026 JS Store', always matching whatever year it currently is)"}}, "realworld": {"text": "Every real project - no matter how big - starts with exactly this kind of simple setup: organized files, a clear structure, and a plan for what goes where.", "code": "// This humble setup is the seed of the entire JS Store project\n// you'll be building for the next 14 days!"}, "review": {"keyPoints": ["Real projects start with clean, organized file structure - not the flashiest feature first.", "Separating HTML/CSS/JS into their own files keeps growing projects manageable.", "Everything built over the next 14 days accumulates on top of THIS foundation."], "quiz": [{"q": "What's the purpose of today's setup step?", "options": ["To finish the whole project", "To create a clean foundation for the next 14 days", "To add all styling"], "answerIndex": 1, "explain": "Today establishes the base structure everything else will build upon."}, {"q": "What does new Date().getFullYear() return?", "options": ["The current month", "The current year as a number", "Today's full date"], "answerIndex": 1, "explain": "getFullYear() specifically returns just the year, as a number."}], "interview": {"q": "Why is it considered good practice to separate HTML, CSS, and JavaScript into different files, rather than writing everything inline in one HTML file?", "answer": "Separation of concerns makes each file focused on ONE job (structure, style, or behavior), which makes larger projects easier to navigate, debug, and maintain - and allows browsers to cache CSS/JS files separately for better performance."}, "tomorrow": "Day 62 - Product Data: defining the product catalog that powers the whole store."}}, {"day": 62, "title": "Product Data", "time": "60 minutes", "learn": {"en": "Every feature in JS Store depends on having real PRODUCT DATA to work with. Today we define an array of product objects - the single source of truth the rest of the store will read from.", "hi": "JS Store ka har feature real PRODUCT DATA pe depend karta hai. Aaj hum products ki ek array of objects define karte hain - single source of truth jise store ka baaki hissa read karega.", "why": "Without well-structured data upfront, every later feature (search, filter, cart) would be built on shaky ground - getting the data shape right now saves headaches later.", "analogy": "Think of today like stocking a warehouse's shelves with labeled, organized inventory BEFORE opening the store to customers - everything after depends on this being right.", "syntax": "const products = [\n  { id, name, price, category, stock, image }\n];"}, "teacher": {"intro": "Let's define our JS Store product catalog as an array of well-structured objects.", "code": "const products = [\n  { id: 1, name: \"Vitamin C\", price: 999, category: \"Vitamins\", stock: 12 },\n  { id: 2, name: \"Omega 3\", price: 799, category: \"Supplements\", stock: 8 },\n  { id: 3, name: \"Magnesium\", price: 599, category: \"Minerals\", stock: 0 },\n  { id: 4, name: \"Zinc\", price: 449, category: \"Minerals\", stock: 20 },\n  { id: 5, name: \"Probiotics\", price: 1099, category: \"Supplements\", stock: 5 }\n];\n\nconsole.log(products.length);\nconsole.log(products[0].name);", "explanation": ["Each product has a UNIQUE id - critical for later features like 'find this exact product' or 'add THIS specific item to cart'.", "Consistent property names (name, price, category, stock) across every object make writing later logic (map/filter/find) predictable and reliable.", "We're deliberately including a stock: 0 item (Magnesium) - so we have realistic data to test 'out of stock' logic against later.", "This products array becomes the FOUNDATION every remaining day of Phase 5 builds on top of - treat it as the store's single source of truth."]}, "practice": {"easy": {"task": "Add 2 more products to the array with unique ids, then log the total product count.", "answerCode": "products.push(\n  { id: 6, name: \"Multivitamin\", price: 899, category: \"Vitamins\", stock: 15 },\n  { id: 7, name: \"Fish Oil\", price: 749, category: \"Supplements\", stock: 10 }\n);\nconsole.log(products.length);", "answerExplain": "Since products is an array, push() works exactly as you learned back on Day 24.", "output": "7"}, "medium": {"task": "Use filter() to get all products with stock === 0, confirming Magnesium correctly appears.", "answerCode": "const outOfStock = products.filter((p) => p.stock === 0);\nconsole.log(outOfStock.map((p) => p.name));", "answerExplain": "Well-structured, consistent data makes this kind of query trivially reliable.", "output": "[ 'Magnesium' ]"}, "challenge": {"task": "Use reduce() to get a list of all UNIQUE categories present in the products array (hint: check if the category is already in your accumulator array before adding it).", "answerCode": "const categories = products.reduce((acc, product) => {\n  if (!acc.includes(product.category)) {\n    acc.push(product.category);\n  }\n  return acc;\n}, []);\nconsole.log(categories);", "answerExplain": "This is exactly the logic needed for tomorrow's category filter UI - knowing which categories genuinely exist in your data.", "output": "[ 'Vitamins', 'Supplements', 'Minerals' ]"}}, "realworld": {"text": "Real online stores manage thousands of products this same structural way (just stored in a real database, fetched via API) - name, price, category, stock, and a unique id are near-universal fields.", "code": "// This 'products' array plays the same role a real product database\n// table would play in a production e-commerce system."}, "review": {"keyPoints": ["Well-structured, consistent product data is the foundation every later store feature depends on.", "Unique ids on each product are essential for reliably finding/targeting specific items later.", "Deliberately including varied test data (like an out-of-stock item) helps verify logic works correctly."], "quiz": [{"q": "Why does each product need a unique id?", "options": ["It's just a convention, not important", "So specific products can be reliably found/targeted later", "To make the array longer"], "answerIndex": 1, "explain": "IDs let you reliably reference one exact product, regardless of its position in the array."}, {"q": "Why deliberately include a stock: 0 product in test data?", "options": ["To make the store look bad", "To have realistic data for testing out-of-stock logic", "It's required syntax"], "answerIndex": 1, "explain": "Testing against realistic edge cases (like zero stock) catches bugs before they reach real users."}], "interview": {"q": "In a REAL production app, would this products array typically be hardcoded like this, or come from somewhere else?", "answer": "In production, this data would come from a real database via an API call (like the fetch() pattern from Phase 4) - hardcoding is only appropriate for learning, prototyping, or genuinely static data; real product catalogs change too often and are too large to hardcode directly into JavaScript files."}, "tomorrow": "Day 63 - Product Cards: rendering ONE product as a visual card."}}, {"day": 63, "title": "Product Cards", "time": "60 minutes", "learn": {"en": "A product card is the visual representation of ONE product - name, price, and stock status, styled as a self-contained unit. Today we build a function that turns ONE product object into HTML.", "hi": "Product card ek product ka visual representation hai - name, price, stock status, ek self-contained unit ki tarah styled. Aaj hum ek function banate hain jo EK product object ko HTML mein badalta hai.", "why": "Before rendering a whole GRID of products (tomorrow), we need to nail down what a SINGLE card looks like and how it's generated from data.", "analogy": "Think of today like designing ONE product label template before printing hundreds of them - get the template right once, and it works for every product.", "syntax": "function createProductCard(product) {\n  return `<div>...</div>`;\n}"}, "teacher": {"intro": "Let's write a function that generates HTML for a single product card, including stock-based styling.", "code": "function createProductCard(product) {\n  const stockLabel = product.stock > 0 ? `${product.stock} in stock` : \"Out of stock\";\n  const stockClass = product.stock > 0 ? \"in-stock\" : \"out-of-stock\";\n\n  return `\n    <div class=\"product-card ${stockClass}\">\n      <h3>${product.name}</h3>\n      <p class=\"price\">₹${product.price}</p>\n      <p class=\"stock\">${stockLabel}</p>\n    </div>\n  `;\n}\n\nconsole.log(createProductCard(products[0]));\nconsole.log(createProductCard(products[2])); // the out-of-stock one", "explanation": ["The function takes ONE product object and returns an HTML STRING - it doesn't insert anything into the page itself yet (that's tomorrow's job).", "We use ternaries (Day 14!) to decide both the stock LABEL and a CSS class based on whether stock > 0.", "Template literals make building multi-line HTML readable, with real data slotted in via ${...}.", "Testing with BOTH an in-stock product (products[0]) and the out-of-stock one (products[2]) confirms our conditional logic actually works for both cases."]}, "practice": {"easy": {"task": "Call createProductCard() with a different product from the array and log the result.", "answerCode": "console.log(createProductCard(products[1]));", "answerExplain": "The same function correctly generates a card for ANY product passed into it.", "output": "(HTML string for the Omega 3 product card)"}, "medium": {"task": "Add a 'category' line to the product card template, showing the product's category.", "answerCode": "function createProductCard(product) {\n  const stockLabel = product.stock > 0 ? `${product.stock} in stock` : \"Out of stock\";\n  const stockClass = product.stock > 0 ? \"in-stock\" : \"out-of-stock\";\n\n  return `\n    <div class=\"product-card ${stockClass}\">\n      <h3>${product.name}</h3>\n      <p class=\"category\">${product.category}</p>\n      <p class=\"price\">₹${product.price}</p>\n      <p class=\"stock\">${stockLabel}</p>\n    </div>\n  `;\n}", "answerExplain": "Adding a new field to the card template is as simple as adding another ${...} slot.", "output": "(the card HTML now also includes the product's category line)"}, "challenge": {"task": "Add a 'Low Stock!' warning label (shown only when stock is between 1 and 5, inclusive) using an additional condition inside the function.", "answerCode": "function createProductCard(product) {\n  let stockLabel;\n  let stockClass;\n\n  if (product.stock === 0) {\n    stockLabel = \"Out of stock\";\n    stockClass = \"out-of-stock\";\n  } else if (product.stock <= 5) {\n    stockLabel = `Low Stock! Only ${product.stock} left`;\n    stockClass = \"low-stock\";\n  } else {\n    stockLabel = `${product.stock} in stock`;\n    stockClass = \"in-stock\";\n  }\n\n  return `\n    <div class=\"product-card ${stockClass}\">\n      <h3>${product.name}</h3>\n      <p class=\"price\">₹${product.price}</p>\n      <p class=\"stock\">${stockLabel}</p>\n    </div>\n  `;\n}", "answerExplain": "With THREE possible outcomes now, we switch from a ternary to if/else if/else, exactly the lesson from Day 12 and Day 14's challenge.", "output": "(products with stock 1-5 now show a distinct 'Low Stock!' warning)"}}, "realworld": {"text": "Every single product card you've ever seen on a real e-commerce site is generated from a function just like this - one reusable template, fed different data each time.", "code": "// This exact 'one product in, one HTML card out' function\n// is the atomic building block of every product listing page."}, "review": {"keyPoints": ["A card-generating function takes ONE product object and returns an HTML string.", "Testing with varied data (in-stock AND out-of-stock) verifies conditional logic actually works.", "Building and testing ONE card thoroughly before rendering many is a smart, incremental approach."], "quiz": [{"q": "What does createProductCard() return?", "options": ["Nothing, it renders directly", "An HTML string", "A DOM element"], "answerIndex": 1, "explain": "It returns a string of HTML markup, ready to be inserted into the page later."}, {"q": "Why test the function with both in-stock AND out-of-stock products?", "options": ["It's unnecessary", "To verify the conditional logic handles both cases correctly", "To make the array longer"], "answerIndex": 1, "explain": "Testing edge cases (like zero stock) before moving on catches bugs early."}], "interview": {"q": "Why is it useful to build and test a SINGLE product card function thoroughly before rendering an entire grid of them?", "answer": "Isolating and testing one unit of logic at a time makes bugs much easier to spot and fix - if something's wrong with the card template, you'll know immediately, rather than trying to debug it buried inside a larger rendering loop with many products at once."}, "tomorrow": "Day 64 - Product Listing: rendering ALL products as a grid of cards."}}, {"day": 64, "title": "Product Listing", "time": "60 minutes", "learn": {"en": "Today we take yesterday's single-card function and use it to render the ENTIRE product catalog as a grid - turning our products array into a real, visible store page.", "hi": "Aaj hum kal ke single-card function ko lete hain aur poori product catalog ko grid ki tarah render karte hain - products array ko ek real, visible store page mein badalte hain.", "why": "This is the moment JS Store starts looking like a real store - a full grid of products, generated automatically from data, not hand-written HTML.", "analogy": "Think of today like finally arranging all those individually-designed product labels onto the actual store shelves, all at once, in an organized display.", "syntax": "const html = products.map(createProductCard).join(\"\");\ncontainer.innerHTML = html;"}, "teacher": {"intro": "Let's render the full product grid using map() and our existing createProductCard() function.", "code": "function renderProducts(productList) {\n  const container = document.getElementById(\"productGrid\");\n  const cardsHtml = productList.map(createProductCard).join(\"\");\n  container.innerHTML = cardsHtml;\n}\n\nrenderProducts(products);", "explanation": ["productList.map(createProductCard) runs OUR function once per product, returning an array of HTML strings - notice we can pass the function name directly, without writing (product) => createProductCard(product), since map() already passes one item at a time.", ".join(\"\") combines that array of separate HTML strings into ONE single string, with nothing between them.", "container.innerHTML = cardsHtml sets ALL the cards at once - much more efficient than appending one by one in a loop (Day 40's lesson, applied here).", "renderProducts() accepts a productList PARAMETER (not just using the global 'products' directly) - this small design choice is what will let us render FILTERED lists later (Days 65-68), reusing this same function."]}, "practice": {"easy": {"task": "Call renderProducts(products) and confirm all 5 (or more) products appear as cards on the page.", "answerCode": "renderProducts(products);", "answerExplain": "This single call renders the entire catalog using the reusable pipeline you just built.", "output": "(the full product grid appears on the page)"}, "medium": {"task": "Call renderProducts() with only a SLICE of the products array (e.g. products.slice(0, 2)) to confirm the function works with any subset, not just the full list.", "answerCode": "renderProducts(products.slice(0, 2));", "answerExplain": "Since renderProducts() takes ANY array as its parameter, it naturally works with partial lists too - a preview of tomorrow's search feature.", "output": "(only the first 2 products render as cards)"}, "challenge": {"task": "Add a product COUNT display (e.g. 'Showing 5 products') that updates based on how many products are passed into renderProducts().", "answerCode": "function renderProducts(productList) {\n  const container = document.getElementById(\"productGrid\");\n  const countEl = document.getElementById(\"productCount\");\n\n  countEl.textContent = `Showing ${productList.length} products`;\n\n  const cardsHtml = productList.map(createProductCard).join(\"\");\n  container.innerHTML = cardsHtml;\n}\nrenderProducts(products);", "answerExplain": "Since renderProducts() already receives the exact list being displayed, updating a count based on productList.length is a natural addition.", "output": "Showing 5 products\n(plus the rendered grid)"}}, "realworld": {"text": "This map() + join() + innerHTML pattern is one of the most common ways real (non-framework) JavaScript projects render lists of data - simple, fast, and effective for straightforward listing pages.", "code": "// products.map(createCard).join('') -> one clean line\n// renders an entire dynamic list from data."}, "review": {"keyPoints": ["map() + join(\"\") efficiently builds one combined HTML string from an array of items.", "Setting innerHTML once (rather than appending in a loop) is generally more efficient for larger lists.", "Designing renderProducts() to accept ANY list (not just the global array) makes it reusable for filtered views later."], "quiz": [{"q": "What does .join(\"\") do to an array of strings?", "options": ["Deletes them", "Combines them into one single string", "Sorts them"], "answerIndex": 1, "explain": "join('') concatenates all array elements into one string, with nothing between them."}, {"q": "Why does renderProducts() accept a parameter instead of always using the global 'products' array directly?", "options": ["No real reason", "So it can be reused for filtered/searched lists later", "It's required syntax"], "answerIndex": 1, "explain": "Accepting a parameter makes the function flexible enough to render ANY subset of products, not just everything."}], "interview": {"q": "Why might productList.map(createProductCard) be preferred over productList.map((p) => createProductCard(p)) here, even though both work identically?", "answer": "When a callback function does nothing except call another function with the SAME arguments it received, you can pass that function directly by reference - it's slightly more concise. Both are correct; this is purely a stylistic choice some developers prefer when the signatures line up exactly."}, "tomorrow": "Day 65 - Search: letting users filter products by typing."}}, {"day": 65, "title": "Search", "time": "60 minutes", "learn": {"en": "Today we add a live search box: as the user types, the product grid instantly filters to show only matching products - combining input events, filter(), and our existing render function.", "hi": "Aaj hum ek live search box add karte hain: jab user type karta hai, product grid instantly filter hoke sirf matching products dikhata hai - input events, filter(), aur existing render function ko combine karte hain.", "why": "Search is one of the most-used features on any real store - customers rarely browse the ENTIRE catalog; they search for what they specifically want.", "analogy": "Think of live search like a librarian instantly re-shelving only the matching books onto a display table the moment you describe what you're looking for - no waiting, no separate 'search' button click needed.", "syntax": "input.addEventListener(\"input\", function() {\n  // runs on every keystroke\n});"}, "teacher": {"intro": "Let's add a search input that filters products by name as the user types.", "code": "// HTML: <input id=\"searchInput\" placeholder=\"Search products...\">\nconst searchInput = document.getElementById(\"searchInput\");\n\nsearchInput.addEventListener(\"input\", function() {\n  const query = searchInput.value.toLowerCase().trim();\n\n  const filtered = products.filter((product) => {\n    return product.name.toLowerCase().includes(query);\n  });\n\n  renderProducts(filtered);\n});", "explanation": ["The \"input\" event (different from \"click\"!) fires on EVERY keystroke, letting the results update live as the user types - not just when they hit Enter.", "toLowerCase() on BOTH the query and product name ensures the search is case-insensitive ('vitamin' matches 'Vitamin C').", ".includes(query) checks if the product name CONTAINS the search text anywhere, not just at the start.", "renderProducts(filtered) reuses YESTERDAY's exact function - this is precisely why we designed it to accept any list as a parameter."]}, "practice": {"easy": {"task": "Type a partial product name (e.g. 'vit') into the search box and confirm matching products filter correctly.", "answerCode": "// Just test typing into the searchInput field with the code above already in place.", "answerExplain": "Since .includes() checks for the substring anywhere in the name, partial matches work naturally.", "output": "(only products containing 'vit' in their name remain visible, e.g. Vitamin C)"}, "medium": {"task": "Show a 'No products found' message when the filtered array is empty.", "answerCode": "searchInput.addEventListener(\"input\", function() {\n  const query = searchInput.value.toLowerCase().trim();\n  const filtered = products.filter((p) => p.name.toLowerCase().includes(query));\n\n  if (filtered.length === 0) {\n    document.getElementById(\"productGrid\").innerHTML = \"<p>No products found.</p>\";\n  } else {\n    renderProducts(filtered);\n  }\n});", "answerExplain": "Checking filtered.length === 0 lets you show a friendly empty-state message instead of a blank grid.", "output": "(typing something that matches nothing shows 'No products found.' instead of an empty page)"}, "challenge": {"task": "Extend the search to also match against the product's CATEGORY, not just its name (a product matches if EITHER field contains the query).", "answerCode": "searchInput.addEventListener(\"input\", function() {\n  const query = searchInput.value.toLowerCase().trim();\n\n  const filtered = products.filter((product) => {\n    const nameMatches = product.name.toLowerCase().includes(query);\n    const categoryMatches = product.category.toLowerCase().includes(query);\n    return nameMatches || categoryMatches;\n  });\n\n  renderProducts(filtered);\n});", "answerExplain": "Using || (Day 13!) lets a product match on EITHER field - searching 'mineral' now correctly finds products in the Minerals category, even if 'mineral' isn't in their name.", "output": "(searching 'mineral' now also returns Magnesium and Zinc, matched by category)"}}, "realworld": {"text": "Every 'search products' box on a real e-commerce site works with this exact input-event + filter() + re-render pattern, often enhanced with debouncing (delaying slightly) for performance with very large catalogs.", "code": "// This live-search pattern is one of the most universally\n// recognizable e-commerce UI features you've just recreated."}, "review": {"keyPoints": ["The 'input' event fires on every keystroke, enabling live/instant search.", ".toLowerCase() on both sides makes search case-insensitive.", "Reusing renderProducts() (designed to accept any list) makes adding search almost trivial."], "quiz": [{"q": "Which event fires on every keystroke in an input field?", "options": ["click", "input", "submit"], "answerIndex": 1, "explain": "The 'input' event fires continuously as the user types, unlike 'click' or 'submit'."}, {"q": "Why convert both the query and product names to lowercase before comparing?", "options": ["It's required syntax", "To make the search case-insensitive", "To make it faster"], "answerIndex": 1, "explain": "Case-insensitive comparison ensures 'VITAMIN' and 'vitamin' are treated as matching."}], "interview": {"q": "For a store with THOUSANDS of products, why might firing a filter() on every single keystroke become a performance concern, and what's a common technique to address it?", "answer": "Filtering a huge array on every keystroke (potentially many times per second while typing) can become slow and janky. 'Debouncing' is a common technique - waiting a short pause (e.g. 300ms) after the user stops typing before actually running the filter, rather than on every single keystroke."}, "tomorrow": "Day 66 - Category Filtering: letting users filter by product category."}}, {"day": 66, "title": "Category Filtering", "time": "60 minutes", "learn": {"en": "Today we add category filter buttons (e.g. 'All', 'Vitamins', 'Minerals') that instantly narrow the visible products - another filter() application, this time driven by button clicks instead of typing.", "hi": "Aaj hum category filter buttons add karte hain (jaise 'All', 'Vitamins', 'Minerals') jo instantly visible products ko narrow karte hain - ek aur filter() application, is baar typing ke bajaye button clicks se driven.", "why": "Category filters help customers browse by TYPE of product, a completely different (and equally common) browsing pattern compared to typed search.", "analogy": "Think of category buttons like labeled aisle signs in a physical store - customers who don't know the exact product name yet can still narrow down to the right SECTION.", "syntax": "button.addEventListener(\"click\", function() {\n  const filtered = products.filter(...);\n  renderProducts(filtered);\n});"}, "teacher": {"intro": "Let's build category filter buttons generated dynamically from our actual product data (reusing yesterday's reduce()-based unique-categories trick from Day 62's challenge).", "code": "// HTML: <div id=\"categoryButtons\"></div>\nfunction renderCategoryButtons() {\n  const categories = products.reduce((acc, p) => {\n    if (!acc.includes(p.category)) acc.push(p.category);\n    return acc;\n  }, []);\n\n  const allCategories = [\"All\", ...categories]; // spread into a new array with 'All' first\n\n  const container = document.getElementById(\"categoryButtons\");\n  container.innerHTML = allCategories\n    .map((cat) => `<button data-category=\"${cat}\">${cat}</button>`)\n    .join(\"\");\n\n  container.querySelectorAll(\"button\").forEach((btn) => {\n    btn.addEventListener(\"click\", function() {\n      const selected = btn.getAttribute(\"data-category\");\n      const filtered = selected === \"All\" ? products : products.filter((p) => p.category === selected);\n      renderProducts(filtered);\n    });\n  });\n}\n\nrenderCategoryButtons();", "explanation": ["[\"All\", ...categories] uses the SPREAD operator (...) to unpack the categories array into a new array, with 'All' manually placed first.", "data-category=\"${cat}\" stores the category name directly ON each button using a data attribute - readable later with getAttribute().", "Attaching a click listener to EACH generated button (inside a forEach) lets every button independently filter based on ITS OWN category value.", "selected === \"All\" ? products : products.filter(...) - clicking 'All' shows everything (no filtering needed); any other category filters normally."]}, "practice": {"easy": {"task": "Click each generated category button and confirm the product grid updates correctly for each one.", "answerCode": "// Just test clicking each button generated by renderCategoryButtons()", "answerExplain": "Each button independently filters based on its own data-category value.", "output": "(clicking 'Vitamins' shows only Vitamin C and Multivitamin; clicking 'All' shows everything)"}, "medium": {"task": "Add a visual 'active' state - the currently selected category button gets a highlighted CSS class, removed from all others.", "answerCode": "container.querySelectorAll(\"button\").forEach((btn) => {\n  btn.addEventListener(\"click\", function() {\n    container.querySelectorAll(\"button\").forEach((b) => b.classList.remove(\"active\"));\n    btn.classList.add(\"active\");\n\n    const selected = btn.getAttribute(\"data-category\");\n    const filtered = selected === \"All\" ? products : products.filter((p) => p.category === selected);\n    renderProducts(filtered);\n  });\n});", "answerExplain": "Removing 'active' from ALL buttons first, then adding it only to the clicked one, ensures only ONE button is ever highlighted at a time.", "output": "(the currently selected category button now stays visually highlighted)"}, "challenge": {"task": "Combine category filtering with the search box from yesterday - clicking a category should ALSO respect whatever's currently typed in the search box.", "answerCode": "function applyFilters() {\n  const query = document.getElementById(\"searchInput\").value.toLowerCase().trim();\n  const selectedCategory = document.querySelector(\".active\")?.getAttribute(\"data-category\") || \"All\";\n\n  let filtered = products.filter((p) => p.name.toLowerCase().includes(query));\n\n  if (selectedCategory !== \"All\") {\n    filtered = filtered.filter((p) => p.category === selectedCategory);\n  }\n\n  renderProducts(filtered);\n}\n\n// Call applyFilters() from BOTH the search input listener AND each category button listener", "answerExplain": "Combining multiple active filters (search text AND category) by chaining .filter() calls is exactly how real multi-filter systems work - each filter narrows down the result further.", "output": "(the grid now respects BOTH the typed search query and the selected category simultaneously)"}}, "realworld": {"text": "Real e-commerce category sidebars/tabs work exactly this way - and the challenge exercise's COMBINED filtering (search + category together) is precisely how real product listing pages with multiple simultaneous filters operate.", "code": "// Combining several independent filters by chaining .filter() calls\n// is the standard approach behind real multi-filter shopping UIs."}, "review": {"keyPoints": ["Category buttons can be generated dynamically FROM the actual product data, rather than hardcoded.", "Data attributes (data-category) are a clean way to attach extra information directly to HTML elements.", "Multiple filters (search + category) can be combined by chaining .filter() calls together."], "quiz": [{"q": "What does the spread operator (...) do in [\"All\", ...categories]?", "options": ["Deletes the array", "Unpacks the array's items into the new array", "Doubles every item"], "answerIndex": 1, "explain": "Spread unpacks an existing array's items into a new array or function call."}, {"q": "What's a data attribute (like data-category) used for?", "options": ["Styling only", "Storing custom information directly on an HTML element", "Nothing, it's decorative"], "answerIndex": 1, "explain": "Data attributes let you attach custom data to elements, readable via getAttribute() or .dataset."}], "interview": {"q": "Why is generating category buttons dynamically FROM the data generally better than hardcoding a fixed list of category buttons in the HTML?", "answer": "If a new category is added to the product data (or an old one removed), dynamically-generated buttons automatically stay in sync - hardcoded buttons would need to be manually updated every time the underlying data changes, which is error-prone and easy to forget in a real, evolving product catalog."}, "tomorrow": "Day 67 - Price Filtering: letting users filter by a price range."}}, {"day": 67, "title": "Price Filtering", "time": "60 minutes", "learn": {"en": "Today we add price range filtering - letting customers narrow products to a minimum and/or maximum price, using number inputs and, once again, our trusty filter().", "hi": "Aaj hum price range filtering add karte hain - customers ko products ko minimum aur/ya maximum price tak narrow karne dete hain, number inputs aur, ek baar phir, hamara trusty filter() use karke.", "why": "Budget matters to real shoppers - 'show me only what's under ₹500' is an extremely common real-world filtering need.", "analogy": "Think of a price filter like telling a shop assistant your budget upfront - they instantly stop showing you anything outside that range, saving everyone time.", "syntax": "products.filter((p) => p.price >= min && p.price <= max);"}, "teacher": {"intro": "Let's add min/max price inputs that filter the product grid.", "code": "// HTML: <input id=\"minPrice\" type=\"number\" placeholder=\"Min\">\n//       <input id=\"maxPrice\" type=\"number\" placeholder=\"Max\">\n//       <button id=\"applyPriceBtn\">Apply</button>\n\ndocument.getElementById(\"applyPriceBtn\").addEventListener(\"click\", function() {\n  const minInput = document.getElementById(\"minPrice\").value;\n  const maxInput = document.getElementById(\"maxPrice\").value;\n\n  const min = minInput === \"\" ? 0 : Number(minInput);\n  const max = maxInput === \"\" ? Infinity : Number(maxInput);\n\n  const filtered = products.filter((p) => p.price >= min && p.price <= max);\n  renderProducts(filtered);\n});", "explanation": ["We handle EMPTY inputs gracefully: an empty min defaults to 0 (no lower limit), and an empty max defaults to Infinity (no upper limit) - so users can filter by just ONE side if they want.", "Number(minInput) converts the input's string value into an actual usable number, exactly like Day 44's validation lesson.", "p.price >= min && p.price <= max combines TWO conditions with && (Day 13) - a product must satisfy BOTH to be included.", "Infinity is a real, usable JavaScript value representing 'larger than anything' - perfect for an 'no maximum' case, since ANY real price will be <= Infinity."]}, "practice": {"easy": {"task": "Set only a MINIMUM price (leave max empty) and confirm products below that price are correctly excluded.", "answerCode": "// Test entering e.g. 700 in minPrice, leaving maxPrice empty, then clicking Apply.", "answerExplain": "Since max defaults to Infinity when empty, only the minimum boundary actually restricts anything.", "output": "(only products priced ₹700 or above remain visible)"}, "medium": {"task": "Add validation: if min is greater than max (both provided), show an error message instead of filtering.", "answerCode": "document.getElementById(\"applyPriceBtn\").addEventListener(\"click\", function() {\n  const minInput = document.getElementById(\"minPrice\").value;\n  const maxInput = document.getElementById(\"maxPrice\").value;\n  const min = minInput === \"\" ? 0 : Number(minInput);\n  const max = maxInput === \"\" ? Infinity : Number(maxInput);\n\n  if (min > max) {\n    console.log(\"Minimum price cannot be greater than maximum price.\");\n    return;\n  }\n\n  const filtered = products.filter((p) => p.price >= min && p.price <= max);\n  renderProducts(filtered);\n});", "answerExplain": "Checking min > max BEFORE filtering catches an illogical input combination early, giving clear feedback instead of just showing zero (confusing) results.", "output": "(entering min=1000 and max=500 shows the validation message instead of an empty grid)"}, "challenge": {"task": "Add preset price range BUTTONS (e.g. 'Under ₹500', '₹500-1000', 'Over ₹1000') that instantly fill in and apply a specific range, without the user manually typing numbers.", "answerCode": "function filterByRange(min, max) {\n  const filtered = products.filter((p) => p.price >= min && p.price <= max);\n  renderProducts(filtered);\n}\n\ndocument.getElementById(\"under500Btn\").addEventListener(\"click\", function() {\n  filterByRange(0, 500);\n});\ndocument.getElementById(\"mid500to1000Btn\").addEventListener(\"click\", function() {\n  filterByRange(500, 1000);\n});\ndocument.getElementById(\"over1000Btn\").addEventListener(\"click\", function() {\n  filterByRange(1000, Infinity);\n});", "answerExplain": "Extracting the shared filtering logic into a reusable filterByRange(min, max) function avoids repeating the same filter() code for each preset button.", "output": "(each preset button instantly applies its specific price range with one click)"}}, "realworld": {"text": "Every price-range slider or preset price filter you've used on a real shopping site works with this exact numeric comparison logic - just often with a fancier slider UI instead of plain number inputs.", "code": "// Sliders LOOK fancier, but under the hood they're still doing\n// this same: price >= min && price <= max comparison."}, "review": {"keyPoints": ["Empty min/max inputs can be handled gracefully by defaulting to 0 and Infinity respectively.", "Validating that min isn't greater than max prevents confusing, illogical filter results.", "Extracting shared filtering logic into a reusable function avoids repeating code across multiple preset buttons."], "quiz": [{"q": "What does JavaScript's Infinity represent?", "options": ["An error value", "A value larger than any real number", "Zero"], "answerIndex": 1, "explain": "Infinity is a real, usable value in JS representing an unbounded upper limit."}, {"q": "Why default an empty 'max' input to Infinity instead of, say, 0?", "options": ["It doesn't matter", "So 'no maximum entered' doesn't accidentally exclude everything", "It's required syntax"], "answerIndex": 1, "explain": "Defaulting to Infinity ensures an empty max means 'no upper limit', not 'nothing qualifies'."}], "interview": {"q": "Why is validating that min <= max (before filtering) good practice, even though the filter() itself would just harmlessly return an empty array if min > max?", "answer": "While it wouldn't crash, silently showing an empty result for an illogical input (min > max) confuses users, who might think there are genuinely no matching products rather than realizing they made an input mistake - proactive validation with a clear message provides much better user experience."}, "tomorrow": "Day 68 - Sorting: letting users reorder products by price or name."}}, {"day": 68, "title": "Sorting", "time": "60 minutes", "learn": {"en": "Today we add sorting - letting customers reorder the product grid (price low-to-high, high-to-low, or name A-Z) using JavaScript's built-in .sort() method.", "hi": "Aaj hum sorting add karte hain - customers ko product grid reorder karne dete hain (price low-to-high, high-to-low, ya name A-Z) JavaScript ke built-in .sort() method se.", "why": "Sorting is another near-universal e-commerce feature - shoppers often want to see the cheapest options first, or browse alphabetically.", "analogy": "Think of .sort() like a librarian rearranging books on a shelf according to a rule you specify (by title, by author, by size) - the SAME books, just in a different order.", "syntax": "array.sort((a, b) => a.price - b.price); // ascending by price"}, "teacher": {"intro": "Let's add sort options that reorder the product grid.", "code": "// HTML: <select id=\"sortSelect\">\n//         <option value=\"default\">Default</option>\n//         <option value=\"priceLow\">Price: Low to High</option>\n//         <option value=\"priceHigh\">Price: High to Low</option>\n//         <option value=\"nameAZ\">Name: A-Z</option>\n//       </select>\n\ndocument.getElementById(\"sortSelect\").addEventListener(\"change\", function() {\n  const sortType = this.value;\n  let sorted = [...products]; // copy, so we don't mutate the original array\n\n  if (sortType === \"priceLow\") {\n    sorted.sort((a, b) => a.price - b.price);\n  } else if (sortType === \"priceHigh\") {\n    sorted.sort((a, b) => b.price - a.price);\n  } else if (sortType === \"nameAZ\") {\n    sorted.sort((a, b) => a.name.localeCompare(b.name));\n  }\n\n  renderProducts(sorted);\n});", "explanation": ["[...products] uses the SPREAD operator to create a genuine COPY of the array - .sort() modifies the array it's called on directly, and we never want to accidentally reorder our original data.", "(a, b) => a.price - b.price is the comparison function for ascending order: if this returns negative, 'a' comes first; positive, 'b' comes first.", "Flipping to b.price - a.price simply reverses the order, for descending/high-to-low sorting.", ".localeCompare() is the proper way to compare STRINGS alphabetically (rather than the < / > operators, which can behave oddly with certain characters/cases)."]}, "practice": {"easy": {"task": "Select 'Price: Low to High' from the dropdown and confirm the cheapest product now appears first.", "answerCode": "// Just test selecting each option in the dropdown with the code above in place.", "answerExplain": "The comparison function a.price - b.price sorts ascending by price correctly.", "output": "(products now display starting from the lowest price)"}, "medium": {"task": "Add a 'Name: Z-A' (reverse alphabetical) sort option.", "answerCode": "} else if (sortType === \"nameZA\") {\n  sorted.sort((a, b) => b.name.localeCompare(a.name));\n}", "answerExplain": "Simply swapping which argument comes first in localeCompare() reverses the alphabetical order.", "output": "(products now display in reverse alphabetical order when this option is selected)"}, "challenge": {"task": "Combine sorting with search: after typing a search query, sorting should still apply correctly to the FILTERED results, not just the full product list.", "answerCode": "function getCurrentlyFilteredProducts() {\n  const query = document.getElementById(\"searchInput\").value.toLowerCase().trim();\n  return products.filter((p) => p.name.toLowerCase().includes(query));\n}\n\ndocument.getElementById(\"sortSelect\").addEventListener(\"change\", function() {\n  let sorted = [...getCurrentlyFilteredProducts()];\n  // ... apply the same sort logic to 'sorted' as before\n  renderProducts(sorted);\n});", "answerExplain": "By sorting the RESULT of the current filter (rather than always the full products array), sorting and searching now work together correctly, just like combining search and category filters on Day 66.", "output": "(sorting now correctly respects whatever is currently typed in the search box)"}}, "realworld": {"text": "Every 'Sort by' dropdown on a real e-commerce listing page uses this exact pattern - and combining it correctly with active filters (as in the challenge) is precisely what separates a polished real feature from a broken one.", "code": "// Getting sort + filter + search to all work together correctly\n// is one of the trickiest, most realistic parts of e-commerce UI."}, "review": {"keyPoints": ["array.sort((a, b) => a.value - b.value) sorts ascending; swapping to b.value - a.value sorts descending.", ".localeCompare() is the proper way to sort strings alphabetically.", "Combining sort with active filters means sorting the FILTERED results, not always the original full array."], "quiz": [{"q": "What does [...products] create?", "options": ["A reference to the same array", "A genuine copy of the array", "An error"], "answerIndex": 1, "explain": "Spread syntax creates a new array with copied contents, safe to sort without affecting the original."}, {"q": "Why not sort the original 'products' array directly?", "options": ["It's impossible", "sort() mutates the array in place, which we usually want to avoid for original source data", "It's slower"], "answerIndex": 1, "explain": "Sorting a copy protects your original source-of-truth data from being reordered unexpectedly."}], "interview": {"q": "Why does array.sort() require a comparison function like (a, b) => a.price - b.price, rather than just knowing 'ascending' or 'descending' automatically?", "answer": "JavaScript's sort() is generic and works on any data type/structure - it has no way of knowing WHICH property to compare on its own (price? name? something else?), so you must explicitly tell it how to compare any two items via the comparison function."}, "tomorrow": "Day 69 - Product Details: showing a full detail view for one selected product."}}, {"day": 69, "title": "Product Details", "time": "60 minutes", "learn": {"en": "Today we add a product DETAIL view - clicking a product card shows more complete information about that ONE item, using find() to locate it by id.", "hi": "Aaj hum ek product DETAIL view add karte hain - product card click karne se us EK item ki poori information dikhti hai, find() use karke id se locate karte hain.", "why": "A grid card shows just enough to browse - customers need a deeper view (full description, more images, specs) before actually deciding to buy.", "analogy": "Think of the grid as a store's shelf display, and the detail view as picking up ONE item to read the full label on the back - more information, focused on just that product.", "syntax": "const product = products.find((p) => p.id === selectedId);"}, "teacher": {"intro": "Let's make each product card clickable, showing a detail view for that specific product.", "code": "function createProductCard(product) {\n  return `\n    <div class=\"product-card\" data-id=\"${product.id}\">\n      <h3>${product.name}</h3>\n      <p class=\"price\">₹${product.price}</p>\n    </div>\n  `;\n}\n\nfunction attachCardListeners() {\n  document.querySelectorAll(\".product-card\").forEach((card) => {\n    card.addEventListener(\"click\", function() {\n      const id = Number(card.getAttribute(\"data-id\"));\n      showProductDetail(id);\n    });\n  });\n}\n\nfunction showProductDetail(id) {\n  const product = products.find((p) => p.id === id);\n  if (!product) return;\n\n  document.getElementById(\"detailView\").innerHTML = `\n    <h2>${product.name}</h2>\n    <p>Category: ${product.category}</p>\n    <p>Price: ₹${product.price}</p>\n    <p>Stock: ${product.stock > 0 ? product.stock + \" available\" : \"Out of stock\"}</p>\n  `;\n}\n\n// After every renderProducts() call, remember to call attachCardListeners() too!", "explanation": ["Each card now stores its id via data-id=\"${product.id}\" - this is how we know WHICH product was clicked.", "attachCardListeners() must be called AFTER rendering cards (since the elements need to exist before you can attach listeners to them) - this is a subtle but important ordering detail.", "Number(card.getAttribute(\"data-id\")) converts the attribute (always a string) back into a real number to correctly match against product.id.", "showProductDetail() uses find() (Day 28!) to locate the exact matching product, then renders a more detailed view of just that one item."]}, "practice": {"easy": {"task": "Click on a product card and confirm its full detail view appears correctly.", "answerCode": "// Test clicking any rendered product card with the code above in place.", "answerExplain": "The click handler correctly reads the id and finds/renders that specific product's details.", "output": "(the detail view shows the clicked product's name, category, price, and stock)"}, "medium": {"task": "Add a 'Close' button inside the detail view that clears it (sets innerHTML back to empty).", "answerCode": "function showProductDetail(id) {\n  const product = products.find((p) => p.id === id);\n  if (!product) return;\n\n  document.getElementById(\"detailView\").innerHTML = `\n    <h2>${product.name}</h2>\n    <p>Price: ₹${product.price}</p>\n    <button id=\"closeDetailBtn\">Close</button>\n  `;\n\n  document.getElementById(\"closeDetailBtn\").addEventListener(\"click\", function() {\n    document.getElementById(\"detailView\").innerHTML = \"\";\n  });\n}", "answerExplain": "Since the Close button is created FRESH each time inside showProductDetail(), we attach its listener right there too, after it's added to the page.", "output": "(clicking Close clears the detail view back to empty)"}, "challenge": {"task": "Remember to call attachCardListeners() after EVERY re-render (search, filter, sort) - test that clicking cards still works correctly even after filtering the grid.", "answerCode": "function renderProducts(productList) {\n  const container = document.getElementById(\"productGrid\");\n  container.innerHTML = productList.map(createProductCard).join(\"\");\n  attachCardListeners(); // MUST re-attach after every re-render, since old elements were destroyed\n}", "answerExplain": "Every time innerHTML is reassigned, the OLD elements (and their listeners) are destroyed - new elements need FRESH listeners attached, which is why attachCardListeners() belongs inside renderProducts() itself, not called separately just once.", "output": "(clicking cards works correctly even after searching or filtering, since listeners are re-attached every render)"}}, "realworld": {"text": "Clicking any product on a real e-commerce site to see its full detail page uses this exact id-based lookup pattern - even if the 'detail view' is a completely separate PAGE in a real app rather than a section on the same page.", "code": "// This id-lookup pattern is the foundation of product detail pages\n// across virtually every e-commerce platform in existence."}, "review": {"keyPoints": ["Storing a product's id on its card (via a data attribute) lets you identify WHICH one was clicked.", "Event listeners must be RE-ATTACHED after every re-render, since innerHTML replacement destroys old elements and their listeners.", "find() is the natural tool for looking up one specific item by id from a full data array."], "quiz": [{"q": "Why must attachCardListeners() be called again after every renderProducts() call?", "options": ["It's not necessary", "Because innerHTML replacement destroys old elements and their listeners", "To make the code longer"], "answerIndex": 1, "explain": "New elements from a fresh innerHTML assignment need their own new listeners attached."}, {"q": "Why convert the id from getAttribute() using Number()?", "options": ["It's unnecessary", "Because getAttribute() always returns a string, but product.id is a number", "To make it a string"], "answerIndex": 1, "explain": "Comparing a string id to a number id with === would fail, since === checks both value AND type."}], "interview": {"q": "This 'losing event listeners after innerHTML replacement' issue is a real, common gotcha in plain JavaScript. How do modern frameworks like React avoid this problem?", "answer": "Frameworks like React don't destroy and recreate the entire DOM on every update - they calculate the MINIMAL set of actual changes needed and apply only those, while intelligently preserving/reattaching event handling behind the scenes - this is part of why frameworks exist, to handle exactly this kind of repetitive, error-prone bookkeeping automatically."}, "tomorrow": "Day 70 - Add to Cart: the first real cart feature in JS Store."}}, {"day": 70, "title": "Add to Cart", "time": "60 minutes", "learn": {"en": "Today JS Store gets its first real cart feature - clicking 'Add to Cart' on a product stores it in a cart array, building directly on the mini-project pattern from Day 45.", "hi": "Aaj JS Store ko pehla real cart feature milta hai - product pe 'Add to Cart' click karne se woh cart array mein store hota hai, Day 45 ke mini-project pattern pe directly build karte hain.", "why": "A store without a working cart isn't really a store - this is the feature everything else (checkout, totals, quantities) will build on top of for the rest of Phase 5 and 6.", "analogy": "Think of today like installing the actual shopping basket dispensers at the store entrance - customers can now genuinely start collecting items as they browse.", "syntax": "cart.push({ ...product, quantity: 1 });"}, "teacher": {"intro": "Let's add an 'Add to Cart' button to each product card, storing selected items in a cart array.", "code": "let cart = [];\n\nfunction createProductCard(product) {\n  return `\n    <div class=\"product-card\" data-id=\"${product.id}\">\n      <h3>${product.name}</h3>\n      <p>₹${product.price}</p>\n      <button class=\"add-to-cart-btn\" data-id=\"${product.id}\">Add to Cart</button>\n    </div>\n  `;\n}\n\nfunction attachAddToCartListeners() {\n  document.querySelectorAll(\".add-to-cart-btn\").forEach((btn) => {\n    btn.addEventListener(\"click\", function(event) {\n      event.stopPropagation(); // prevent triggering the card's own click (detail view) too\n      const id = Number(btn.getAttribute(\"data-id\"));\n      addToCart(id);\n    });\n  });\n}\n\nfunction addToCart(productId) {\n  const product = products.find((p) => p.id === productId);\n  if (!product) return;\n\n  cart.push({ ...product, quantity: 1 });\n  console.log(`Added ${product.name} to cart. Cart now has ${cart.length} item(s).`);\n}", "explanation": ["{ ...product, quantity: 1 } uses the spread operator to COPY all of the product's existing properties, THEN adds a new 'quantity' property - a clean way to build a cart item from a product object.", "event.stopPropagation() prevents the button click from ALSO triggering the card's own click listener (from yesterday) - otherwise clicking 'Add to Cart' would also open the detail view, which we don't want.", "We look up the FULL product object via find() using just the id, rather than trying to pass the whole object through the button's data attribute.", "cart is currently just LOGGED - tomorrow, we'll build the actual visible cart display, and the day after, removal."]}, "practice": {"easy": {"task": "Click 'Add to Cart' on 2 different products and confirm the console shows the growing cart count correctly.", "answerCode": "// Test clicking Add to Cart on different product cards.", "answerExplain": "Each click pushes a new item into the shared cart array, growing its length.", "output": "Added Vitamin C to cart. Cart now has 1 item(s).\nAdded Omega 3 to cart. Cart now has 2 item(s)."}, "medium": {"task": "Prevent adding an OUT-OF-STOCK product to the cart, logging a message instead.", "answerCode": "function addToCart(productId) {\n  const product = products.find((p) => p.id === productId);\n  if (!product) return;\n\n  if (product.stock === 0) {\n    console.log(`${product.name} is out of stock and cannot be added.`);\n    return;\n  }\n\n  cart.push({ ...product, quantity: 1 });\n  console.log(`Added ${product.name} to cart.`);\n}", "answerExplain": "Checking product.stock === 0 before adding prevents an obviously invalid action, consistent with Day 48's error-handling principles.", "output": "Magnesium is out of stock and cannot be added."}, "challenge": {"task": "If a product is ALREADY in the cart, increase its quantity instead of adding a duplicate entry (hint: use find() on the cart array first).", "answerCode": "function addToCart(productId) {\n  const product = products.find((p) => p.id === productId);\n  if (!product || product.stock === 0) return;\n\n  const existingItem = cart.find((item) => item.id === productId);\n\n  if (existingItem) {\n    existingItem.quantity += 1;\n  } else {\n    cart.push({ ...product, quantity: 1 });\n  }\n\n  console.log(cart);\n}", "answerExplain": "Checking if the item ALREADY exists in the cart (via find()) and incrementing its quantity instead of duplicating it is exactly how real carts avoid having the same product listed twice.", "output": "(clicking Add to Cart repeatedly on the SAME product increases its quantity instead of creating duplicate entries)"}}, "realworld": {"text": "You've just built the exact core mechanism behind every 'Add to Cart' button on every real e-commerce site - including the crucial 'increase quantity instead of duplicating' logic from the challenge.", "code": "// This addToCart() function is functionally identical in spirit\n// to what real production e-commerce backends/frontends do."}, "review": {"keyPoints": ["The spread operator ({ ...product, quantity: 1 }) is a clean way to build a new object from an existing one, plus extra fields.", "event.stopPropagation() prevents a click from also triggering a PARENT element's own click listener.", "Checking if an item already exists in the cart (and incrementing quantity) avoids duplicate cart entries."], "quiz": [{"q": "What does { ...product, quantity: 1 } produce?", "options": ["The same object exactly, unchanged", "A NEW object with product's properties plus quantity", "An error"], "answerIndex": 1, "explain": "Spread copies existing properties into a new object, which can then have additional properties added."}, {"q": "What does event.stopPropagation() prevent?", "options": ["The click from happening at all", "The click from also triggering a parent element's own listener", "The page from loading"], "answerIndex": 1, "explain": "It stops the click event from 'bubbling up' to trigger other listeners on ancestor elements."}], "interview": {"q": "Why is it important to look up the FULL product object via find() using just an id, rather than trying to encode the entire product's data into the button's HTML attributes?", "answer": "Encoding full objects into HTML attributes is messy, error-prone (especially with special characters), and duplicates data unnecessarily. Passing just the id and looking up the full object from your single source-of-truth array keeps data consistent - if the product's price changes in your data, the cart lookup automatically reflects the current truth (until you actually decide to 'snapshot' a price, which is a separate consideration for real checkout flows)."}, "tomorrow": "Day 71 - Remove from Cart: letting customers take items back out."}}, {"day": 71, "title": "Remove from Cart", "time": "60 minutes", "learn": {"en": "Today we build a visible cart display AND the ability to remove items from it - completing the basic add/view/remove cycle every real cart needs.", "hi": "Aaj hum ek visible cart display banate hain AUR usme se items remove karne ki ability - basic add/view/remove cycle complete karte hain jo har real cart ko chahiye.", "why": "Adding items is only half the story - customers change their minds, and a cart that can't remove items would be frustrating and unusable.", "analogy": "Think of today like adding a way to put an item BACK on the shelf after picking it up - just as important as being able to pick it up in the first place.", "syntax": "cart = cart.filter((item) => item.id !== idToRemove);"}, "teacher": {"intro": "Let's render the cart visibly, with a Remove button on each item.", "code": "function renderCart() {\n  const cartContainer = document.getElementById(\"cartItems\");\n\n  if (cart.length === 0) {\n    cartContainer.innerHTML = \"<p>Your cart is empty.</p>\";\n    return;\n  }\n\n  cartContainer.innerHTML = cart.map((item) => `\n    <div class=\"cart-item\">\n      <span>${item.name} (x${item.quantity}) - ₹${item.price * item.quantity}</span>\n      <button class=\"remove-btn\" data-id=\"${item.id}\">Remove</button>\n    </div>\n  `).join(\"\");\n\n  document.querySelectorAll(\".remove-btn\").forEach((btn) => {\n    btn.addEventListener(\"click\", function() {\n      const id = Number(btn.getAttribute(\"data-id\"));\n      removeFromCart(id);\n    });\n  });\n}\n\nfunction removeFromCart(productId) {\n  cart = cart.filter((item) => item.id !== productId);\n  renderCart();\n}\n\n// Call renderCart() after every addToCart() too, so the display always stays current!", "explanation": ["item.price * item.quantity calculates that specific line's subtotal - price per unit times how many are in the cart.", "cart.filter((item) => item.id !== productId) is the classic 'remove by keeping everything else' pattern from Day 24's challenge, applied to objects instead of simple values.", "Just like Day 69's product cards, remove buttons need their listeners RE-ATTACHED after every render, since innerHTML replacement destroys the old ones.", "We must remember to call renderCart() at the END of addToCart() too (from yesterday) - otherwise the visible cart won't update when NEW items are added, only when items are removed."]}, "practice": {"easy": {"task": "Add a product to cart, then click Remove and confirm it disappears from the cart display.", "answerCode": "// Test the full flow: Add to Cart, then Remove, watching the cart display update.", "answerExplain": "removeFromCart() correctly filters out the matching item and re-renders.", "output": "(the item disappears from the cart display, and 'Your cart is empty' shows if it was the last one)"}, "medium": {"task": "Add a confirmation using a simple JavaScript confirm() dialog before actually removing an item.", "answerCode": "function removeFromCart(productId) {\n  const item = cart.find((i) => i.id === productId);\n  const confirmed = confirm(`Remove ${item.name} from your cart?`);\n\n  if (confirmed) {\n    cart = cart.filter((i) => i.id !== productId);\n    renderCart();\n  }\n}", "answerExplain": "confirm() is a built-in browser dialog returning true/false based on the user's choice - a simple way to prevent accidental removals.", "output": "(a browser confirmation popup appears before the item is actually removed)"}, "challenge": {"task": "Add a 'Clear Cart' button that empties the ENTIRE cart array with one click, with its own confirmation.", "answerCode": "document.getElementById(\"clearCartBtn\").addEventListener(\"click\", function() {\n  if (cart.length === 0) return;\n\n  const confirmed = confirm(\"Clear your entire cart?\");\n  if (confirmed) {\n    cart = [];\n    renderCart();\n  }\n});", "answerExplain": "Checking cart.length === 0 first avoids showing an unnecessary confirmation for an already-empty cart.", "output": "(clicking Clear Cart, after confirming, empties everything and shows the empty-cart message)"}}, "realworld": {"text": "Every real cart page's Remove button and 'empty cart' state uses exactly this filter-and-re-render pattern - you've now built the complete add/view/remove cycle that powers real shopping carts.", "code": "// Add + View + Remove is the complete core loop\n// of every e-commerce cart you've ever used."}, "review": {"keyPoints": ["cart.filter((item) => item.id !== idToRemove) is the standard pattern for removing a specific item from an array by id.", "Remember to re-render the cart display after BOTH adding AND removing items, so the UI always reflects current data.", "Built-in confirm() dialogs can add a simple safety check before destructive actions."], "quiz": [{"q": "What does cart.filter((item) => item.id !== productId) produce?", "options": ["The original cart, unchanged", "A new array excluding the matching item", "An error"], "answerIndex": 1, "explain": "filter() keeps everything that DOESN'T match the removal condition."}, {"q": "What does confirm() return?", "options": ["Nothing", "true or false, based on the user's choice", "Always true"], "answerIndex": 1, "explain": "confirm() shows a browser dialog and returns a Boolean based on OK/Cancel."}], "interview": {"q": "Real production apps rarely use the built-in confirm() dialog for confirmations. Why might that be?", "answer": "confirm() is a native BROWSER popup that can't be styled or customized to match an app's design/branding, and it's a blocking, old-fashioned interaction pattern. Real apps typically build custom modal/dialog components instead, giving full control over appearance and behavior while achieving the same 'are you sure?' safety check."}, "tomorrow": "Day 72 - Quantity Management: letting customers adjust quantities directly in the cart."}}, {"day": 72, "title": "Quantity Management", "time": "60 minutes", "learn": {"en": "Today we add +/- buttons directly in the cart, letting customers adjust an item's quantity without removing and re-adding it entirely.", "hi": "Aaj hum cart mein directly +/- buttons add karte hain, customers ko item ki quantity adjust karne dete hain use poori tarah remove aur re-add kiye bina.", "why": "Wanting 3 of something instead of 1 is extremely common - forcing a full remove-and-re-add cycle just to change quantity would be a poor experience.", "analogy": "Think of quantity +/- buttons like adjusting how many of an item you're putting in a physical basket - you don't take everything out and start over just to add one more.", "syntax": "item.quantity += 1; // or -= 1, with a check to prevent going below 1"}, "teacher": {"intro": "Let's add + and - buttons to each cart item, adjusting quantity directly.", "code": "function renderCart() {\n  const cartContainer = document.getElementById(\"cartItems\");\n\n  if (cart.length === 0) {\n    cartContainer.innerHTML = \"<p>Your cart is empty.</p>\";\n    return;\n  }\n\n  cartContainer.innerHTML = cart.map((item) => `\n    <div class=\"cart-item\">\n      <span>${item.name} - ₹${item.price * item.quantity}</span>\n      <button class=\"qty-btn\" data-id=\"${item.id}\" data-action=\"decrease\">-</button>\n      <span>${item.quantity}</span>\n      <button class=\"qty-btn\" data-id=\"${item.id}\" data-action=\"increase\">+</button>\n      <button class=\"remove-btn\" data-id=\"${item.id}\">Remove</button>\n    </div>\n  `).join(\"\");\n\n  document.querySelectorAll(\".qty-btn\").forEach((btn) => {\n    btn.addEventListener(\"click\", function() {\n      const id = Number(btn.getAttribute(\"data-id\"));\n      const action = btn.getAttribute(\"data-action\");\n      updateQuantity(id, action);\n    });\n  });\n  // (Remove button listeners attached same as yesterday)\n}\n\nfunction updateQuantity(productId, action) {\n  const item = cart.find((i) => i.id === productId);\n  if (!item) return;\n\n  if (action === \"increase\") {\n    item.quantity += 1;\n  } else if (action === \"decrease\") {\n    item.quantity -= 1;\n    if (item.quantity <= 0) {\n      cart = cart.filter((i) => i.id !== productId); // remove entirely if it hits 0\n    }\n  }\n\n  renderCart();\n}", "explanation": ["We store BOTH the id AND the intended action (\"increase\"/\"decrease\") as data attributes, letting ONE updateQuantity() function handle both buttons based on which was clicked.", "item.quantity += 1 modifies the cart item object DIRECTLY (since find() returns a reference to the actual object inside the array, not a copy) - no need to filter/rebuild the whole array just to update one field.", "When decreasing hits 0, we automatically remove that item entirely - a sensible real-world behavior (0 quantity means it's not really 'in' the cart anymore).", "renderCart() is called after every quantity change, keeping the displayed total and quantities always in sync with the underlying data."]}, "practice": {"easy": {"task": "Click + a few times on a cart item and confirm its quantity and subtotal both increase correctly.", "answerCode": "// Test clicking the + button on a cart item multiple times.", "answerExplain": "Each click increments item.quantity, and the recalculated subtotal (price * quantity) reflects it.", "output": "(quantity and subtotal both increase with each + click)"}, "medium": {"task": "Prevent quantity from exceeding the product's available STOCK (look up the original product to check its stock limit).", "answerCode": "function updateQuantity(productId, action) {\n  const item = cart.find((i) => i.id === productId);\n  const product = products.find((p) => p.id === productId);\n  if (!item || !product) return;\n\n  if (action === \"increase\") {\n    if (item.quantity < product.stock) {\n      item.quantity += 1;\n    } else {\n      console.log(\"Cannot exceed available stock.\");\n    }\n  } else if (action === \"decrease\") {\n    item.quantity -= 1;\n    if (item.quantity <= 0) {\n      cart = cart.filter((i) => i.id !== productId);\n    }\n  }\n\n  renderCart();\n}", "answerExplain": "Checking against the ORIGINAL product's stock (not the cart item, which doesn't track total available stock) prevents customers from ordering more than what's actually available.", "output": "(clicking + stops working once quantity matches the product's available stock, with a console message)"}, "challenge": {"task": "Calculate and display a GRAND TOTAL across the entire cart (summing price * quantity for every item), updating it every time renderCart() runs.", "answerCode": "function renderCart() {\n  const cartContainer = document.getElementById(\"cartItems\");\n  const totalEl = document.getElementById(\"cartGrandTotal\");\n\n  if (cart.length === 0) {\n    cartContainer.innerHTML = \"<p>Your cart is empty.</p>\";\n    totalEl.textContent = \"\";\n    return;\n  }\n\n  cartContainer.innerHTML = cart.map((item) => `...`).join(\"\"); // (cart item HTML as before)\n\n  const grandTotal = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);\n  totalEl.textContent = `Grand Total: ₹${grandTotal}`;\n\n  // (re-attach listeners as before)\n}", "answerExplain": "reduce() (Day 29!) combines every cart item's subtotal into one final grand total, recalculated fresh every single render.", "output": "(a running grand total appears below the cart items, always accurate)"}}, "realworld": {"text": "Every real cart's quantity stepper (+/- buttons) and live-updating total work exactly this way - and stock-limit checking (from the medium exercise) is a genuinely essential real-world safeguard.", "code": "// Quantity management + stock limits + live totals\n// is the true 'engine room' of any real shopping cart."}, "review": {"keyPoints": ["find() returns a REFERENCE to the actual object in an array, so modifying its properties directly updates the array too (no rebuild needed).", "Automatically removing an item when its quantity hits 0 is sensible, expected cart behavior.", "reduce() is the natural tool for calculating a grand total across all cart items."], "quiz": [{"q": "When you do 'const item = cart.find(...)' and then 'item.quantity += 1', does this actually change the cart array?", "options": ["No, item is a separate copy", "Yes, find() returns a reference to the real object", "Only if you call push() too"], "answerIndex": 1, "explain": "Objects are referenced, not copied, so modifying the found object modifies it within the original array too."}, {"q": "What's a sensible behavior when a cart item's quantity is decreased to 0?", "options": ["Show quantity as -1", "Automatically remove the item from the cart", "Nothing should happen"], "answerIndex": 1, "explain": "A quantity of 0 effectively means the item is no longer in the cart, so removing it makes sense."}], "interview": {"q": "Why is it important to check against the PRODUCT's stock (from the source-of-truth products array) rather than some stock value duplicated onto the cart item itself?", "answer": "If stock data were duplicated onto cart items, it could become OUT OF SYNC with the real current stock (e.g. if stock changes elsewhere) - always checking against the single source of truth (the original products array) ensures the limit is always accurate and consistent, rather than potentially stale."}, "tomorrow": "Day 73 - Cart Total: polishing and finalizing the cart summary display."}}, {"day": 73, "title": "Cart Total", "time": "60 minutes", "learn": {"en": "Today we polish the cart summary: item count, subtotal, and a clear grand total - the final numbers a customer checks before deciding to proceed to checkout.", "hi": "Aaj hum cart summary polish karte hain: item count, subtotal, aur ek clear grand total - woh final numbers jo customer checkout pe jaane se pehle check karta hai.", "why": "A trustworthy, clearly-displayed total is essential - customers need to see EXACTLY what they're about to pay, with no confusion, before committing to buy.", "analogy": "Think of today like a cashier clearly reading out your total and item count before you pay - clarity and accuracy here directly builds customer trust.", "syntax": "const itemCount = cart.reduce((sum, item) => sum + item.quantity, 0);"}, "teacher": {"intro": "Let's build a complete, polished cart summary section.", "code": "function renderCartSummary() {\n  const summaryEl = document.getElementById(\"cartSummary\");\n\n  const itemCount = cart.reduce((sum, item) => sum + item.quantity, 0);\n  const subtotal = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);\n  const shipping = subtotal >= 999 ? 0 : 49;\n  const grandTotal = subtotal + shipping;\n\n  summaryEl.innerHTML = `\n    <p>Items: ${itemCount}</p>\n    <p>Subtotal: ₹${subtotal}</p>\n    <p>Shipping: ${shipping === 0 ? \"Free\" : \"₹\" + shipping}</p>\n    <h3>Total: ₹${grandTotal}</h3>\n  `;\n}\n\n// Call renderCartSummary() every time renderCart() runs, keeping them in sync", "explanation": ["itemCount sums up QUANTITIES (not just cart.length, which would just count distinct products, not total items) - an important distinction for a genuinely accurate count.", "subtotal uses the same reduce() pattern from Day 72, calculating the pre-shipping total.", "We reuse the free-shipping-threshold logic pattern from Day 15's mini project (subtotal >= 999 ? 0 : 49) - showing how earlier lessons keep resurfacing in real features.", "grandTotal simply adds shipping to the subtotal - the final number the customer actually needs to see clearly."]}, "practice": {"easy": {"task": "Add 2 items with different quantities to the cart and confirm itemCount reflects the TOTAL quantity, not just 2 (the number of distinct products).", "answerCode": "// e.g. Add product A with quantity 3, and product B with quantity 2\n// itemCount should show 5, not 2", "answerExplain": "Summing item.quantity across the cart (rather than counting array entries) gives the true total item count.", "output": "Items: 5"}, "medium": {"task": "Add a message showing HOW MUCH MORE a customer needs to spend to qualify for free shipping, if they haven't yet.", "answerCode": "function renderCartSummary() {\n  const summaryEl = document.getElementById(\"cartSummary\");\n  const subtotal = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);\n  const shippingThreshold = 999;\n\n  let shippingMessage;\n  if (subtotal >= shippingThreshold) {\n    shippingMessage = \"You've qualified for free shipping!\";\n  } else {\n    const remaining = shippingThreshold - subtotal;\n    shippingMessage = `Add ₹${remaining} more for free shipping!`;\n  }\n\n  summaryEl.innerHTML = `<p>Subtotal: ₹${subtotal}</p><p>${shippingMessage}</p>`;\n}", "answerExplain": "This kind of encouraging, informative messaging is common in real carts, nudging customers toward the free-shipping threshold.", "output": "Add ₹450 more for free shipping!  (or a congratulatory message once qualified)"}, "challenge": {"task": "Handle the EMPTY cart case gracefully in renderCartSummary() - showing all zeros/appropriate messaging rather than confusing output.", "answerCode": "function renderCartSummary() {\n  const summaryEl = document.getElementById(\"cartSummary\");\n\n  if (cart.length === 0) {\n    summaryEl.innerHTML = \"<p>Add items to see your order summary.</p>\";\n    return;\n  }\n\n  const itemCount = cart.reduce((sum, item) => sum + item.quantity, 0);\n  const subtotal = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);\n  const shipping = subtotal >= 999 ? 0 : 49;\n\n  summaryEl.innerHTML = `\n    <p>Items: ${itemCount}</p>\n    <p>Subtotal: ₹${subtotal}</p>\n    <p>Shipping: ${shipping === 0 ? \"Free\" : \"₹\" + shipping}</p>\n    <h3>Total: ₹${subtotal + shipping}</h3>\n  `;\n}", "answerExplain": "Checking cart.length === 0 FIRST avoids showing a technically-correct-but-confusing '₹0 total, Free shipping' summary for a genuinely empty cart.", "output": "Add items to see your order summary."}}, "realworld": {"text": "This exact summary structure - item count, subtotal, shipping, total, with a free-shipping nudge - appears on nearly every real e-commerce cart/checkout page you've ever used.", "code": "// Items, Subtotal, Shipping, Total -\n// the universal 'four numbers' of any real cart summary."}, "review": {"keyPoints": ["Total item count should sum QUANTITIES, not just count distinct cart entries.", "Reusing patterns from earlier lessons (like the free-shipping ternary from Day 15) is normal and expected in real development.", "Handling the empty-cart edge case explicitly avoids showing confusing zero-value summaries."], "quiz": [{"q": "Why sum item.quantity rather than just using cart.length for the item count?", "options": ["No difference", "cart.length only counts distinct products, not total individual items", "It's required syntax"], "answerIndex": 1, "explain": "A cart with 1 product at quantity 5 has cart.length of 1, but itemCount should correctly show 5."}, {"q": "Why check for an empty cart FIRST in renderCartSummary()?", "options": ["It's not necessary", "To show clearer messaging instead of a confusing ₹0 summary", "It makes the code shorter"], "answerIndex": 1, "explain": "An explicit empty-state message is clearer than technically-correct-but-confusing zero values."}], "interview": {"q": "In a REAL production system, would shipping cost and tax calculations typically be trusted to happen ENTIRELY in the browser's JavaScript, or somewhere else too?", "answer": "While showing an ESTIMATE in the browser (like we've done) is great for user experience, the AUTHORITATIVE, final calculation (especially for actual payment) must also happen on the server - since client-side JavaScript can be manipulated by a user, trusting it alone for final pricing would be a serious security/business risk."}, "tomorrow": "Day 74 - Wishlist: a separate saved-for-later list, distinct from the cart."}}, {"day": 74, "title": "Wishlist", "time": "60 minutes", "learn": {"en": "Today we add a Wishlist - a separate list from the cart, for products customers want to SAVE for later without committing to buy right now.", "hi": "Aaj hum ek Wishlist add karte hain - cart se alag e
