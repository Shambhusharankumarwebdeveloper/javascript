non-existent property returns undefined, not an error."], "quiz": [{"q": "Which symbol creates an object?", "options": ["[ ]", "{ }", "( )"], "answerIndex": 1, "explain": "Curly braces { } define an object literal."}, {"q": "How do you access a property using dot notation?", "options": ["object[key]", "object.key", "object->key"], "answerIndex": 1, "explain": "Dot notation is object.propertyName."}], "interview": {"q": "When would you use an object instead of an array to store a single 'thing' like a product?", "answer": "When the data has multiple NAMED characteristics that don't have a natural order (name, price, stock) - objects make each piece of data self-describing via its key, unlike an array where you'd have to remember 'position 0 is the name, position 1 is the price'."}, "tomorrow": "Day 32 - Object Properties: reading, updating, and adding properties."}}, {"day": 32, "title": "Object Properties", "time": "60 minutes", "learn": {"en": "You can not only READ an object's properties, but also UPDATE existing ones or ADD entirely new ones, at any time after the object is created.", "hi": "Object ki properties ko sirf READ hi nahi, UPDATE aur ADD bhi kar sakte ho, object banne ke baad kabhi bhi.", "why": "A product's stock changes when items sell, a customer's info updates when they edit their profile - real objects change over time, and you need to know how to modify them safely.", "analogy": "Think of an object like a whiteboard with labeled sections - you can erase and rewrite the 'Price' section anytime, or even add a brand new section that wasn't there before.", "syntax": "object.key = newValue;       // update existing or add new\ndelete object.key;            // remove a property"}, "teacher": {"intro": "Let's update and add properties to a product object.", "code": "const product = {\n  name: \"Vitamin C\",\n  price: 999,\n  stock: 5\n};\n\nproduct.stock = 4;            // update existing property (one sold)\nproduct.onSale = true;        // add a brand new property\nconsole.log(product);\n\ndelete product.onSale;        // remove a property\nconsole.log(product);", "explanation": ["product.stock = 4; overwrites the existing value with a new one.", "product.onSale = true; ADDS a completely new property that wasn't in the original object definition.", "delete product.onSale; removes that property entirely from the object.", "Notice: even though product was declared with const, we can still MODIFY its properties - const only prevents reassigning the WHOLE variable to a different object, not changing what's inside it."]}, "practice": {"easy": {"task": "Create a product object, then update its price to a new value and log the updated object.", "answerCode": "const product = { name: \"Zinc\", price: 449 };\nproduct.price = 399;\nconsole.log(product);", "answerExplain": "Dot notation with = updates an existing property's value directly.", "output": "{ name: 'Zinc', price: 399 }"}, "medium": {"task": "Create a customer object with just a name, then ADD email and isVIP properties afterward, logging the object at each step.", "answerCode": "const customer = { name: \"Rahul\" };\nconsole.log(customer);\n\ncustomer.email = \"rahul@example.com\";\ncustomer.isVIP = false;\nconsole.log(customer);", "answerExplain": "New properties can be added anytime using dot notation with =, even if they weren't part of the original object.", "output": "{ name: 'Rahul' }\n{ name: 'Rahul', email: 'rahul@example.com', isVIP: false }"}, "challenge": {"task": "Create an object with const, then try reassigning the WHOLE variable to a different object (e.g. product = { ... };). Confirm this throws an error, unlike modifying a property.", "answerCode": "const product = { name: \"Vitamin C\" };\nproduct.name = \"Omega 3\"; // OK - modifying a property\n// product = { name: \"New Product\" }; // ERROR - can't reassign a const variable", "answerExplain": "const locks the VARIABLE (the reference to the object), not the object's contents - you can freely change properties, but you can't point the variable to an entirely different object.", "output": "(Uncommenting the reassignment line throws: TypeError: Assignment to constant variable.)"}}, "realworld": {"text": "Clicking 'Add to Wishlist' on a product often just runs product.isWishlisted = true - directly modifying that ONE property on the existing product object, without recreating the whole thing.", "code": "const product = { name: \"Omega 3\", isWishlisted: false };\nproduct.isWishlisted = true; // wishlist button clicked\nconsole.log(product);"}, "review": {"keyPoints": ["object.key = value updates an existing property or adds a new one.", "delete object.key removes a property entirely.", "const on an object prevents reassigning the WHOLE variable, but not modifying its properties."], "quiz": [{"q": "Can you modify a property of an object declared with const?", "options": ["No, never", "Yes", "Only numbers"], "answerIndex": 1, "explain": "const only locks the variable reference, not the object's internal properties."}, {"q": "What does 'delete object.key' do?", "options": ["Sets it to null", "Removes the property entirely", "Sets it to undefined"], "answerIndex": 1, "explain": "delete fully removes the property from the object."}], "interview": {"q": "Why does JavaScript allow modifying properties of a const object, but not reassigning the const variable itself?", "answer": "const creates an immutable BINDING (the variable name can't be pointed to a new value/object), but the object it points to is a separate, mutable thing in memory - const never made any promise about the object's internal contents, only about the variable's reference."}, "tomorrow": "Day 33 - Object Methods: functions that live INSIDE an object."}}, {"day": 33, "title": "Object Methods", "time": "60 minutes", "learn": {"en": "A method is simply a function stored as a property inside an object - it lets an object not just HOLD data, but also DO things related to that data.", "hi": "Method ek function hai jo object ke andar ek property ki tarah store hota hai - isse object sirf data hold nahi karta, balki us data se related kaam bhi kar sakta hai.", "why": "A cart object might need a method like getTotal() that calculates its own total - keeping the LOGIC bundled together with the DATA it operates on, rather than scattered elsewhere.", "analogy": "Think of a method like a built-in skill on an object - a calculator object doesn't just hold numbers, it also knows HOW to add them, because that skill (method) lives right inside it.", "syntax": "const objectName = {\n  key: value,\n  methodName: function() {\n    // code\n  }\n};\nobjectName.methodName();"}, "teacher": {"intro": "Let's give our product object a method that describes itself.", "code": "const product = {\n  name: \"Vitamin C\",\n  price: 999,\n  describe: function() {\n    console.log(`${this.name} costs ₹${this.price}`);\n  }\n};\n\nproduct.describe();", "explanation": ["describe: function() { ... } stores a FUNCTION as a property, just like any other value.", "product.describe() CALLS that method, exactly like calling a regular function, but through the object.", "this.name and this.price refer to the CURRENT object's own properties - 'this' means 'whichever object this method was called on'.", "Methods let related data and behavior live together in one place, instead of writing a separate standalone function that needs the object passed in as an argument."]}, "practice": {"easy": {"task": "Add a method greet() to a customer object that logs 'Hello, [name]!' using this.name.", "answerCode": "const customer = {\n  name: \"Priya\",\n  greet: function() {\n    console.log(`Hello, ${this.name}!`);\n  }\n};\ncustomer.greet();", "answerExplain": "this.name inside the method refers to the customer object's own name property.", "output": "Hello, Priya!"}, "medium": {"task": "Add a method isAffordable(budget) to a product object that takes a parameter and returns true if this.price is less than the budget.", "answerCode": "const product = {\n  name: \"Zinc\",\n  price: 449,\n  isAffordable: function(budget) {\n    return this.price < budget;\n  }\n};\nconsole.log(product.isAffordable(500));\nconsole.log(product.isAffordable(400));", "answerExplain": "Methods can accept parameters just like regular functions, while still using 'this' to access the object's own data.", "output": "true\nfalse"}, "challenge": {"task": "Use the modern shorthand method syntax (skip the word 'function' entirely) to rewrite the describe() method from the teaching example.", "answerCode": "const product = {\n  name: \"Vitamin C\",\n  price: 999,\n  describe() {\n    console.log(`${this.name} costs ₹${this.price}`);\n  }\n};\nproduct.describe();", "answerExplain": "Modern JavaScript allows dropping 'function' entirely for object methods - describe() { ... } is equivalent to describe: function() { ... }, just shorter.", "output": "Vitamin C costs ₹999"}}, "realworld": {"text": "A cart object in a real app often has methods like addItem(), removeItem(), and getTotal() bundled together - keeping all cart-related logic organized in one place instead of scattered across the codebase.", "code": "const cart = {\n  items: [],\n  addItem(item) {\n    this.items.push(item);\n  }\n};\ncart.addItem(\"Vitamin C\");\nconsole.log(cart.items);"}, "review": {"keyPoints": ["A method is a function stored as a property inside an object.", "'this' inside a method refers to the object the method was called on.", "Modern shorthand syntax lets you skip the word 'function' when defining methods."], "quiz": [{"q": "What does 'this' typically refer to inside an object method?", "options": ["The global window", "The object the method was called on", "Nothing"], "answerIndex": 1, "explain": "'this' refers to whichever object the method is currently being called through."}, {"q": "Is describe() { } valid modern shorthand for a method?", "options": ["No", "Yes", "Only for arrow functions"], "answerIndex": 1, "explain": "Modern JS allows this shorthand, equivalent to describe: function() { }."}], "interview": {"q": "Why can arrow functions cause problems when used as object methods that need 'this'?", "answer": "Arrow functions don't have their own 'this' - they inherit it from the surrounding scope (often the global scope), NOT the object they're attached to. So using an arrow function as a method and expecting this.name to work usually fails; regular functions (or shorthand method syntax) are used for methods that need 'this'."}, "tomorrow": "Day 34 - Nested Objects: objects inside objects (and arrays inside objects)."}}, {"day": 34, "title": "Nested Objects", "time": "60 minutes", "learn": {"en": "Objects can contain OTHER objects (and arrays) as property values - this is how real, complex data (like a full order with a customer, items, and address) is naturally structured.", "hi": "Objects ke andar OTHER objects (aur arrays) bhi ho sakte hain properties ke roop mein - isi tarah real, complex data (jaise poora order jisme customer, items, address ho) structure hota hai.", "why": "Real data is rarely flat - an order has a customer (itself an object) and a list of items (an array of objects). Nesting is how JS represents these real-world relationships.", "analogy": "Think of nested objects like a filing cabinet with folders inside folders - 'Orders' folder contains an 'Order #123' folder, which contains a 'Customer Details' sub-folder inside it.", "syntax": "const objectName = {\n  key: {\n    nestedKey: value\n  }\n};\nobjectName.key.nestedKey; // accessing nested value"}, "teacher": {"intro": "Let's build a small order object with a nested customer object and an array of items.", "code": "const order = {\n  orderId: \"WW1023\",\n  customer: {\n    name: \"Priya\",\n    email: \"priya@example.com\"\n  },\n  items: [\"Vitamin C\", \"Omega 3\"]\n};\n\nconsole.log(order.customer.name);   // nested object access\nconsole.log(order.items[0]);        // array inside object", "explanation": ["order.customer is itself an object - accessing order.customer.name chains dot notation TWICE to reach the nested value.", "order.items is an array, so we still use [index] to access a specific item, even though it's nested inside an object.", "This mixing of objects and arrays inside each other can go many levels deep in real applications (an order → items → each item → its own details).", "Reading nested data step by step (order → customer → name) helps avoid confusion, especially as structures get deeper."]}, "practice": {"easy": {"task": "Create a product object with a nested 'dimensions' object containing width and height, then log the height.", "answerCode": "const product = {\n  name: \"Vitamin C\",\n  dimensions: { width: 5, height: 10 }\n};\nconsole.log(product.dimensions.height);", "answerExplain": "Chaining dot notation (product.dimensions.height) reaches the nested value.", "output": "10"}, "medium": {"task": "Create a customer object with a nested 'address' object (street, city), then log a full sentence combining customer.name and both address fields.", "answerCode": "const customer = {\n  name: \"Rahul\",\n  address: { street: \"MG Road\", city: \"Vadodara\" }\n};\nconsole.log(`${customer.name} lives on ${customer.address.street}, ${customer.address.city}.`);", "answerExplain": "Nested values slot into template literals just like any other property access.", "output": "Rahul lives on MG Road, Vadodara."}, "challenge": {"task": "Create an order object with an items array where EACH item is itself an object (name, price). Loop through order.items and log each product's name and price.", "answerCode": "const order = {\n  orderId: \"WW1023\",\n  items: [\n    { name: \"Vitamin C\", price: 999 },\n    { name: \"Omega 3\", price: 799 }\n  ]\n};\n\nfor (let i = 0; i < order.items.length; i++) {\n  console.log(`${order.items[i].name}: ₹${order.items[i].price}`);\n}", "answerExplain": "This combines EVERYTHING so far: an object, containing an array, containing more objects - accessed using a loop and chained dot/bracket notation.", "output": "Vitamin C: ₹999\nOmega 3: ₹799"}}, "realworld": {"text": "A real order confirmation page reads data structured exactly like this: order.customer.name for the greeting, and looping through order.items (each with its own name/price/quantity) to build the receipt.", "code": "const order = { customer: { name: \"Priya\" }, items: [{ name: \"Zinc\", price: 449 }] };\nconsole.log(`Thanks, ${order.customer.name}! You ordered: ${order.items[0].name}`);"}, "review": {"keyPoints": ["Objects can contain other objects and arrays as property values.", "Chaining dot notation (a.b.c) reaches deeply nested values.", "Real-world data (orders, customers, carts) is almost always nested this way."], "quiz": [{"q": "How do you access a property TWO levels deep, like order.customer.name?", "options": ["order[customer][name]", "order.customer.name", "order->customer->name"], "answerIndex": 1, "explain": "Chained dot notation reaches nested properties, level by level."}, {"q": "Can an array be a property VALUE inside an object?", "options": ["No", "Yes", "Only for numbers"], "answerIndex": 1, "explain": "Arrays are valid values for any object property, just like strings or numbers."}], "interview": {"q": "What's a risk of deeply nested data structures (e.g. a.b.c.d.e), and how might you reduce that risk when reading a property that might not exist?", "answer": "If any level in the chain is undefined (e.g. b doesn't exist), trying to read .c on it throws an error ('cannot read property of undefined'). Modern JS uses optional chaining (a?.b?.c) to safely read deep properties without crashing if something along the way is missing."}, "tomorrow": "Day 35 - What is the DOM? Understanding how JavaScript sees your HTML page."}}, {"day": 35, "title": "What is the DOM?", "time": "60 minutes", "learn": {"en": "The DOM (Document Object Model) is how JavaScript 'sees' your HTML page - as a tree of objects it can read and change. This is the bridge between your JS code and the actual page a user sees.", "hi": "DOM (Document Object Model) yeh hai ki JavaScript tumhari HTML page ko kaise 'dekhta' hai - objects ke ek tree ki tarah jise woh read aur change kar sakta hai. Yeh JS code aur actual page ke beech ka bridge hai.", "why": "Everything you've learned so far (variables, functions, arrays, objects) has run only in the console. Starting today, you'll use JS to actually CHANGE what appears on a real web page.", "analogy": "Think of the DOM like a family tree of your HTML: <html> is the ancestor, <body> is a child, and every <div>, <h1>, <p> inside it is a descendant - JavaScript can 'visit' any member of this tree.", "syntax": "document // the entry point to the whole DOM tree"}, "teacher": {"intro": "Let's explore the 'document' object, which represents your entire HTML page.", "code": "console.log(document);              // the whole page, as an object\nconsole.log(document.title);        // the page's <title> text\nconsole.log(document.body);         // the <body> element", "explanation": ["'document' is a special built-in object that JavaScript automatically provides - it represents the ENTIRE loaded HTML page.", "document.title reads the text inside your page's <title> tag.", "document.body represents the <body> element and everything inside it.", "This is just the entry point - starting Day 36, we'll use document to find and grab SPECIFIC elements, not just the whole page."]}, "practice": {"easy": {"task": "In an HTML file with a <title>My Store</title>, log document.title from a linked script.js.", "answerCode": "// In script.js, linked to an HTML file with <title>My Store</title>\nconsole.log(document.title);", "answerExplain": "document.title always reflects whatever is inside the page's <title> tag.", "output": "My Store"}, "medium": {"task": "Log document.body.innerHTML to see the RAW HTML content inside your page's body (try this on any simple test page).", "answerCode": "console.log(document.body.innerHTML);", "answerExplain": "innerHTML gives you the actual HTML markup as a string - we'll use this property to CHANGE content starting Day 38.", "output": "(prints the raw HTML content of your <body>, exactly as written)"}, "challenge": {"task": "Log typeof document to see what 'kind' of thing document actually is in JavaScript.", "answerCode": "console.log(typeof document);", "answerExplain": "document is an 'object' - specifically the DOM tree's root, provided automatically by the browser (not something you create yourself).", "output": "object"}}, "realworld": {"text": "Every single interactive website feature - a dropdown opening, a button changing color, a live search filtering results - starts with JavaScript reading or modifying SOMETHING in the DOM.", "code": "console.log(\"Page title is:\", document.title);"}, "review": {"keyPoints": ["The DOM represents your HTML page as a tree of objects JavaScript can read and modify.", "'document' is the entry point to accessing the entire page.", "Starting tomorrow, you'll use the DOM to find and change SPECIFIC elements, not just the whole page."], "quiz": [{"q": "What does DOM stand for?", "options": ["Data Object Model", "Document Object Model", "Display Output Method"], "answerIndex": 1, "explain": "DOM stands for Document Object Model."}, {"q": "What does 'document' represent in JavaScript?", "options": ["A single button", "The entire loaded HTML page", "A CSS file"], "answerIndex": 1, "explain": "'document' is the object representing the whole page."}], "interview": {"q": "Why is the DOM described as a 'tree' structure?", "answer": "Because HTML elements are naturally nested inside one another (like <body> containing <div> containing <p>), forming a parent-child hierarchy - exactly like a family tree, with <html> as the root ancestor."}, "tomorrow": "Day 36 - Selecting HTML Elements: finding specific elements to work with."}}, {"day": 36, "title": "Selecting HTML Elements", "time": "60 minutes", "learn": {"en": "Before you can change any part of a page, you first need to SELECT (find) it. JavaScript provides several methods to grab specific HTML elements by their id, class, or tag.", "hi": "Page ka koi bhi part change karne se pehle, tumhe pehle usse SELECT (find) karna padta hai. JavaScript kuch methods deta hai specific HTML elements ko id, class, ya tag se grab karne ke liye.", "why": "You can't click a button that doesn't exist in your code's 'view' - selecting an element is always the FIRST step before reading, changing, or reacting to it.", "analogy": "Think of selecting elements like calling out a specific student's name in a classroom before giving them an instruction - you first need to identify EXACTLY who you're talking to.", "syntax": "document.getElementById(\"id\")\ndocument.querySelector(\"CSS selector\")\ndocument.querySelectorAll(\"CSS selector\")"}, "teacher": {"intro": "Let's select elements using the three most common methods, assuming an HTML page with a heading and some product divs.", "code": "// HTML: <h1 id=\"pageTitle\">My Store</h1>\nconst heading = document.getElementById(\"pageTitle\");\nconsole.log(heading);\n\n// HTML: <div class=\"product\">Vitamin C</div>\nconst firstProduct = document.querySelector(\".product\");\nconsole.log(firstProduct);\n\nconst allProducts = document.querySelectorAll(\".product\");\nconsole.log(allProducts.length);", "explanation": ["getElementById(\"pageTitle\") finds the ONE element with that exact id (ids must be unique on a page).", "querySelector(\".product\") finds the FIRST element matching a CSS-style selector (here, class='product') - note the dot before class names, just like in CSS.", "querySelectorAll(\".product\") finds ALL matching elements, returned as a list-like collection (a NodeList) you can loop through.", "querySelector/querySelectorAll accept ANY valid CSS selector - #id, .class, tag names, or even complex combinations."]}, "practice": {"easy": {"task": "Given <button id=\"buyBtn\">Buy Now</button>, select it using getElementById and log it.", "answerCode": "const buyBtn = document.getElementById(\"buyBtn\");\nconsole.log(buyBtn);", "answerExplain": "getElementById is the most direct way to grab a single element by its unique id.", "output": "(logs the actual <button> element)"}, "medium": {"task": "Given multiple <div class=\"card\">...</div> elements, select ALL of them and log how many were found.", "answerCode": "const cards = document.querySelectorAll(\".card\");\nconsole.log(cards.length);", "answerExplain": "querySelectorAll returns every matching element, and .length tells you how many were found.", "output": "(a number matching however many .card elements exist on the page)"}, "challenge": {"task": "Select an element using its TAG name only (e.g. all <p> tags) using querySelectorAll, and loop through them logging each one's text using .textContent (a preview of Day 37!).", "answerCode": "const paragraphs = document.querySelectorAll(\"p\");\nfor (let i = 0; i < paragraphs.length; i++) {\n  console.log(paragraphs[i].textContent);\n}", "answerExplain": "querySelectorAll works with plain tag names too, not just classes/ids - and NodeLists can be looped through just like arrays.", "output": "(logs the text content of every <p> element on the page)"}}, "realworld": {"text": "Before an 'Add to Cart' button can respond to clicks, JS must first SELECT it (e.g. document.getElementById('addToCartBtn')) - selection always comes before interaction.", "code": "const addToCartBtn = document.querySelector(\".add-to-cart-btn\");\nconsole.log(addToCartBtn);"}, "review": {"keyPoints": ["getElementById selects ONE element by its unique id.", "querySelector selects the FIRST matching element using any CSS selector.", "querySelectorAll selects ALL matching elements, returned as a loopable list."], "quiz": [{"q": "Which method selects an element by id?", "options": ["querySelector", "getElementById", "getElementByClass"], "answerIndex": 1, "explain": "getElementById is specifically for selecting by a unique id."}, {"q": "What does querySelectorAll return?", "options": ["Just the first match", "All matching elements", "Nothing"], "answerIndex": 1, "explain": "querySelectorAll returns every element matching the selector."}], "interview": {"q": "What happens if you call getElementById with an id that doesn't exist on the page?", "answer": "It returns null (not an error) - which is why real code should check if the result exists before trying to use it, otherwise attempting to modify a property on null will throw an error."}, "tomorrow": "Day 37 - Changing Text: updating what an element displays."}}, {"day": 37, "title": "Changing Text", "time": "60 minutes", "learn": {"en": "Once you've selected an element, you can change the TEXT it displays using .textContent - instantly updating what the user sees, without reloading the page.", "hi": "Element select karne ke baad, uska TEXT change kar sakte ho .textContent se - user jo dekhta hai woh instantly update ho jata hai, page reload kiye bina.", "why": "A live cart counter ('3 items'), a countdown timer, or a 'Thank you, [name]!' message all rely on JavaScript updating text on the fly.", "analogy": "Think of .textContent like a whiteboard marker - you're not replacing the whiteboard itself, just erasing and rewriting what's written on it.", "syntax": "element.textContent = \"new text\";"}, "teacher": {"intro": "Let's select a heading and change its text.", "code": "// HTML: <h1 id=\"greeting\">Welcome!</h1>\nconst greeting = document.getElementById(\"greeting\");\n\nconsole.log(greeting.textContent); // read current text\n\ngreeting.textContent = \"Welcome back, Priya!\"; // update it\nconsole.log(greeting.textContent);", "explanation": ["greeting.textContent (without assignment) READS the current text inside the element.", "greeting.textContent = \"...\" (with assignment) OVERWRITES it with new text.", "This change happens instantly and visibly on the actual rendered page - not just in the console.", "textContent only handles plain TEXT - if the new content includes HTML tags, they'll show as literal text, not be rendered as HTML (that's tomorrow's innerHTML)."]}, "practice": {"easy": {"task": "Given <p id=\"cartCount\">0 items</p>, change its text to '3 items'.", "answerCode": "const cartCount = document.getElementById(\"cartCount\");\ncartCount.textContent = \"3 items\";", "answerExplain": "Direct assignment to .textContent instantly updates the displayed text.", "output": "(the page now shows '3 items' instead of '0 items')"}, "medium": {"task": "Select a heading and update its text using a template literal combining a variable and fixed text.", "answerCode": "const customerName = \"Rahul\";\nconst greeting = document.getElementById(\"greeting\");\ngreeting.textContent = `Welcome back, ${customerName}!`;", "answerExplain": "You can build the new text dynamically using a template literal before assigning it.", "output": "(the heading now shows 'Welcome back, Rahul!')"}, "challenge": {"task": "Select ALL elements with class 'price' using querySelectorAll, loop through them, and update each one's text to add a ₹ symbol in front of its current value.", "answerCode": "const prices = document.querySelectorAll(\".price\");\nfor (let i = 0; i < prices.length; i++) {\n  prices[i].textContent = \"₹\" + prices[i].textContent;\n}", "answerExplain": "You can both READ and WRITE .textContent inside a loop, updating multiple elements at once based on their own current values.", "output": "(every element with class 'price' now shows a ₹ symbol before its number)"}}, "realworld": {"text": "Clicking + on a quantity selector updates a <span> showing the current quantity using exactly this technique - reading, incrementing, and rewriting .textContent.", "code": "const qtyDisplay = document.getElementById(\"qty\");\nlet quantity = parseInt(qtyDisplay.textContent);\nquantity++;\nqtyDisplay.textContent = quantity;"}, "review": {"keyPoints": [".textContent reads or updates an element's plain text.", "Assigning a new value to .textContent instantly changes what's visible on the page.", "HTML tags inside a .textContent assignment are shown as literal text, not rendered."], "quiz": [{"q": "What does element.textContent = \"Hello\" do?", "options": ["Deletes the element", "Sets its visible text to 'Hello'", "Adds a new element"], "answerIndex": 1, "explain": "It overwrites the element's text content with the new string."}, {"q": "Does changing .textContent require reloading the page?", "options": ["Yes", "No, it updates instantly", "Only on mobile"], "answerIndex": 1, "explain": "DOM changes via JavaScript happen instantly, without a page reload."}], "interview": {"q": "What's a key safety benefit of using .textContent instead of directly inserting raw HTML strings from user input?", "answer": "textContent treats everything as plain text, so it can't accidentally execute HTML or script tags - this helps prevent a security issue called XSS (Cross-Site Scripting), where malicious HTML/JS from user input could otherwise run on your page."}, "tomorrow": "Day 38 - Changing HTML: inserting actual HTML markup, not just plain text."}}, {"day": 38, "title": "Changing HTML", "time": "60 minutes", "learn": {"en": ".innerHTML lets you insert or replace actual HTML markup inside an element - not just plain text, but real tags like <strong>, <img>, or entire nested structures.", "hi": ".innerHTML se element ke andar actual HTML markup insert ya replace kar sakte ho - sirf plain text nahi, real tags jaise <strong>, <img>, ya poori nested structures.", "why": "Rendering a whole product card (with an image, bold price, and a button) inside a container requires inserting HTML, not just text - .innerHTML makes this possible.", "analogy": "Think of .innerHTML like renovating a room, not just repainting a wall - you can add entirely new furniture (tags), not just change the wall's color (text).", "syntax": "element.innerHTML = \"<strong>New HTML</strong>\";"}, "teacher": {"intro": "Let's insert a small styled product card into a container using innerHTML.", "code": "// HTML: <div id=\"productContainer\"></div>\nconst container = document.getElementById(\"productContainer\");\n\ncontainer.innerHTML = `\n  <h3>Vitamin C</h3>\n  <p><strong>₹999</strong></p>\n`;", "explanation": ["container.innerHTML = `...` inserts real HTML - the <h3> and <strong> tags actually RENDER as a heading and bold text, not literal text.", "Template literals (backticks) are commonly used here because they support multi-line strings, making the HTML easier to read.", "Anything previously inside the container gets COMPLETELY REPLACED by the new innerHTML - this isn't adding alongside, it's overwriting.", "Because innerHTML actually renders tags, inserting UNTRUSTED user input this way can be a security risk (unlike .textContent) - only use it with content you trust or have sanitized."]}, "practice": {"easy": {"task": "Given an empty <div id=\"box\">, use innerHTML to insert a heading and paragraph.", "answerCode": "const box = document.getElementById(\"box\");\nbox.innerHTML = \"<h2>Hello!</h2><p>Welcome to the store.</p>\";", "answerExplain": "Both tags render as actual HTML elements inside the div.", "output": "(the div now visually shows a heading and a paragraph)"}, "medium": {"task": "Build a small product card (name in <h3>, price in <strong> inside a <p>) using a template literal, and insert it into a container.", "answerCode": "const container = document.getElementById(\"productContainer\");\nconst name = \"Omega 3\";\nconst price = 799;\n\ncontainer.innerHTML = `\n  <h3>${name}</h3>\n  <p><strong>₹${price}</strong></p>\n`;", "answerExplain": "Combining template literals with innerHTML is exactly how dynamic content (using real variables) gets rendered as HTML.", "output": "(renders a heading with 'Omega 3' and bold '₹799')"}, "challenge": {"task": "Use innerHTML inside a loop to render MULTIPLE product cards from an array, building up one big HTML string before inserting it (hint: you'll need to build the string across loop iterations first).", "answerCode": "const products = [\"Vitamin C\", \"Omega 3\", \"Zinc\"];\nlet html = \"\";\n\nfor (let i = 0; i < products.length; i++) {\n  html += `<div class=\"card\">${products[i]}</div>`;\n}\n\ndocument.getElementById(\"productContainer\").innerHTML = html;", "answerExplain": "Building the full HTML string first (using += to append each round), then setting innerHTML ONCE at the end, is more efficient than updating innerHTML inside every loop round.", "output": "(renders three separate card divs, one per product)"}}, "realworld": {"text": "An entire product listing grid is rendered by building one big HTML string (using map() and join(), which we'll cover more later) and setting it via innerHTML just once.", "code": "const products = [\"Vitamin C\", \"Omega 3\"];\nconst html = products.map(p => `<div class=\"card\">${p}</div>`).join(\"\");\ndocument.getElementById(\"grid\").innerHTML = html;"}, "review": {"keyPoints": [".innerHTML inserts or replaces actual HTML markup, which gets rendered as real elements.", "Setting .innerHTML replaces ALL existing content inside that element.", "Never insert untrusted user input directly via innerHTML - it's a common source of security vulnerabilities (XSS)."], "quiz": [{"q": "Does .innerHTML render HTML tags, or show them as plain text?", "options": ["Renders them as real elements", "Shows them as plain text", "Causes an error"], "answerIndex": 0, "explain": "innerHTML actually parses and renders any HTML tags in the string."}, {"q": "What happens to existing content when you set .innerHTML?", "options": ["It's added alongside", "It's completely replaced", "Nothing changes"], "answerIndex": 1, "explain": "Assigning to innerHTML overwrites everything previously inside that element."}], "interview": {"q": "When would you choose .textContent over .innerHTML, even though innerHTML seems more powerful?", "answer": "Whenever you only need to display plain text (no actual HTML tags needed) - textContent is safer (immune to XSS from that content) and slightly faster, since the browser doesn't need to parse the string as HTML."}, "tomorrow": "Day 39 - Changing CSS: updating an element's style directly with JavaScript."}}, {"day": 39, "title": "Changing CSS", "time": "60 minutes", "learn": {"en": "JavaScript can directly change an element's CSS styles using .style, or (more commonly in real projects) by adding/removing CSS CLASSES that already define the desired styles.", "hi": "JavaScript element ki CSS styles ko directly .style se change kar sakta hai, ya (real projects mein zyada common) already-defined CSS CLASSES ko add/remove karke.", "why": "Highlighting a selected product, showing a red border on an invalid form field, or toggling dark mode - all require JS to change styling in response to something happening.", "analogy": "Think of .style like handing someone a single new item of clothing to put on right now, while classList is like handing them a whole pre-planned OUTFIT (a full set of styles) to switch into at once.", "syntax": "element.style.property = \"value\";\nelement.classList.add(\"className\");\nelement.classList.remove(\"className\");\nelement.classList.toggle(\"className\");"}, "teacher": {"intro": "Let's change a product card's appearance using both .style and .classList.", "code": "// HTML: <div id=\"card\">Vitamin C</div>\nconst card = document.getElementById(\"card\");\n\ncard.style.backgroundColor = \"lightyellow\"; // direct style change\ncard.style.border = \"2px solid orange\";\n\ncard.classList.add(\"highlighted\");           // add a CSS class\ncard.classList.remove(\"highlighted\");         // remove it\ncard.classList.toggle(\"highlighted\");         // add if missing, remove if present", "explanation": ["card.style.backgroundColor uses camelCase for CSS properties with hyphens (background-color becomes backgroundColor in JS).", "Direct .style changes work, but mixing lots of JS-driven styles gets messy fast in bigger projects.", "classList.add/remove/toggle work with CSS classes you've already DEFINED in your stylesheet - much cleaner, since the actual style RULES live in CSS, and JS just switches classes on/off.", "toggle() is especially handy for things like a 'selected' or 'active' state that flips on/off with each click."]}, "practice": {"easy": {"task": "Select an element and directly change its text color to red using .style.color.", "answerCode": "const el = document.getElementById(\"warning\");\nel.style.color = \"red\";", "answerExplain": "Direct style assignment immediately changes that one CSS property.", "output": "(the element's text turns red)"}, "medium": {"task": "Assuming a CSS class '.sold-out { opacity: 0.5; }' already exists in your stylesheet, use classList.add to apply it to a product card element.", "answerCode": "const card = document.getElementById(\"productCard\");\ncard.classList.add(\"sold-out\");", "answerExplain": "Adding a pre-defined class is cleaner than setting individual style properties directly in JS.", "output": "(the card visually fades to 50% opacity, using the CSS rule already defined)"}, "challenge": {"task": "Use classList.toggle to build a simple 'like button' effect: clicking toggles a 'liked' class on/off (simulate the click by just calling toggle() twice in a row and logging classList each time).", "answerCode": "const heart = document.getElementById(\"heartIcon\");\nheart.classList.toggle(\"liked\");\nconsole.log(heart.classList.contains(\"liked\")); // true\n\nheart.classList.toggle(\"liked\");\nconsole.log(heart.classList.contains(\"liked\")); // false", "answerExplain": "toggle() flips the class each time it's called - and classList.contains() lets you CHECK whether a class is currently applied.", "output": "true\nfalse"}}, "realworld": {"text": "A 'Sold Out' overlay on a product image is typically shown/hidden using classList.add('sold-out') / .remove('sold-out'), driven by whether the product's stock is 0.", "code": "const card = document.querySelector(\".product-card\");\nconst stock = 0;\nif (stock === 0) {\n  card.classList.add(\"sold-out\");\n}"}, "review": {"keyPoints": [".style.property directly sets ONE CSS property on an element.", "classList.add/remove/toggle work with pre-defined CSS classes - generally the cleaner, preferred approach.", "classList.contains() checks whether a class is currently applied."], "quiz": [{"q": "How do you write 'background-color' as a JS property?", "options": ["background-color", "backgroundColor", "background_color"], "answerIndex": 1, "explain": "CSS properties with hyphens become camelCase in JavaScript's .style object."}, {"q": "What does classList.toggle() do?", "options": ["Always adds the class", "Always removes the class", "Adds if missing, removes if present"], "answerIndex": 2, "explain": "toggle() flips the class's presence each time it's called."}], "interview": {"q": "Why is using classList generally preferred over setting many individual .style properties directly from JavaScript?", "answer": "It keeps styling rules defined in CSS (where they belong, easy to maintain and theme), while JS only controls WHICH state/class is active - separating 'what it looks like' from 'when it should look that way', which scales much better in larger projects."}, "tomorrow": "Day 40 - Creating Elements: building entirely new HTML elements with JavaScript."}}, {"day": 40, "title": "Creating Elements", "time": "60 minutes", "learn": {"en": "Beyond changing existing elements, JavaScript can CREATE entirely new HTML elements from scratch, and then insert them into the page - useful when you don't know in advance how many elements you'll need.", "hi": "Existing elements change karne ke aage, JavaScript bilkul naye HTML elements bhi CREATE kar sakta hai, aur unhe page mein insert kar sakta hai - jab tumhe pehle se pata na ho ki kitne elements chahiye honge.", "why": "A product list with an unknown number of items (5 today, 50 tomorrow) can't have its HTML hardcoded - you create exactly as many elements as needed, dynamically, based on real data.", "analogy": "Think of createElement like a 3D printer: instead of using furniture that already exists in the room (existing elements), you print a brand new piece from a blueprint (your code) and then place it.", "syntax": "const el = document.createElement(\"tagName\");\nel.textContent = \"...\";\nparentElement.appendChild(el);"}, "teacher": {"intro": "Let's create a new product card element from scratch and add it to the page.", "code": "// HTML: <div id=\"productList\"></div>\nconst newCard = document.createElement(\"div\");\nnewCard.textContent = \"Vitamin C - ₹999\";\nnewCard.classList.add(\"card\");\n\nconst productList = document.getElementById(\"productList\");\nproductList.appendChild(newCard);", "explanation": ["document.createElement(\"div\") creates a brand new <div>, but it doesn't exist on the page YET - it's just floating in memory.", "newCard.textContent and newCard.classList.add() configure the new element BEFORE it's placed on the page.", "productList.appendChild(newCard) actually attaches the new element as the LAST child inside productList, making it appear on the page.", "Without appendChild (or a similar method), a created element never becomes visible - creating and attaching are two separate, necessary steps."]}, "practice": {"easy": {"task": "Create a new <p> element with the text 'New Arrival!' and append it to a container with id 'notices'.", "answerCode": "const notice = document.createElement(\"p\");\nnotice.textContent = \"New Arrival!\";\ndocument.getElementById(\"notices\").appendChild(notice);", "answerExplain": "createElement + textContent + appendChild is the standard 3-step pattern for adding new content.", "output": "(a new paragraph reading 'New Arrival!' appears inside #notices)"}, "medium": {"task": "Create a new <button> element with text 'Add to Cart', give it a class 'btn-primary', and append it inside a product card container.", "answerCode": "const btn = document.createElement(\"button\");\nbtn.textContent = \"Add to Cart\";\nbtn.classList.add(\"btn-primary\");\ndocument.getElementById(\"productCard\").appendChild(btn);", "answerExplain": "Any HTML tag can be created this way, then styled/labeled before attaching it.", "output": "(a new styled button appears inside the product card)"}, "challenge": {"task": "Loop through an array of product names, creating and appending a new <div> for EACH one into a container.", "answerCode": "const products = [\"Vitamin C\", \"Omega 3\", \"Zinc\"];\nconst container = document.getElementById(\"productList\");\n\nfor (let i = 0; i < products.length; i++) {\n  const card = document.createElement(\"div\");\n  card.textContent = products[i];\n  card.classList.add(\"card\");\n  container.appendChild(card);\n}", "answerExplain": "This is the real technique behind rendering dynamic lists - looping to create AND append one new element per data item.", "output": "(three separate divs appear, one per product name)"}}, "realworld": {"text": "Every time a search result updates, new product card elements are created and appended (or old ones removed) to reflect the current filtered list - exactly using createElement + appendChild in a loop.", "code": "const products = [\"Vitamin C\"];\nconst grid = document.getElementById(\"grid\");\nproducts.forEach((name) => {\n  const card = document.createElement(\"div\");\n  card.textContent = name;\n  grid.appendChild(card);\n});"}, "review": {"keyPoints": ["document.createElement(tagName) creates a new element that doesn't appear on the page yet.", "You configure it (text, classes) BEFORE attaching it.", "appendChild attaches the new element inside a parent, making it visible."], "quiz": [{"q": "Does createElement alone make an element appear on the page?", "options": ["Yes", "No, it also needs appendChild (or similar)", "Only for buttons"], "answerIndex": 1, "explain": "Created elements exist in memory only until attached to the page."}, {"q": "What does appendChild do?", "options": ["Deletes an element", "Attaches an element as the last child of a parent", "Changes an element's text"], "answerIndex": 1, "explain": "appendChild inserts the element into the DOM as the parent's last child."}], "interview": {"q": "For rendering a large dynamic list, is it better to appendChild inside every loop iteration, or build elements first and append once? Why?", "answer": "Building elements (or an HTML string) first and inserting/appending once is generally more performant, since each DOM update can trigger the browser to recalculate layout - minimizing the number of separate DOM insertions reduces unnecessary rework, especially for large lists."}, "tomorrow": "Day 41 - Removing Elements: taking elements OFF the page."}}, {"day": 41, "title": "Removing Elements", "time": "60 minutes", "learn": {"en": "Just as you can create and add elements, you can also REMOVE them from the page entirely - essential for things like deleting a cart item or dismissing a notification.", "hi": "Jaise tum elements create/add kar sakte ho, waise hi unhe page se poori tarah REMOVE bhi kar sakte ho - cart item delete karne ya notification dismiss karne jaisi cheezon ke liye zaroori.", "why": "A cart isn't just about adding items - customers remove them too. Without a way to delete elements, your UI would only ever grow, never shrink.", "analogy": "Think of remove() like taking an item off a physical shelf - it's not just hidden behind something else, it's genuinely gone from that shelf.", "syntax": "element.remove();"}, "teacher": {"intro": "Let's remove a specific cart item element when a (simulated) 'remove' action happens.", "code": "// HTML: <div id=\"item1\" class=\"cart-item\">Vitamin C</div>\nconst item = document.getElementById(\"item1\");\n\nconsole.log(\"Before:\", document.getElementById(\"item1\")); // exists\n\nitem.remove();\n\nconsole.log(\"After:\", document.getElementById(\"item1\")); // null - it's gone!", "explanation": ["element.remove() is the modern, simplest way to delete an element from the page entirely.", "After removal, trying to select that same element again (e.g. by its old id) returns null, since it no longer exists in the DOM.", "This is different from just HIDING an element (e.g. with CSS display:none) - remove() actually deletes it from the page's structure.", "An older technique, parentElement.removeChild(element), does the same thing but requires referencing the PARENT first - .remove() is simpler and doesn't need this."]}, "practice": {"easy": {"task": "Given <p id=\"notice\">Sale ends soon!</p>, remove it directly.", "answerCode": "const notice = document.getElementById(\"notice\");\nnotice.remove();", "answerExplain": ".remove() deletes the element directly, no parent reference needed.", "output": "(the paragraph disappears from the page entirely)"}, "medium": {"task": "Select ALL elements with class 'expired-banner' using querySelectorAll, and loop through removing each one.", "answerCode": "const banners = document.querySelectorAll(\".expired-banner\");\nfor (let i = 0; i < banners.length; i++) {\n  banners[i].remove();\n}", "answerExplain": "Looping through a NodeList and calling .remove() on each item removes every matching element.", "output": "(every element with class 'expired-banner' disappears)"}, "challenge": {"task": "Simulate removing a cart item and then checking if the cart container is now empty (hint: check container.children.length after removal).", "answerCode": "// HTML: <div id=\"cart\"><div id=\"item1\">Vitamin C</div></div>\nconst cart = document.getElementById(\"cart\");\ndocument.getElementById(\"item1\").remove();\n\nif (cart.children.length === 0) {\n  console.log(\"Your cart is empty.\");\n}", "answerExplain": "element.children gives you the direct child elements, and .length tells you how many remain - useful for showing an 'empty state' message.", "output": "Your cart is empty."}}, "realworld": {"text": "Clicking the trash icon next to a cart item calls something like cartItemElement.remove() - instantly deleting that item's card from the visible cart list.", "code": "function removeCartItem(itemId) {\n  document.getElementById(itemId).remove();\n}\nremoveCartItem(\"item1\");"}, "review": {"keyPoints": ["element.remove() deletes an element from the page entirely.", "After removal, selecting that element again returns null.", "Removing is different from hiding - removed elements are gone from the DOM structure, not just invisible."], "quiz": [{"q": "What does element.remove() do?", "options": ["Hides the element with CSS", "Deletes it from the page entirely", "Changes its color"], "answerIndex": 1, "explain": "remove() actually removes the element from the DOM, not just visually hides it."}, {"q": "After removing an element, what does re-selecting it by its old id return?", "options": ["The same element", "null", "undefined"], "answerIndex": 1, "explain": "Since the element no longer exists in the DOM, selecting it returns null."}], "interview": {"q": "What's the difference between removing an element and just hiding it with CSS (display: none)?", "answer": "Hiding with CSS keeps the element in the DOM (just not visible/rendered), so it can be shown again instantly and its data/state is preserved. Removing deletes it entirely from the DOM - if you need it back, you'd have to recreate it from scratch, potentially losing any state it held."}, "tomorrow": "Day 42 - Click Events: making elements respond when a user clicks them."}}, {"day": 42, "title": "Click Events", "time": "60 minutes", "learn": {"en": "An event is something that HAPPENS on a page - a click, a key press, a page load. Today we make an element actually RESPOND when a user clicks it, using onclick.", "hi": "Event woh cheez hai jo page pe HOTI hai - click, key press, page load. Aaj hum ek element ko actually RESPOND karayenge jab user usse click kare, onclick use karke.", "why": "Everything interactive - buttons, links, toggles - relies on responding to click events. This is where your page truly comes alive.", "analogy": "Think of onclick like a doorbell: pressing it (the click) triggers a specific action (the sound) - the button is just waiting, ready to react the moment it's pressed.", "syntax": "element.onclick = function() {\n  // runs when clicked\n};"}, "teacher": {"intro": "Let's make a button respond to clicks by changing text on the page.", "code": "// HTML: <button id=\"buyBtn\">Buy Now</button> <p id=\"status\"></p>\nconst buyBtn = document.getElementById(\"buyBtn\");\nconst status = document.getElementById(\"status\");\n\nbuyBtn.onclick = function() {\n  status.textContent = \"Added to cart!\";\n};", "explanation": ["buyBtn.onclick = function() { ... } assigns a function to RUN whenever this button is clicked - it does NOT run immediately when this line executes.", "Inside the function, we're free to do anything - here, updating another element's text.", "This function is sometimes called an 'event handler' or 'callback' (a function that runs LATER, in response to something).", "Notice we're not calling the function ourselves (no parentheses after 'function') - the BROWSER calls it automatically, only when the click actually happens."]}, "practice": {"easy": {"task": "Given a button with id 'clickMe', make it log 'Button clicked!' when clicked.", "answerCode": "const btn = document.getElementById(\"clickMe\");\nbtn.onclick = function() {\n  console.log(\"Button clicked!\");\n};", "answerExplain": "The function only runs once the actual click happens, not when this code first executes.", "output": "(nothing yet - only logs 'Button clicked!' once the button is actually clicked)"}, "medium": {"task": "Make a button toggle text between 'Show More' and 'Show Less' each time it's clicked (hint: check the button's own current textContent inside the handler).", "answerCode": "const toggleBtn = document.getElementById(\"toggleBtn\");\ntoggleBtn.onclick = function() {\n  if (toggleBtn.textContent === \"Show More\") {\n    toggleBtn.textContent = \"Show Less\";\n  } else {\n    toggleBtn.textContent = \"Show More\";\n  }\n};", "answerExplain": "Each click re-runs the handler, which checks the CURRENT text and flips it - a simple toggle pattern.", "output": "(clicking repeatedly alternates the button's own text between the two states)"}, "challenge": {"task": "Attach onclick handlers to MULTIPLE buttons (selected via querySelectorAll) inside a loop, where each one logs its own index number when clicked.", "answerCode": "const buttons = document.querySelectorAll(\".product-btn\");\nfor (let i = 0; i < buttons.length; i++) {\n  buttons[i].onclick = function() {\n    console.log(`Button number ${i} was clicked`);\n  };\n}", "answerExplain": "Each button gets its OWN handler function, and thanks to how 'let' works inside for loops, each handler correctly remembers its own specific 'i' value.", "output": "(clicking any button logs its own specific index number)"}}, "realworld": {"text": "Literally every 'Add to Cart', 'Buy Now', 'Remove', and 'Wishlist' button on any e-commerce site relies on an onclick (or similar) handler to actually DO something when pressed.", "code": "document.getElementById(\"addToCartBtn\").onclick = function() {\n  console.log(\"Item added to cart!\");\n};"}, "review": {"keyPoints": ["An event is something that happens on the page, like a click.", "element.onclick = function() { } assigns code to run WHEN the click happens, not immediately.", "The browser automatically calls your handler function at the right time - you never call it yourself."], "quiz": [{"q": "When does the function assigned to onclick actually run?", "options": ["Immediately, when the line executes", "Only when the element is clicked", "Never"], "answerIndex": 1, "explain": "onclick handlers run only in response to an actual click."}, {"q": "Should you write buyBtn.onclick = myFunction() (with parentheses)?", "options": ["Yes, always", "No - that would call it immediately instead of assigning it", "Doesn't matter"], "answerIndex": 1, "explain": "Adding () calls the function right away and assigns its RESULT, not the function itself - a common beginner mistake."}], "interview": {"q": "What's a limitation of using element.onclick directly, compared to addEventListener (which we'll cover tomorrow)?", "answer": "An element's .onclick property can only hold ONE handler function at a time - assigning a second one overwrites the first. addEventListener allows multiple independent handlers to be attached to the same event on the same element."}, "tomorrow": "Day 43 - Event Listeners: the more powerful, flexible way to handle events."}}, {"day": 43, "title": "Event Listeners", "time": "60 minutes", "learn": {"en": "addEventListener() is the modern, more powerful way to respond to events - it allows MULTIPLE handlers on the same element/event, and works with far more event types than just clicks.", "hi": "addEventListener() events handle karne ka modern, zyada powerful tarika hai - isse EK element/event pe MULTIPLE handlers lag sakte hain, aur yeh sirf clicks se zyada event types ke saath kaam karta hai.", "why": "Real projects almost always use addEventListener instead of onclick, since it's more flexible and is considered the current best practice.", "analogy": "Think of addEventListener like subscribing multiple people to the same notification - unlike onclick (which only lets ONE person 'own' that notification slot), many listeners can react independently to the same event.", "syntax": "element.addEventListener(\"eventType\", function() {\n  // runs when event happens\n});"}, "teacher": {"intro": "Let's rewrite yesterday's button example using addEventListener, and add a SECOND independent listener too.", "code": "// HTML: <button id=\"buyBtn\">Buy Now</button>\nconst buyBtn = document.getElementById(\"buyBtn\");\n\nbuyBtn.addEventListener(\"click\", function() {\n  console.log(\"First listener: Item added to cart!\");\n});\n\nbuyBtn.addEventListener(\"click\", function() {\n  console.log(\"Second listener: Logging analytics event.\");\n});", "explanation": ["addEventListener(\"click\", function() { ... }) attaches a handler for the 'click' event type specifically.", "BOTH listeners run independently when the button is clicked - unlike onclick, adding a second one doesn't overwrite the first.", "The first argument (\"click\") can be swapped for other event types too: \"mouseover\", \"keydown\", \"submit\", and many more.", "addEventListener is the modern standard - expect to see and use it constantly in real projects (and later, in React)."]}, "practice": {"easy": {"task": "Attach a single click listener to a button that logs 'Clicked!' using addEventListener.", "answerCode": "const btn = document.getElementById(\"myBtn\");\nbtn.addEventListener(\"click\", function() {\n  console.log(\"Clicked!\");\n});", "answerExplain": "This is the standard modern pattern for handling clicks.", "output": "(logs 'Clicked!' each time the button is pressed)"}, "medium": {"task": "Attach TWO separate click listeners to the same button, each logging a different message, and confirm both run.", "answerCode": "const btn = document.getElementById(\"myBtn\");\nbtn.addEventListener(\"click\", function() {\n  console.log(\"Listener 1 ran\");\n});\nbtn.addEventListener(\"click\", function() {\n  console.log(\"Listener 2 ran\");\n});", "answerExplain": "Unlike onclick, multiple listeners on the same event coexist and all run independently.", "output": "Listener 1 ran\nListener 2 ran"}, "challenge": {"task": "Use addEventListener with the 'mouseover' event to change an element's background color when the mouse hovers over it (no click needed).", "answerCode": "const card = document.getElementById(\"productCard\");\ncard.addEventListener(\"mouseover\", function() {\n  card.style.backgroundColor = \"lightyellow\";\n});", "answerExplain": "addEventListener works with many event types beyond click - 'mouseover' fires whenever the cursor enters the element.", "output": "(the card's background turns light yellow whenever the mouse hovers over it)"}}, "realworld": {"text": "Real e-commerce sites attach listeners for many event types: 'click' for buttons, 'input' for live search boxes, 'submit' for checkout forms, and 'mouseover' for image zoom previews.", "code": "document.getElementById(\"searchBox\").addEventListener(\"input\", function() {\n  console.log(\"User is typing a search query...\");\n});"}, "review": {"keyPoints": ["addEventListener(eventType, handlerFunction) is the modern standard for handling events.", "Multiple listeners can be attached to the same event on the same element, unlike onclick.", "Event types go beyond click - mouseover, input, submit, keydown, and many more."], "quiz": [{"q": "Can you attach multiple listeners for the same event using addEventListener?", "options": ["No", "Yes", "Only two maximum"], "answerIndex": 1, "explain": "addEventListener supports multiple independent listeners on the same event."}, {"q": "What's the first argument to addEventListener?", "options": ["The handler function", "The event type as a string", "The element"], "answerIndex": 1, "explain": "The first argument specifies WHICH event to listen for, like 'click' or 'mouseover'."}], "interview": {"q": "How would you REMOVE an event listener that was added with addEventListener?", "answer": "Using removeEventListener(eventType, handlerFunctionReference) - importantly, you must pass the SAME function reference used when adding it (not an anonymous copy), which is why handlers you plan to remove later are often stored in a named variable first."}, "tomorrow": "Day 44 - Forms and Validation: reading user input and checking it before use."}}, {"day": 44, "title": "Forms and Validation", "time": "60 minutes", "learn": {"en": "Forms let users type input (like an email or coupon code), which JavaScript can read using .value, and VALIDATE (check it's correct/complete) before using it further.", "hi": "Forms se users input type karte hain (jaise email ya coupon code), jise JavaScript .value se read kar sakta hai, aur VALIDATE kar sakta hai (check karna ki sahi/complete hai) aage use karne se pehle.", "why": "You can't trust that users will always type valid data - checking a coupon code isn't empty, or an email looks like an email, prevents bugs and bad experiences later in the process.", "analogy": "Think of validation like a bouncer checking ID at a club entrance - before letting the data 'inside' your logic, you check it meets the basic requirements.", "syntax": "inputElement.value // reads the current text in an input field"}, "teacher": {"intro": "Let's read a coupon code from an input field and validate it's not empty before applying it.", "code": "// HTML: <input id=\"couponInput\" type=\"text\"> <button id=\"applyBtn\">Apply</button>\nconst couponInput = document.getElementById(\"couponInput\");\nconst applyBtn = document.getElementById(\"applyBtn\");\n\napplyBtn.addEventListener(\"click\", function() {\n  const code = couponInput.value.trim();\n\n  if (code === \"\") {\n    console.log(\"Please enter a coupon code.\");\n  } else {\n    console.log(`Applying coupon: ${code}`);\n  }\n});", "explanation": ["couponInput.value reads whatever text is CURRENTLY typed into that input field.", ".trim() removes accidental leading/trailing spaces (a common source of 'invisible' validation bugs).", "if (code === \"\") checks whether the trimmed input is empty, before proceeding.", "This runs fresh every time the button is clicked, always reading the LATEST value typed - not whatever was there when the page first loaded."]}, "practice": {"easy": {"task": "Read the value from an input with id 'nameInput' when a button is clicked, and log it.", "answerCode": "const nameInput = document.getElementById(\"nameInput\");\nconst btn = document.getElementById(\"submitBtn\");\n\nbtn.addEventListener(\"click\", function() {\n  console.log(nameInput.value);\n});", "answerExplain": ".value always reflects whatever the user has currently typed.", "output": "(logs whatever text is currently in the input field)"}, "medium": {"task": "Validate an email input: log 'Please enter an email' if empty, otherwise log 'Email received: [value]'.", "answerCode": "const emailInput = document.getElementById(\"emailInput\");\nconst btn = document.getElementById(\"submitBtn\");\n\nbtn.addEventListener(\"click\", function() {\n  const email = emailInput.value.trim();\n  if (email === \"\") {\n    console.log(\"Please enter an email\");\n  } else {\n    console.log(`Email received: ${email}`);\n  }\n});", "answerExplain": "Basic presence-checking is the simplest, most common form of validation.", "output": "(depends on what's typed - either the warning or the confirmation message)"}, "challenge": {"task": "Validate that a quantity input contains a valid NUMBER greater than 0 (hint: use Number() to convert .value, then check isNaN() and > 0).", "answerCode": "const qtyInput = document.getElementById(\"qtyInput\");\nconst btn = document.getElementById(\"submitBtn\");\n\nbtn.addEventListener(\"click\", function() {\n  const qty = Number(qtyInput.value);\n\n  if (isNaN(qty) || qty <= 0) {\n    console.log(\"Please enter a valid quantity greater than 0.\");\n  } else {\n    console.log(`Quantity accepted: ${qty}`);\n  }\n});", "answerExplain": "Number() converts the string input into an actual number (or NaN if it's not a valid number at all); isNaN() checks for that failure case, combined with a check that it's a positive value.", "output": "(depends on input - validates both non-numeric AND non-positive values)"}}, "realworld": {"text": "A checkout form validates the address, phone number, and payment fields are all filled in correctly BEFORE allowing the 'Place Order' button to actually submit the order.", "code": "const addressInput = document.getElementById(\"address\");\nif (addressInput.value.trim() === \"\") {\n  console.log(\"Address is required.\");\n}"}, "review": {"keyPoints": ["inputElement.value reads the current text typed into an input field.", ".trim() removes accidental leading/trailing whitespace before checking.", "Validating input (checking it's present, correct format, or a real number) prevents bad data from causing bugs later."], "quiz": [{"q": "What does inputElement.value return?", "options": ["The input's id", "The current text typed into it", "Always an empty string"], "answerIndex": 1, "explain": ".value always reflects the current, live content of the input."}, {"q": "What does isNaN(value) check?", "options": ["If a value is negative", "If a value is NOT a valid number", "If a value is a string"], "answerIndex": 1, "explain": "isNaN returns true if the value is 'Not a Number' (invalid numeric conversion)."}], "interview": {"q": "Why is CLIENT-SIDE validation (in the browser, using JS) alone not enough for real security-sensitive checks?", "answer": "Client-side JS can be bypassed entirely (e.g. by disabling JS or sending requests directly), so it should only be used for immediate user feedback/convenience - genuine security-critical validation must ALSO happen on the server, which the client cannot tamper with."}, "tomorrow": "Day 45 - Mini Project: Interactive Shopping Cart, combining all of Phase 3!"}}, {"day": 45, "title": "Mini Project: Interactive Shopping Cart", "time": "60 minutes", "learn": {"en": "Today's Mini Project combines all of Phase 3: objects, the DOM, selecting elements, changing text/HTML/CSS, creating/removing elements, and event listeners - building a real interactive shopping cart.", "hi": "Aaj ka Mini Project Phase 3 ka sab kuch combine karta hai: objects, DOM, elements select karna, text/HTML/CSS change karna, elements create/remove karna, aur event listeners - ek real interactive shopping cart banate hain.", "why": "This is the biggest project yet, and the first one that's TRULY interactive on a real page - clicking buttons will visibly add/remove items, exactly like a real e-commerce feature.", "analogy": "Think of this like your first solo shift running a small shop counter - handling real customers adding and removing items, updating the running total live, no training wheels.", "syntax": "(No new syntax today - combining Days 31-44!)"}, "teacher": {"intro": "Let's build a shopping cart: an array of cart items (objects), rendered as HTML, with working Add and Remove buttons and a live total.", "code": "// HTML needed:\n// <div id=\"cartItems\"></div>\n// <p id=\"cartTotal\"></p>\n// <button id=\"addBtn\">Add Vitamin C (₹999)</button>\n\nlet cart = [];\n\nfunction renderCart() {\n  const cartItemsDiv = document.getElementById(\"cartItems\");\n  const cartTotalP = document.getElementById(\"cartTotal\");\n\n  cartItemsDiv.innerHTML = \"\"; // clear before re-rendering\n\n  for (let i = 0; i < cart.length; i++) {\n    const itemDiv = document.createElement(\"div\");\n    itemDiv.textContent = `${cart[i].name} - ₹${cart[i].price}`;\n\n    const removeBtn = document.createElement(\"button\");\n    removeBtn.textContent = \"Remove\";\n    removeBtn.addEventListener(\"click\", function() {\n      cart.splice(i, 1); // remove this item from the array\n      renderCart();       // re-render everything\n    });\n\n    itemDiv.appendChild(removeBtn);\n    cartItemsDiv.appendChild(itemDiv);\n  }\n\n  const total = cart.reduce((sum, item) => sum + item.price, 0);\n  cartTotalP.textContent = `Total: ₹${total}`;\n}\n\ndocument.getElementById(\"addBtn\").addEventListener(\"click\", function() {\n  cart.push({ name: \"Vitamin C\", price: 999 });\n  renderCart();\n});\n\nrenderCart(); // initial render (empty cart)", "explanation": ["cart is an array of OBJECTS - each with a name and price - exactly combining Days 22 (Arrays) and 31 (Objects).", "renderCart() is a function that clears and REBUILDS the entire cart display from the current cart array, every single time anything changes.", "Each Remove button gets its OWN event listener using splice(i, 1) (a method that removes 1 item at a specific index) followed by re-rendering.", "The Add button pushes a new item into the array, then calls renderCart() again - this 'change data, then re-render everything' pattern is the foundation of how frameworks like React work internally!"]}, "practice": {"easy": {"task": "Add a SECOND 'Add' button for a different product (e.g. Omega 3, ₹799) that also pushes to the same cart array and re-renders.", "answerCode": "document.getElementById(\"addOmegaBtn\").addEventListener(\"click\", function() {\n  cart.push({ name: \"Omega 3\", price: 799 });\n  renderCart();\n});", "answerExplain": "Since renderCart() reads from the shared cart array, any button that pushes to it and calls renderCart() works the same way.", "output": "(clicking this new button adds Omega 3 to the visible cart and updates the total)"}, "medium": {"task": "Modify renderCart() to show 'Your cart is empty' inside cartItems when the cart array has no items.", "answerCode": "function renderCart() {\n  const cartItemsDiv = document.getElementById(\"cartItems\");\n  const cartTotalP = document.getElementById(\"cartTotal\");\n  cartItemsDiv.innerHTML = \"\";\n\n  if (cart.length === 0) {\n    cartItemsDiv.textContent = \"Your cart is empty.\";\n  } else {\n    for (let i = 0; i < cart.length; i++) {\n      // ... (same rendering logic as before)\n    }\n  }\n\n  const total = cart.reduce((sum, item) => sum + item.price, 0);\n  cartTotalP.textContent = `Total: ₹${total}`;\n}", "answerExplain": "Checking cart.length === 0 lets you show a friendly empty-state message instead of a blank container.", "output": "(shows 'Your cart is empty.' whenever all items have been removed)"}, "challenge": {"task": "Add a 'Clear Cart' button that empties the ENTIRE cart array at once (hint: cart.length = 0; is one way to empty an array in place) and re-renders.", "answerCode": "document.getElementById(\"clearBtn\").addEventListener(\"click\", function() {\n  cart.length = 0; // empties the array while keeping it the same variable\n  renderCart();\n});", "answerExplain": "Setting .length = 0 on an array is a quick way to remove ALL items at once, since it's declared with 'let' and we want to keep using the SAME array reference elsewhere in our code.", "output": "(clicking Clear Cart empties everything and shows the empty-cart message)"}}, "realworld": {"text": "You've just built the exact core pattern used by every real shopping cart widget: data (array of objects) → render function → event listeners that update data and re-render. This 'data drives the UI' idea is the foundation of modern frontend frameworks.", "code": "// This IS how React, Vue, and other frameworks think under the hood -\n// you've just done it manually with plain JavaScript!"}, "review": {"keyPoints": ["Real interactive features combine DATA (arrays/objects) with RENDERING (DOM manipulation) and EVENTS (listeners).", "Re-rendering the whole cart display from the current data, every time something changes, is simpler and less error-prone than trying to manually patch small DOM changes.", "This 'data → render → events update data → re-render' loop is the foundation of how frameworks like React work."], "quiz": [{"q": "What does cart.splice(i, 1) do?", "options": ["Adds an item at position i", "Removes 1 item starting at position i", "Doubles the array"], "answerIndex": 1, "explain": "splice(i, 1) removes exactly 1 item starting at index i."}, {"q": "Why does renderCart() clear cartItemsDiv.innerHTML at the start?", "options": ["To make the code shorter", "So old items aren't duplicated when re-rendering", "It's required by JavaScript"], "answerIndex": 1, "explain": "Clearing first prevents old rendered items from stacking up alongside newly rendered ones."}], "interview": {"q": "Why might manually re-rendering the ENTIRE cart on every single change become a performance problem in a much larger, more complex application?", "answer": "Rebuilding and re-inserting large amounts of HTML repeatedly can be slow and cause visible flickering, especially with many items or frequent updates - this exact problem is what led to frameworks like React, which cleverly calculate and apply only the MINIMAL necessary DOM changes instead of rebuilding everything from scratch."}, "tomorrow": "Day 46 - Starting Phase 4: Scope - understanding where variables are visible and usable."}}, {"day": 46, "title": "Scope", "time": "60 minutes", "learn": {"en": "Scope determines WHERE in your code a variable can be accessed. Variables declared inside a function or block are usually only visible INSIDE that function/block, not outside it.", "hi": "Scope decide karta hai ki code mein KAHAN se variable access ho sakta hai. Function ya block ke andar declare kiya gaya variable usually sirf uske ANDAR visible hota hai, bahar nahi.", "why": "Understanding scope prevents confusing bugs like 'why can't I access this variable here?' or accidental overwriting of variables with the same name in different parts of your code.", "analogy": "Think of scope like rooms in a house: what happens in the kitchen (a function) generally stays in the kitchen - people in the living room (outside the function) can't directly grab something from inside it.", "syntax": "function example() {\n  let insideVar = \"only visible here\";\n}\n// insideVar is NOT accessible out here"}, "teacher": {"intro": "Let's see scope in action with a function-scoped variable.", "code": "function checkStock() {\n  let stock = 5;\n  console.log(stock); // works fine - we're INSIDE the function\n}\n\ncheckStock();\n// console.log(stock); // ERROR - stock doesn't exist out here!\n\nlet globalPrice = 999; // declared OUTSIDE any function\n\nfunction showPrice() {\n  console.log(globalPrice); // works! Functions CAN see outer/global variables\n}\nshowPrice();", "explanation": ["'stock' is LOCAL to checkStock() - it only exists while that function is running, and only inside it.", "Trying to access 'stock' outside the function throws an error, because it's out of scope there.", "'globalPrice' is declared OUTSIDE any function, making it GLOBAL - accessible from anywhere, including inside functions.", "This shows an important rule: inner scopes (functions) CAN see outer/global variables, but outer scopes CANNOT see inner/local variables."]}, "practice": {"easy": {"task": "Create a function with a local variable, log it INSIDE the function, and confirm (in a comment) that logging it outside would cause an error.", "answerCode": "function testScope() {\n  let message = \"Hello from inside!\";\n  console.log(message);\n}\ntestScope();\n// console.log(message); // Would throw: message is not defined", "answerExplain": "Local variables only exist within the function's own scope.", "output": "Hello from inside!"}, "medium": {"task": "Create a global variable and TWO different functions that both read (but don't modify) it, confirming both can access it.", "answerCode": "let storeName = \"WeightWorld\";\n\nfunction greet() {\n  console.log(`Welcome to ${storeName}`);\n}\nfunction footer() {\n  console.log(`© ${storeName}`);\n}\ngreet();\nfooter();", "answerExplain": "Global variables are accessible from any function, since functions can always see outer scope.", "output": "Welcome to WeightWorld\n© WeightWorld"}, "challenge": {"task": "Declare a variable with the SAME name both globally and inside a function. Log it in both places - does the function's local version 'win' inside its own scope?", "answerCode": "let price = 999; // global\n\nfunction showPrice() {\n  let price = 449; // local - a DIFFERENT variable, same name\n  console.log(price); // uses the LOCAL one\n}\n\nshowPrice();\nconsole.log(price); // uses the GLOBAL one - unaffected", "answerExplain": "When a local variable shares a name with a global one, the local version takes priority (shadows it) WITHIN that function - the global variable outside remains completely untouched.", "output": "449\n999"}}, "realworld": {"text": "Keeping cart-related variables scoped INSIDE a cart-handling function (rather than as loose globals) prevents accidental conflicts with similarly-named variables elsewhere in a large real project.", "code": "function handleCartUpdate() {\n  let updatedTotal = 0; // safely local - won't clash with anything elsewhere\n}"}, "review": {"keyPoints": ["Variables declared inside a function/block are only accessible within that function/block (local scope).", "Global variables (declared outside any function) are accessible everywhere.", "A local variable with the same name as a global one takes priority within its own scope, without affecting the global one."], "quiz": [{"q": "Can code OUTSIDE a function access a variable declared INSIDE it?", "options": ["Yes, always", "No", "Only with const"], "answerIndex": 1, "explain": "Local variables are not accessible from outside their function."}, {"q": "Can code INSIDE a function access a GLOBAL variable?", "options": ["No", "Yes", "Only with var"], "answerIndex": 1, "explain": "Inner scopes can always see outer/global variables."}], "interview": {"q": "What's the difference between 'function scope' and 'block scope' in JavaScript?", "answer": "Function scope means a variable is visible throughout the entire function it's declared in (this is how 'var' behaves). Block scope means a variable is only visible within the specific { } block (like an if statement or loop) it's declared in - this is how 'let' and 'const' behave, which is part of why they're preferred over 'var'."}, "tomorrow": "Day 47 - Callbacks: passing a function AS an argument to another function."}}, {"day": 47, "title": "Callbacks", "time": "60 minutes", "learn": {"en": "A callback is a function passed AS AN ARGUMENT into another function, to be called later - you've actually already used these with map(), filter(), and event listeners without naming the pattern!", "hi": "Callback ek function hai jo doosre function ke andar ARGUMENT ki tarah pass hota hai, taaki baad mein call ho - tum yeh already use kar chuke ho map(), filter(), aur event listeners mein, bina naam jaane!", "why": "Understanding 'callback' as a named concept helps you recognize this exact pattern everywhere - especially once we reach asynchronous code (APIs, timers) in a few days.", "analogy": "Think of a callback like leaving instructions with a friend: 'When the delivery arrives, call me' - you're not doing the calling yourself right now, you're handing over a specific action to be triggered LATER, by someone/something else.", "syntax": "function outerFunction(callback) {\n  callback(); // calling the passed-in function\n}"}, "teacher": {"intro": "Let's write our own function that accepts a callback, to see exactly how map()/addEventListener() work internally.", "code": "function processOrder(orderTotal, callback) {\n  console.log(`Processing order of ₹${orderTotal}...`);\n  callback(); // run whatever function was passed in\n}\n\nprocessOrder(999, function() {\n  console.log(\"Order processed! Sending confirmation email.\");\n});", "explanation": ["processOrder(orderTotal, callback) accepts a SECOND parameter which is expected to be a FUNCTION.", "Inside processOrder, callback() actually CALLS whatever function was passed in as that second argument.", "When we call processOrder(999, function() {...}), we're passing an entire function AS a value - exactly like passing a number or string, but it happens to be a function.", "This is the exact same mechanism behind array.map((item) => {...}) - map() internally calls YOUR function once per item, just like we called 'callback' here."]}, "practice": {"easy": {"task": "Write a function greetUser(name, callback) that logs a greeting, then calls the callback afterward.", "answerCode": "function greetUser(name, callback) {\n  console.log(`Hello, ${name}!`);\n  callback();\n}\n\ngreet
