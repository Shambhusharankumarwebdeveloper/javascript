<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>JavaScript in 90 Days — For Working Professionals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+Devanagari:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1C2321;
  --ink-soft:#4A5250;
  --paper:#EEF0F0;
  --card:#FFFFFF;
  --line:#DBDFDE;
  --teal:#2F5754;
  --teal-dark:#1F3B39;
  --amber:#C7801A;
  --amber-soft:#F3E3C8;
  --green:#3F7D58;
  --red:#B34A3C;
  --code-bg:#1E2A2A;
  --code-ink:#E7ECEA;
  --code-accent:#7FD8C4;
  --radius-sm:6px;
  --radius-md:10px;
  --shadow-card:0 1px 2px rgba(28,35,33,0.06), 0 1px 1px rgba(28,35,33,0.04);
  --font-display:"Fraunces", serif;
  --font-body:"IBM Plex Sans", -apple-system, sans-serif;
  --font-mono:"IBM Plex Mono", monospace;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font-body);
  background:var(--paper);
  color:var(--ink);
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
h1,h2,h3,h4{font-family:var(--font-display);margin:0 0 0.5em 0;line-height:1.2;font-weight:600;}
p{margin:0 0 1em 0;}
code, pre{font-family:var(--font-mono);}
a{color:var(--teal);}
button{font-family:var(--font-body);cursor:pointer;}
::selection{background:var(--amber-soft);}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px;}

/* ---------- App Shell ---------- */
.app{
  display:grid;
  grid-template-columns: 300px 1fr;
  min-height:100vh;
}

/* ---------- Sidebar ---------- */
.sidebar{
  background:var(--teal-dark);
  color:#DDEAE6;
  padding:24px 0 40px 0;
  overflow-y:auto;
  height:100vh;
  position:sticky;
  top:0;
}
.sidebar-brand{
  padding:0 20px 20px 20px;
  border-bottom:1px solid rgba(255,255,255,0.12);
  margin-bottom:12px;
}
.sidebar-brand .eyebrow{
  font-size:12px;
  letter-spacing:0.02em;
  color:#9FC4BC;
  margin-bottom:4px;
}
.sidebar-brand h1{
  font-size:22px;
  color:#fff;
  margin:0;
}
.sidebar-progress{
  padding:14px 20px;
  margin:0 0 8px 0;
}
.sidebar-progress-bar{
  height:8px;
  border-radius:4px;
  background:rgba(255,255,255,0.14);
  overflow:hidden;
  margin-top:8px;
}
.sidebar-progress-fill{
  height:100%;
  background:linear-gradient(90deg, var(--code-accent), #B7E3D6);
  border-radius:4px;
  transition:width 0.5s ease;
}
.sidebar-progress-label{
  font-size:13px;
  color:#B7CFC9;
  display:flex;
  justify-content:space-between;
}
.phase-group{
  margin-bottom:6px;
}
.phase-title{
  font-size:12px;
  text-transform:none;
  letter-spacing:0.01em;
  color:#8FB6AE;
  padding:14px 20px 6px 20px;
  font-weight:600;
}
.day-item{
  display:flex;
  align-items:center;
  gap:10px;
  padding:9px 20px;
  font-size:14.5px;
  color:#D3E4E0;
  cursor:pointer;
  border-left:3px solid transparent;
  transition:background 0.15s ease;
}
.day-item:hover{background:rgba(255,255,255,0.06);}
.day-item.active{
  background:rgba(255,255,255,0.09);
  border-left-color:var(--code-accent);
  color:#fff;
}
.day-item.locked{
  color:#6D8B84;
  cursor:default;
}
.day-item .marker{
  width:18px;height:18px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;flex-shrink:0;
  border:1.5px solid #5C8078;
  color:#5C8078;
}
.day-item.done .marker{
  background:var(--code-accent);
  border-color:var(--code-accent);
  color:var(--teal-dark);
}
.day-item.active .marker{border-color:#fff;color:#fff;}
.day-item .day-num{font-weight:600;flex-shrink:0;width:44px;color:#9FC4BC;}
.day-item.active .day-num{color:#fff;}
.day-item .day-title{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.day-item.locked .day-title{font-style:italic;}

.sidebar-hamburger{display:none;}

/* ---------- Main ---------- */
.main{padding:32px 40px 80px 40px;max-width:900px;}

/* Dashboard hero */
.dashboard-hero{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius-md);
  padding:32px;
  box-shadow:var(--shadow-card);
  margin-bottom:28px;
  display:grid;
  grid-template-columns:1fr auto;
  gap:24px;
  align-items:center;
}
.dashboard-hero .eyebrow{
  color:var(--amber);
  font-size:13px;
  font-weight:600;
  margin-bottom:6px;
}
.dashboard-hero h2{font-size:30px;margin-bottom:6px;}
.dashboard-hero .meta{color:var(--ink-soft);font-size:14.5px;}
.ring-wrap{position:relative;width:110px;height:110px;flex-shrink:0;}
.ring-wrap svg{transform:rotate(-90deg);}
.ring-bg{fill:none;stroke:var(--paper);stroke-width:10;}
.ring-fill{fill:none;stroke:var(--amber);stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset 0.6s ease;}
.ring-label{
  position:absolute;top:0;left:0;width:100%;height:100%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.ring-label .pct{font-size:22px;font-weight:700;font-family:var(--font-display);}
.ring-label .sub{font-size:11px;color:var(--ink-soft);}

.hero-actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;}
.btn{
  border:none;border-radius:var(--radius-sm);
  padding:10px 18px;font-size:14.5px;font-weight:600;
  transition:transform 0.1s ease, opacity 0.15s ease;
}
.btn:active{transform:scale(0.97);}
.btn-primary{background:var(--teal);color:#fff;}
.btn-primary:hover{background:var(--teal-dark);}
.btn-secondary{background:var(--paper);color:var(--ink);border:1px solid var(--line);}
.btn-secondary:hover{background:#E4E7E6;}
.btn-ghost{background:transparent;color:var(--red);border:1px solid rgba(179,74,60,0.3);}
.btn-ghost:hover{background:rgba(179,74,60,0.06);}
.streak-chip{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--amber-soft);color:#8A5A0F;
  padding:5px 12px;border-radius:20px;font-size:13.5px;font-weight:600;
}

/* Section timeline blocks */
.timeline{position:relative;padding-left:6px;}
.time-block{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius-md);
  padding:24px 26px;
  margin-bottom:20px;
  box-shadow:var(--shadow-card);
}
.time-block-head{
  display:flex;align-items:baseline;gap:12px;margin-bottom:14px;
  flex-wrap:wrap;
}
.time-range{
  font-family:var(--font-mono);
  font-size:12.5px;
  color:var(--teal);
  background:rgba(47,87,84,0.08);
  padding:3px 9px;
  border-radius:20px;
  font-weight:600;
  white-space:nowrap;
}
.time-block h3{font-size:19px;margin:0;}
.lang-pair{display:grid;grid-template-columns:1fr;gap:14px;margin-bottom:14px;}
@media (min-width:720px){.lang-pair{grid-template-columns:1fr 1fr;}}
.lang-card{
  background:var(--paper);
  border-radius:var(--radius-sm);
  padding:14px 16px;
}
.lang-card .flag{font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:6px;letter-spacing:0.02em;}
.callout{
  background:#FBF3E7;
  border-left:3px solid var(--amber);
  padding:10px 14px;
  border-radius:4px;
  font-size:14.5px;
  margin:12px 0;
}
.callout.analogy{background:#EEF4F2;border-left-color:var(--teal);}

pre.code-block{
  background:var(--code-bg);
  color:var(--code-ink);
  border-radius:var(--radius-sm);
  padding:16px 18px;
  overflow-x:auto;
  font-size:13.5px;
  line-height:1.65;
  margin:10px 0;
  -webkit-overflow-scrolling:touch;
}
pre.code-block .cm{color:#7C948F;}
code.inline{background:var(--paper);padding:1px 6px;border-radius:4px;font-size:0.92em;}

.explain-list{margin:10px 0 0 0;padding-left:0;list-style:none;}
.explain-list li{
  padding:8px 0 8px 26px;
  position:relative;
  border-top:1px solid var(--line);
  font-size:14.5px;
  color:var(--ink-soft);
}
.explain-list li:first-child{border-top:none;}
.explain-list li::before{
  content:"›";
  position:absolute;left:4px;top:8px;
  color:var(--teal);font-weight:700;
}

.practice-grid{display:grid;gap:14px;grid-template-columns:1fr;}
.practice-card{
  border:1px solid var(--line);
  border-radius:var(--radius-sm);
  padding:16px 18px;
}
.practice-card .tag{
  display:inline-block;font-size:12px;font-weight:700;
  padding:3px 10px;border-radius:20px;margin-bottom:8px;
}
.tag-easy{background:#E4F1E8;color:var(--green);}
.tag-medium{background:var(--amber-soft);color:#8A5A0F;}
.tag-challenge{background:#F5E2DE;color:var(--red);}
.answer-box{
  margin-top:12px;
  border-top:1px dashed var(--line);
  padding-top:12px;
  display:none;
}
.answer-box.shown{display:block;}
.show-answer-btn{
  background:none;border:1px solid var(--line);
  padding:7px 14px;border-radius:20px;font-size:13px;font-weight:600;color:var(--teal);
}
.show-answer-btn:hover{background:var(--paper);}
.output-line{
  font-family:var(--font-mono);font-size:13px;
  background:var(--code-bg);color:var(--code-accent);
  padding:8px 12px;border-radius:4px;margin-top:8px;white-space:pre-wrap;
}

.quiz-card{
  border:1px solid var(--line);border-radius:var(--radius-sm);
  padding:14px 16px;margin-bottom:10px;
}
.quiz-options{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0;}
.quiz-opt{
  border:1px solid var(--line);background:var(--card);
  padding:7px 14px;border-radius:20px;font-size:13.5px;
}
.quiz-opt:hover{border-color:var(--teal);}
.quiz-opt.correct{background:#E4F1E8;border-color:var(--green);color:var(--green);font-weight:600;}
.quiz-opt.wrong{background:#F5E2DE;border-color:var(--red);color:var(--red);}
.quiz-explain{font-size:13.5px;color:var(--ink-soft);margin-top:8px;display:none;}
.quiz-explain.shown{display:block;}

.interview-card{
  background:var(--teal-dark);color:#EAF3F1;
  border-radius:var(--radius-md);
  padding:18px 20px;
}
.interview-card .tag{background:rgba(255,255,255,0.15);color:#fff;}
.interview-card .show-answer-btn{border-color:rgba(255,255,255,0.3);color:#fff;}
.interview-card .answer-box{border-top-color:rgba(255,255,255,0.2);}

.tomorrow-strip{
  display:flex;align-items:center;justify-content:space-between;
  background:var(--card);border:1px solid var(--line);
  border-radius:var(--radius-md);padding:18px 22px;margin-top:8px;
  flex-wrap:wrap;gap:12px;
}

/* Playground */
.playground{
  background:var(--code-bg);border-radius:var(--radius-md);
  padding:18px 20px;color:var(--code-ink);
}
.playground textarea{
  width:100%;min-height:140px;background:#16201F;color:var(--code-ink);
  border:1px solid rgba(255,255,255,0.12);border-radius:var(--radius-sm);
  font-family:var(--font-mono);font-size:13.5px;padding:12px;resize:vertical;
}
.playground .run-btn{
  background:var(--code-accent);color:var(--teal-dark);border:none;
  padding:9px 20px;border-radius:20px;font-weight:700;margin-top:10px;font-size:13.5px;
}
.playground-output{
  margin-top:12px;background:#16201F;border-radius:var(--radius-sm);
  padding:12px 14px;font-family:var(--font-mono);font-size:13px;
  min-height:40px;white-space:pre-wrap;color:#A9E8D6;
}

.locked-panel{
  background:var(--card);border:1px dashed var(--line);border-radius:var(--radius-md);
  padding:40px 30px;text-align:center;color:var(--ink-soft);
}
.locked-panel h2{color:var(--ink);}

/* Mobile */
.mobile-topbar{display:none;}
@media (max-width:880px){
  .app{grid-template-columns:1fr;}
  .sidebar{
    position:fixed;left:0;top:0;bottom:0;width:280px;z-index:50;
    transform:translateX(-100%);transition:transform 0.25s ease;
    box-shadow:2px 0 20px rgba(0,0,0,0.2);
  }
  .sidebar.open{transform:translateX(0);}
  .sidebar-overlay{
    display:none;position:fixed;inset:0;background:rgba(0,0,0,0.35);z-index:40;
  }
  .sidebar-overlay.show{display:block;}
  .mobile-topbar{
    display:flex;align-items:center;gap:12px;
    padding:14px 18px;background:var(--teal-dark);color:#fff;
    position:sticky;top:0;z-index:30;
  }
  .mobile-topbar button{
    background:rgba(255,255,255,0.12);border:none;color:#fff;
    width:36px;height:36px;border-radius:8px;font-size:18px;flex-shrink:0;
  }
  .mobile-topbar .mt-title{font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .main{padding:20px 16px 60px 16px;max-width:100%;}
  .dashboard-hero{grid-template-columns:1fr;text-align:left;}
  .ring-wrap{margin:0 auto;}
  .time-block{padding:18px 16px;}
}

/* ===== Easier-to-learn + mobile-comfort overrides ===== */
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{font-size:16.5px;line-height:1.7;font-family:var(--font-body),"Noto Sans Devanagari",sans-serif}
button{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.sidebar{height:100vh;height:100dvh}
.btn{min-height:46px;font-size:15.5px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.grow{flex:1}
.phase-title{display:flex;justify-content:space-between;align-items:center;width:100%;background:none;border:0;text-align:left;font:600 12.5px var(--font-body);color:#8FB6AE;padding:14px 20px 8px;cursor:pointer}
.phase-title i{font-style:normal;display:inline-block;transition:transform .2s;margin-left:4px}
.phase-group.collapsed .phase-title i{transform:rotate(-90deg)}
.phase-group.collapsed .day-item{display:none}
button.day-item{width:100%;background:none;border:0;border-left:3px solid transparent;text-align:left;font:inherit;font-size:15px;min-height:44px}
.day-head{margin-bottom:10px}
.day-head .eyebrow{color:var(--amber);font-size:13px;font-weight:600}
.day-head h2{font-size:28px;margin:2px 0 0}
.step-bar{display:flex;gap:8px;overflow-x:auto;padding:10px 2px;margin:0 -2px 14px;position:sticky;top:0;z-index:20;background:var(--paper);scrollbar-width:none}
.step-bar::-webkit-scrollbar{display:none}
.step-pill{flex:1 0 auto;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:58px;padding:8px 8px;border:1px solid var(--line);background:var(--card);border-radius:12px;font-size:12.5px;font-weight:600;color:var(--ink-soft)}
.step-pill .sp-ic{font-size:18px;line-height:1.2}
.step-pill.on{background:var(--teal);border-color:var(--teal);color:#fff}
.step-pill.past{color:var(--green);border-color:#BFD9C8}
.step-title{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.step-title h3{margin:0;font-size:22px}
.stepnav{position:sticky;bottom:0;z-index:20;display:flex;gap:10px;padding:14px 0 calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--paper) 72%,rgba(238,240,240,0));margin-top:18px}
.seg{display:inline-flex;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:3px;margin-bottom:12px}
.seg button{border:0;background:none;padding:8px 16px;border-radius:999px;font-size:14.5px;font-weight:600;color:var(--ink-soft);min-height:38px}
.seg button.on{background:var(--teal);color:#fff}
.lang-card p{font-size:17px;line-height:1.8}
.callout{font-size:15.5px}
.tip{background:#EEF4F2;border-radius:var(--radius-sm);padding:10px 14px;font-size:14.5px;color:var(--ink-soft);margin-bottom:14px}
.code-wrap{margin:12px 0;border-radius:var(--radius-sm);overflow:hidden;background:var(--code-bg)}
.code-bar{display:flex;justify-content:space-between;align-items:center;padding:6px 8px 6px 14px;background:#16201F;color:#8FB6AE;font:600 12px var(--font-mono)}
.code-bar>span:last-child{display:flex;gap:6px}
.mini-btn{border:1px solid rgba(255,255,255,.22);background:none;color:#DDEAE6;border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;min-height:34px}
.mini-btn.go{background:var(--code-accent);color:var(--teal-dark);border-color:var(--code-accent)}
.code-wrap pre.code-block{margin:0;border-radius:0;font-size:14px}
pre.code-block .kw{color:#F2B26B}pre.code-block .str{color:#A9E8D6}pre.code-block .num{color:#F0A3B8}
.explain-list li{font-size:15.5px}
.practice-card .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.show-answer-btn{min-height:40px;padding:8px 16px}
.quiz-options{flex-direction:column}
.quiz-opt{width:100%;text-align:left;border-radius:12px;padding:12px 14px;min-height:48px;font-size:15.5px}
.quiz-explain{font-size:14.5px}
.playground textarea{font-size:16px;min-height:200px;line-height:1.5}
.sym-bar{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.sym-bar button{flex:0 0 auto;min-width:44px;min-height:42px;background:#2A3A39;color:#fff;border:0;border-radius:8px;font:600 16px var(--font-mono)}
.pg-actions{display:flex;gap:8px;margin-top:10px}
.playground .run-btn{min-height:44px;padding:0 22px;margin:0}
.run-btn.alt{background:transparent;color:var(--code-ink);border:1px solid rgba(255,255,255,.3)}
.playground-output{font-size:14px}
.phase-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));margin-bottom:24px}
.phase-card{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--radius-md);padding:14px 16px;box-shadow:var(--shadow-card);font:inherit;color:var(--ink)}
.pc-top{display:flex;justify-content:space-between;color:var(--teal);font-size:13px}
.pc-name{font-family:var(--font-display);font-size:17px;font-weight:600;margin:4px 0 8px}
.pc-bar{height:6px;background:var(--paper);border-radius:3px;overflow:hidden}
.pc-bar i{display:block;height:100%;background:var(--amber)}
.pc-sub{font-size:12.5px;color:var(--ink-soft);margin-top:6px}
.how-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:8px;margin-top:10px}
.how-chip{background:var(--paper);border-radius:var(--radius-sm);padding:10px 12px;font-size:14px}
.how-chip b{display:block}
body:has(.sidebar.open){overflow:hidden}
@media (max-width:880px){
  body{font-size:16px}
  .sidebar{width:min(86vw,320px)}
  .mobile-topbar{height:calc(56px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 14px 0}
  .mobile-topbar button{width:44px;height:44px}
  .step-bar{top:calc(56px + env(safe-area-inset-top))}
  .main{padding:14px 14px 16px}
  .day-head h2{font-size:24px}
  .dashboard-hero{padding:20px}
  .dashboard-hero h2{font-size:26px}
  .hero-actions .btn{flex:1 1 100%}
  .lang-card p{font-size:16.5px}
}
</style>
</head>

<body>

<div class="mobile-topbar">
  <button id="hamburgerBtn" aria-label="Open menu">☰</button>
  <div class="mt-title" id="mobileTitle">JavaScript in 90 Days</div>
</div>

<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="eyebrow">1 HOUR A DAY · 90 DAYS</div>
      <h1>JavaScript Course</h1>
    </div>
    <div class="sidebar-progress">
      <div class="sidebar-progress-label">
        <span id="sbProgressText">Day 0 / 90</span>
        <span id="sbProgressPct">0%</span>
      </div>
      <div class="sidebar-progress-bar"><div class="sidebar-progress-fill" id="sbProgressFill" style="width:0%"></div></div>
    </div>
    <nav id="sidebarNav"></nav>
  </aside>

  <main class="main" id="mainContent"></main>
</div>

oduct Details"], [70, "Add to Cart"], [71, "Remove from Cart"], [72, "Quantity Management"], [73, "Cart Total"], [74, "Wishlist"], [75, "LocalStorage Persistence"]]}, {"phase": 6, "name": "Advanced E-Commerce", "days": [[76, "Checkout"], [77, "Customer Form"], [78, "Form Validation"], [79, "Coupon Code"], [80, "Discount Calculation"], [81, "Shipping Calculation"], [82, "Order Summary"], [83, "Fake Payment Workflow"], [84, "Order Confirmation"], [85, "E-Commerce Project Completion"]]}, {"phase": 7, "name": "Final Real-World Project", "days": [[86, "Requirements & Planning"], [87, "Build: Core Features"], [88, "Build: Cart & Checkout"], [89, "Build: Polish & Error Handling"], [90, "Final Project Completion 🏆"]]}]</script>
<script id="days-data" type="application/json">[{"day": 1, "title": "What is JavaScript?", "time": "60 minutes", "learn": {"en": "JavaScript is a programming language that runs inside the browser (and outside it too, with Node.js). While HTML builds the structure of a page and CSS makes it look good, JavaScript makes it DO things - respond to clicks, update numbers, validate forms, talk to servers.", "hi": "JavaScript ek programming language hai jo browser ke andar chalti hai. HTML se page ka structure banta hai, CSS se woh sundar dikhta hai, lekin JavaScript se woh page 'zinda' banta hai - jab tum kisi button pe click karte ho, price update hota hai, form check hota hai - yeh sab JavaScript karta hai.", "why": "Without JavaScript, a website is like a printed poster - you can look at it, but it can't respond to you. An e-commerce site without JavaScript couldn't update your cart count, filter products, or show a 'Buy Now' confirmation.", "analogy": "Think of a shop: HTML is the building and shelves (structure). CSS is the paint, lighting and signage (appearance). JavaScript is the shopkeeper - the one who actually talks to you, checks stock, and hands you a bill.", "syntax": "console.log(\"Hello, JavaScript!\");"}, "teacher": {"intro": "Let's write your very first line of JavaScript. Open any text editor, create a file called script.js, and link it to an HTML file (or just open your browser's DevTools console and type directly there for today).", "code": "console.log(\"Hello, JavaScript!\");\nconsole.log(\"I am learning JS for my e-commerce project.\");", "explanation": ["console.log(...) - this tells the browser to print a message. 'console' is like a diary where JavaScript writes notes for you (usually visible in DevTools).", "Everything inside the double quotes \" \" is called a STRING - plain text.", "The semicolon ; at the end marks 'this instruction is finished'. It's like a full stop in a sentence.", "Every line runs top to bottom, one after another - just like reading a recipe step by step."]}, "practice": {"easy": {"task": "Print your name and the product you'd like to sell someday using two console.log() lines.", "answerCode": "console.log(\"My name is Akshay.\");\nconsole.log(\"I want to sell: Vitamin C Capsules\");", "answerExplain": "Each console.log() prints one line. You can put any text inside the quotes.", "output": "My name is Akshay.\nI want to sell: Vitamin C Capsules"}, "medium": {"task": "Print a small 'product label' using 3 console.log() lines: product name, price, and category (e.g. Vitamin C, ₹999, Vitamins).", "answerCode": "console.log(\"Product: Vitamin C\");\nconsole.log(\"Price: 999\");\nconsole.log(\"Category: Vitamins\");", "answerExplain": "This mimics how a product page shows separate pieces of information, one per line.", "output": "Product: Vitamin C\nPrice: 999\nCategory: Vitamins"}, "challenge": {"task": "Without learning any new syntax yet, try to print the SAME product label but using only ONE console.log() line (hint: you can put a comma between multiple things inside console.log).", "answerCode": "console.log(\"Product:\", \"Vitamin C\", \"Price:\", 999, \"Category:\", \"Vitamins\");", "answerExplain": "console.log() can take multiple items separated by commas - it prints them all on one line, space-separated. This is a sneak peek at something we'll use a lot later.", "output": "Product: Vitamin C Price: 999 Category: Vitamins"}}, "realworld": {"text": "On WeightWorld-style e-commerce pages, when you open DevTools on almost any real store, you'll see console.log() messages developers left behind - order IDs, cart updates, debug notes. It's the most-used tool for checking 'is my code actually doing what I think it's doing?'", "code": "console.log(\"Cart updated. Items in cart: 3\");"}, "review": {"keyPoints": ["JavaScript makes web pages interactive (HTML = structure, CSS = style, JS = behavior).", "console.log() prints messages - your main tool for checking what your code is doing.", "Every statement in JS usually ends with a semicolon ;"], "quiz": [{"q": "What does HTML do?", "options": ["Behavior", "Structure", "Style"], "answerIndex": 1, "explain": "HTML builds the structure/skeleton of a page."}, {"q": "What symbol usually ends a JS statement?", "options": [".", ";", ":"], "answerIndex": 1, "explain": "A semicolon ; marks the end of a statement."}], "interview": {"q": "In one sentence, how would you explain the difference between HTML, CSS, and JavaScript to a non-developer?", "answer": "HTML is the skeleton (structure), CSS is the skin and clothes (appearance), and JavaScript is the muscles and brain (behavior and interactivity)."}, "tomorrow": "Day 2 - How to actually connect a JavaScript file to an HTML page."}}, {"day": 2, "title": "JavaScript + HTML", "time": "60 minutes", "learn": {"en": "JavaScript needs to be connected to your HTML page to actually run in a browser. This is done using the <script> tag, either with code written directly inside it, or by linking to a separate .js file.", "hi": "JavaScript ko browser mein chalane ke liye usse HTML se connect karna padta hai. Yeh <script> tag se hota hai - ya to code seedha tag ke andar likho, ya ek alag .js file banake usse link karo.", "why": "Real projects always keep JS in a separate file (like script.js) instead of writing it directly inside HTML. This keeps code organized - just like keeping your grocery list separate from your recipe book.", "analogy": "Think of HTML as a music player and your .js file as the playlist. You don't build a new player every time - you just load a different playlist file into it.", "syntax": "<script src=\"script.js\"><\/script>"}, "teacher": {"intro": "Create two files in the same folder: index.html and script.js. We'll link them together.", "code": "<!-- index.html -->\n<!DOCTYPE html>\n<html>\n<head>\n  <title>My JS Practice</title>\n</head>\n<body>\n  <h1>Vitamin C Store</h1>\n\n  <script src=\"script.js\"><\/script>\n</body>\n</html>\n\n// script.js\nconsole.log(\"script.js is connected!\");", "explanation": ["<script src=\"script.js\"><\/script> - the src attribute points to your JS file's location.", "Placing <script> just before the closing </body> tag ensures the page's HTML loads first, then JS runs - this avoids errors from JS trying to control elements that don't exist yet.", "Open index.html in a browser, then open DevTools (F12) > Console tab. You should see 'script.js is connected!' printed there.", "If you see nothing, double-check the file name and that both files are in the same folder."]}, "practice": {"easy": {"task": "Create the two-file setup above and confirm you can see your message in the console.", "answerCode": "// script.js\nconsole.log(\"I connected JS to HTML successfully!\");", "answerExplain": "If this message shows in your browser console, the connection worked.", "output": "I connected JS to HTML successfully!"}, "medium": {"task": "Add an <h1> with your store name in HTML, and in script.js print a console.log() that says which store this JS file belongs to.", "answerCode": "// script.js\nconsole.log(\"This script controls: Vitamin C Store\");", "answerExplain": "This mirrors real projects, where a comment or log often documents which page/component a script file belongs to.", "output": "This script controls: Vitamin C Store"}, "challenge": {"task": "What happens if you put <script src=\"script.js\"><\/script> in the <head> instead of before </body>, and your script.js tries to log something? Try it and observe - does it still work for a simple console.log?", "answerCode": "<!-- In <head> -->\n<script src=\"script.js\"><\/script>", "answerExplain": "For a plain console.log(), it still works because it doesn't depend on any HTML element existing yet. The placement only matters once your JS needs to 'find' HTML elements on the page - which we'll do soon in the DOM section.", "output": "(same console output as before)"}}, "realworld": {"text": "Every real website - including e-commerce stores - loads at least one .js file this way. Right-click any website, choose 'View Page Source', and you'll see one or more <script> tags loading the site's JavaScript.", "code": "<script src=\"/assets/store-cart.js\"><\/script>"}, "review": {"keyPoints": ["<script src=\"file.js\"><\/script> connects a JS file to your HTML page.", "Placing <script> before </body> is the common practice for beginners.", "DevTools Console (F12) is where you see your console.log() output."], "quiz": [{"q": "Which attribute points to your JS file?", "options": ["href", "src", "link"], "answerIndex": 1, "explain": "src is used in <script> tags (href is used for CSS/links)."}, {"q": "Where do you usually see console.log() output?", "options": ["Browser Console", "The HTML page itself", "A text file"], "answerIndex": 0, "explain": "Console.log output appears in the DevTools Console panel."}], "interview": {"q": "Why do developers usually place <script> tags just before </body> instead of in <head>?", "answer": "So the HTML content loads and renders first, before JavaScript runs - especially important once JS needs to interact with HTML elements on the page."}, "tomorrow": "Day 3 - A deeper look at console.log() and how it helps you debug."}}, {"day": 3, "title": "console.log()", "time": "60 minutes", "learn": {"en": "console.log() isn't just for printing text - it can print numbers, true/false values, lists, and even multiple items at once. It's the single most useful debugging tool you'll use every day as a developer.", "hi": "console.log() sirf text print karne ke liye nahi hai - iska use numbers, true/false, list, aur ek saath multiple values print karne ke liye bhi hota hai. Yeh sabse zyada use hone wala debugging tool hai.", "why": "When your code doesn't work as expected, console.log() lets you 'peek inside' and see what's actually happening at any point - like checking a value mid-recipe to see if it looks right before continuing.", "analogy": "Think of console.log() as sticky notes you leave for yourself while cooking - 'salt added ✓', 'oil is hot ✓' - so you always know exactly what stage you're at.", "syntax": "console.log(value1, value2, value3);"}, "teacher": {"intro": "Let's explore different things you can log - not just plain text.", "code": "console.log(\"Product name:\", \"Omega 3\");\nconsole.log(\"Price:\", 799);\nconsole.log(\"In stock:\", true);\nconsole.log(\"Discount applied:\", false);", "explanation": ["console.log(\"Product name:\", \"Omega 3\") - printing a label and a value together, separated by a comma.", "console.log(\"Price:\", 799) - numbers don't need quotes; quotes are only for text (strings).", "true and false are special values in JS meaning yes/no - we'll learn about these properly on Day 10 (Boolean).", "Notice each console.log() creates a NEW line in the console - one call, one line."]}, "practice": {"easy": {"task": "Log three separate product prices as numbers (no quotes) using three console.log() lines.", "answerCode": "console.log(999);\nconsole.log(799);\nconsole.log(1299);", "answerExplain": "Numbers are written without quotes - quotes are only for text.", "output": "999\n799\n1299"}, "medium": {"task": "Log a product's name, price, and stock status (true/false) all in ONE console.log() call, each with a label.", "answerCode": "console.log(\"Name:\", \"Magnesium\", \"Price:\", 599, \"In Stock:\", true);", "answerExplain": "Multiple comma-separated values in one console.log() print on a single line, space-separated.", "output": "Name: Magnesium Price: 599 In Stock: true"}, "challenge": {"task": "Try logging the result of 5 + 3 directly (without quotes) inside console.log(). What gets printed - the text '5 + 3' or the calculated answer?", "answerCode": "console.log(5 + 3);", "answerExplain": "JavaScript calculates 5 + 3 first (because there are no quotes, so it's treated as math, not text) and prints the result: 8.", "output": "8"}}, "realworld": {"text": "E-commerce developers constantly log cart state while building 'Add to Cart' features - e.g. logging the cart array every time an item is added, just to confirm the item was added correctly before styling anything.", "code": "console.log(\"Item added:\", \"Vitamin C\", \"New cart count:\", 4);"}, "review": {"keyPoints": ["console.log() can print text, numbers, true/false, and multiple values at once.", "Text needs quotes (\"...\"); numbers and true/false do not.", "console.log() is your main debugging tool - use it often, remove it before shipping real code."], "quiz": [{"q": "Do numbers need quotes in console.log()?", "options": ["Yes, always", "No", "Only for decimals"], "answerIndex": 1, "explain": "Numbers are written without quotes."}, {"q": "What does console.log(5 + 3) print?", "options": ["'5 + 3'", "8", "An error"], "answerIndex": 1, "explain": "JS calculates the math first, then prints the result 8."}], "interview": {"q": "Why shouldn't production (live) code be full of console.log() statements?", "answer": "They clutter the console for real users, can slightly slow things down, and may accidentally expose internal data - so developers remove or disable most debug logs before deploying live."}, "tomorrow": "Day 4 - Variables: how to actually STORE values using let and const."}}, {"day": 4, "title": "Variables: let and const", "time": "60 minutes", "learn": {"en": "A variable is a named container that stores a value so you can reuse or change it later. 'let' creates a variable that CAN change later. 'const' creates a variable that CANNOT be reassigned once set.", "hi": "Variable ek naam wala container hai jisme hum ek value store karte hain, taaki baad mein use kar sakein. 'let' se banaya variable BADAL sakta hai. 'const' se banaya variable ek baar set hone ke baad BADAL NAHI sakta.", "why": "Without variables, you'd have to retype the same value everywhere. With a variable, you store it once (e.g. productPrice) and reuse it - and if the price changes, you update it in just one place.", "analogy": "A variable is like a labeled jar in your kitchen. The label ('sugar') stays the same, but what's inside can change. 'const' is like a sealed jar - once filled, you can't swap its contents (though with objects/arrays, you CAN still change what's inside the jar - just not swap the whole jar, which we'll see later).", "syntax": "let variableName = value;\nconst variableName = value;"}, "teacher": {"intro": "Let's create our first variables to represent a product.", "code": "let productName = \"Vitamin C\";\nconst taxRate = 0.18;\n\nconsole.log(productName);\nconsole.log(taxRate);\n\nproductName = \"Omega 3\";\nconsole.log(productName);", "explanation": ["let productName = \"Vitamin C\"; - creates a variable named productName and stores text in it.", "const taxRate = 0.18; - creates a variable that should never change (tax rate stays fixed).", "productName = \"Omega 3\"; - since productName used 'let', we CAN reassign it to a new value.", "If you tried taxRate = 0.20; you'd get an error, because const variables can't be reassigned."]}, "practice": {"easy": {"task": "Create a 'let' variable for a product name and log it.", "answerCode": "let productName = \"Magnesium\";\nconsole.log(productName);", "answerExplain": "let is used because the product name might change later (e.g. switching products).", "output": "Magnesium"}, "medium": {"task": "Create a const variable for the store name (which never changes) and a let variable for the current day's featured product. Log both, then change the featured product and log it again.", "answerCode": "const storeName = \"WeightWorld\";\nlet featuredProduct = \"Vitamin C\";\n\nconsole.log(storeName, featuredProduct);\n\nfeaturedProduct = \"Omega 3\";\nconsole.log(storeName, featuredProduct);", "answerExplain": "storeName stays constant (const) while featuredProduct changes daily (let).", "output": "WeightWorld Vitamin C\nWeightWorld Omega 3"}, "challenge": {"task": "Try to reassign a const variable (e.g. const price = 999; then price = 899;). Run it and read the error message carefully - what does it say?", "answerCode": "const price = 999;\nprice = 899; // this will throw an error", "answerExplain": "JavaScript throws: 'TypeError: Assignment to constant variable.' This confirms const truly locks the variable's value.", "output": "Uncaught TypeError: Assignment to constant variable."}}, "realworld": {"text": "On a real product page, something like the current selected quantity is stored in a 'let' variable (because it changes when the user clicks +/-), while the product's fixed price per unit might be stored in a 'const'.", "code": "const pricePerUnit = 999;\nlet quantity = 1; // changes when user clicks + or -"}, "review": {"keyPoints": ["let creates a variable that can be reassigned later.", "const creates a variable that cannot be reassigned once set.", "Use const by default, and only switch to let when you know the value needs to change."], "quiz": [{"q": "Which keyword allows a variable to be reassigned?", "options": ["const", "let", "Neither"], "answerIndex": 1, "explain": "let allows reassignment; const does not."}, {"q": "What happens if you reassign a const variable?", "options": ["It works fine", "It throws an error", "It becomes 'undefined'"], "answerIndex": 1, "explain": "JavaScript throws a TypeError for reassigning const."}], "interview": {"q": "Why do many developers prefer using const by default instead of let?", "answer": "Using const by default makes code more predictable and prevents accidental reassignment bugs - you only use let when you know a value genuinely needs to change."}, "tomorrow": "Day 5 - var, and the rules for naming variables properly."}}, {"day": 5, "title": "var and Variable Naming", "time": "60 minutes", "learn": {"en": "'var' is the OLDEST way to create variables in JavaScript, from before let/const existed. Modern JavaScript avoids 'var' due to confusing behavior, but you'll still see it in older code, so it's worth recognizing.", "hi": "'var' JavaScript ka sabse purana tarika hai variable banane ka - let/const aane se pehle sirf var hota tha. Aaj kal 'var' avoid kiya jata hai kyunki iska behavior confusing hota hai, lekin purane code mein yeh milta rahega, isliye pehchan lena zaroori hai.", "why": "Interviewers sometimes ask about var vs let/const, and you may encounter var in older tutorials or legacy codebases - so understanding it (even while avoiding it) is important.", "analogy": "Think of var as an old, unlocked storage room anyone in the building can enter and mess with - while let/const are like properly labeled, access-controlled lockers.", "syntax": "var variableName = value;"}, "teacher": {"intro": "Let's see var in action, and then cover the rules for naming ANY variable (let, const, or var) properly.", "code": "var oldStyleName = \"Vitamin C\";\nconsole.log(oldStyleName);\n\n// Naming rules demo:\nlet productPrice = 999;      // camelCase - preferred style\nlet product_price = 999;     // works, but not the JS convention\n// let 2fast = true;         // INVALID - can't start with a number\nlet _hidden = \"secret\";      // valid - underscore allowed at start", "explanation": ["var works similarly to let for basic use, but has different 'scope' behavior we'll understand better once we reach functions (Day 46).", "Variable names CANNOT start with a number, and cannot contain spaces or symbols like - (hyphens).", "camelCase (productPrice) is the standard naming style in JavaScript - first word lowercase, next words capitalized.", "Names should be descriptive: 'p' tells you nothing, but 'productPrice' instantly tells you what it holds."]}, "practice": {"easy": {"task": "Create 3 variables using camelCase naming for: product name, product price, and product category.", "answerCode": "let productName = \"Zinc Tablets\";\nlet productPrice = 449;\nlet productCategory = \"Minerals\";", "answerExplain": "Each name clearly describes what it holds, using camelCase.", "output": "(no output - just variable creation, try logging them!)"}, "medium": {"task": "Identify which of these variable names are INVALID and explain why: '1stProduct', 'product-name', 'productName', '_total'.", "answerCode": "// '1stProduct' -> INVALID (can't start with a number)\n// 'product-name' -> INVALID (hyphens aren't allowed)\n// 'productName' -> VALID\n// '_total' -> VALID (underscore start is allowed)", "answerExplain": "JS variable names must start with a letter, underscore _, or dollar sign $ - never a number or hyphen.", "output": "(conceptual exercise - no runtime output)"}, "challenge": {"task": "Declare the SAME variable name twice using 'var' (e.g. var x = 1; var x = 2;) and run it - does JS throw an error? Now try the same with 'let x = 1; let x = 2;' - what happens?", "answerCode": "var x = 1;\nvar x = 2; // No error - var allows redeclaring\nconsole.log(x); // 2\n\nlet y = 1;\nlet y = 2; // ERROR - Identifier 'y' has already been declared", "answerExplain": "This is exactly why var is considered risky - it silently allows redeclaring the same variable, which can cause hidden bugs. let/const protect you by throwing an error instead.", "output": "2\nUncaught SyntaxError: Identifier 'y' has already been declared"}}, "realworld": {"text": "If you ever open an older e-commerce codebase (pre-2015 style), you'll likely see 'var' everywhere. Modern rewrites of the same sites almost always replace 'var' with let/const during code cleanups.", "code": "// Old style you might still see:\nvar cartTotal = 0;"}, "review": {"keyPoints": ["var is the old way to declare variables; prefer let/const in modern JS.", "Variable names must start with a letter, _ or $ - never a number.", "Use camelCase and descriptive names (productPrice, not p)."], "quiz": [{"q": "Can a variable name start with a number?", "options": ["Yes", "No", "Only if it's 0"], "answerIndex": 1, "explain": "Variable names cannot start with a digit."}, {"q": "What naming style is preferred in JS (e.g. productPrice)?", "options": ["snake_case", "camelCase", "PascalCase"], "answerIndex": 1, "explain": "camelCase is the standard JS convention for variable names."}], "interview": {"q": "What's one key risk of using 'var' that let/const help prevent?", "answer": "var allows the same variable to be silently redeclared without error, which can cause confusing bugs; let/const throw an error instead, catching mistakes early."}, "tomorrow": "Day 6 - Data Types: the different KINDS of values JavaScript can store."}}, {"day": 6, "title": "Data Types", "time": "60 minutes", "learn": {"en": "Every value in JavaScript has a 'type'. The main basic types are: String (text), Number (numbers), Boolean (true/false), Undefined (no value assigned yet), and Null (intentionally empty).", "hi": "JavaScript mein har value ka ek 'type' hota hai. Main basic types hain: String (text), Number (numbers), Boolean (true/false), Undefined (jab value abhi diya nahi gaya), aur Null (jab jaan bhoojh kar khaali rakha gaya).", "why": "Knowing the type of a value tells you what you CAN do with it - you can do math with Numbers, but not (directly) with Strings. Mixing up types is one of the most common beginner bugs.", "analogy": "Think of types like different kinds of containers in a kitchen: a bottle (Number) holds liquid you can pour/measure, a labeled box (String) holds text you can read but not 'add', and an empty shelf (Undefined) is a shelf that hasn't been filled yet.", "syntax": "typeof value"}, "teacher": {"intro": "Let's check the types of different values using the typeof operator.", "code": "console.log(typeof \"Vitamin C\");   // String\nconsole.log(typeof 999);          // Number\nconsole.log(typeof true);         // Boolean\nlet notYetSet;\nconsole.log(typeof notYetSet);    // Undefined\nlet empty = null;\nconsole.log(typeof empty);        // 'object' (a well-known JS quirk!)", "explanation": ["typeof is an operator that tells you the TYPE of any value.", "\"Vitamin C\" is a String - text wrapped in quotes.", "999 is a Number - no quotes needed.", "let notYetSet; declares a variable but gives it no value - JS automatically calls this 'undefined'.", "null means 'intentionally nothing' - a developer explicitly set it empty. Fun fact: typeof null returns 'object', which is a famous historical bug in JS that was never fixed (for compatibility reasons)."]}, "practice": {"easy": {"task": "Use typeof to check the type of a product name, a product price, and a stock boolean.", "answerCode": "console.log(typeof \"Omega 3\");\nconsole.log(typeof 799);\nconsole.log(typeof true);", "answerExplain": "typeof always returns a string describing the type: 'string', 'number', or 'boolean'.", "output": "string\nnumber\nboolean"}, "medium": {"task": "Create a variable without giving it a value, then log both the variable and its typeof.", "answerCode": "let discount;\nconsole.log(discount);       // undefined\nconsole.log(typeof discount); // 'undefined'", "answerExplain": "A declared-but-unassigned variable automatically has the value undefined, and its type is 'undefined'.", "output": "undefined\nundefined"}, "challenge": {"task": "Predict the output BEFORE running it: what is typeof (\"5\" + 5)? Then run it and check your answer.", "answerCode": "console.log(typeof (\"5\" + 5));", "answerExplain": "When you use + with a string and a number, JS converts the number into text and 'glues' them together (this is called string concatenation) - so \"5\" + 5 becomes \"55\", a String. We'll explore this fully on Day 9 (Operators).", "output": "string"}}, "realworld": {"text": "On a real checkout form, the quantity field often comes in as TEXT (a String) even though it looks like a number - e.g. \"3\" instead of 3. Forgetting to convert it to a real Number before doing math is one of the most common e-commerce bugs.", "code": "let quantityFromForm = \"3\"; // looks like a number, but it's a STRING\nconsole.log(typeof quantityFromForm); // 'string'"}, "review": {"keyPoints": ["The main basic types are String, Number, Boolean, Undefined, and Null.", "typeof tells you the type of any value.", "A variable declared without a value is automatically 'undefined'."], "quiz": [{"q": "What type is \"999\" (with quotes)?", "options": ["Number", "String", "Boolean"], "answerIndex": 1, "explain": "Anything inside quotes is a String, even if it looks like a number."}, {"q": "What does typeof return for an unassigned variable?", "options": ["'null'", "'undefined'", "'empty'"], "answerIndex": 1, "explain": "An unassigned variable's type is 'undefined'."}], "interview": {"q": "What's the difference between undefined and null?", "answer": "undefined means a variable has been declared but never given a value (JS sets this automatically). null means a developer intentionally set a variable to represent 'nothing' or 'empty'."}, "tomorrow": "Day 7 - Strings: working with text properly (joining, length, and more)."}}, {"day": 7, "title": "Strings", "time": "60 minutes", "learn": {"en": "A String is text, wrapped in quotes. JavaScript gives you tools to combine strings, check their length, and insert variables directly inside them using template literals (backticks).", "hi": "String matlab text, jo quotes ke andar hota hai. JavaScript strings ko jodne, unki length check karne, aur unme directly variables insert karne ke liye tools deta hai - iske liye template literals (backticks ` `) ka use hota hai.", "why": "Almost every product page shows dynamic text - 'Welcome, Akshay!' or '3 items in your cart' - built by combining fixed text with variable values. This is one of the most-used skills in real projects.", "analogy": "Think of template literals like a fill-in-the-blanks form: 'Hello, ___!' where you just drop in the name - instead of manually gluing pieces of paper together.", "syntax": "`Hello, ${name}!`"}, "teacher": {"intro": "Let's build a personalized product message using template literals.", "code": "let productName = \"Vitamin C\";\nlet price = 999;\n\n// Old way (string concatenation with +)\nconsole.log(\"Product: \" + productName + \", Price: ₹\" + price);\n\n// Modern way (template literals)\nconsole.log(`Product: ${productName}, Price: ₹${price}`);\n\nconsole.log(productName.length);", "explanation": ["Backticks ` ` (not regular quotes) let you use ${...} to insert a variable's value directly into a string.", "${productName} means 'put the value of productName here' - JS calculates it automatically.", "Template literals are cleaner and less error-prone than using + to glue strings together.", "productName.length gives you the number of characters in the string - useful for validating input length (e.g. checking a coupon code isn't too short)."]}, "practice": {"easy": {"task": "Create a variable for a customer name, then use a template literal to log 'Welcome, [name]!'", "answerCode": "let customerName = \"Priya\";\nconsole.log(`Welcome, ${customerName}!`);", "answerExplain": "The ${customerName} slot gets replaced with the actual value stored in customerName.", "output": "Welcome, Priya!"}, "medium": {"task": "Create product name and price variables, then log a full sentence: 'The [productName] costs ₹[price] including tax.' using a template literal.", "answerCode": "let productName = \"Magnesium\";\nlet price = 599;\nconsole.log(`The ${productName} costs ₹${price} including tax.`);", "answerExplain": "Multiple ${...} slots can appear in the same template literal.", "output": "The Magnesium costs ₹599 including tax."}, "challenge": {"task": "Log the LENGTH of a coupon code string, and then log whether it's likely valid by comparing (just by reading, not coding a check yet) - is 'SAVE10' longer or shorter than 'BUY1GET1FREE'?", "answerCode": "let couponA = \"SAVE10\";\nlet couponB = \"BUY1GET1FREE\";\nconsole.log(couponA.length); // 6\nconsole.log(couponB.length); // 12", "answerExplain": ".length simply counts characters - great for basic validation logic we'll build properly once we reach if/else (Day 11).", "output": "6\n12"}}, "realworld": {"text": "Order confirmation messages on e-commerce sites are almost always built with template literals: combining the customer's name, order ID, and total price into one friendly sentence.", "code": "let orderId = \"WW10234\";\nlet total = 2497;\nconsole.log(`Thank you! Your order ${orderId} of ₹${total} has been placed.`);"}, "review": {"keyPoints": ["Strings are text, written inside quotes.", "Template literals (backticks + ${...}) let you insert variables directly into text.", "The .length property tells you how many characters are in a string."], "quiz": [{"q": "Which symbol is used for template literals?", "options": ["Single quote '", "Backtick `", "Double quote \""], "answerIndex": 1, "explain": "Backticks ` ` enable template literals with ${...}."}, {"q": "What does \"Hello\".length return?", "options": ["4", "5", "6"], "answerIndex": 1, "explain": "'Hello' has 5 characters: H-e-l-l-o."}], "interview": {"q": "Why are template literals generally preferred over the + operator for combining strings?", "answer": "Template literals are more readable, less error-prone (no missing + or extra spaces to track), and support multi-line strings directly - making complex messages much easier to build and maintain."}, "tomorrow": "Day 8 - Numbers and Math: doing calculations properly in JavaScript."}}, {"day": 8, "title": "Numbers and Math", "time": "60 minutes", "learn": {"en": "JavaScript can do all basic math: addition (+), subtraction (-), multiplication (*), division (/), and more using the built-in Math object for things like rounding.", "hi": "JavaScript basic math kar sakta hai: addition (+), subtraction (-), multiplication (*), division (/), aur rounding jaisi cheezon ke liye built-in Math object bhi hai.", "why": "Almost every e-commerce feature involves math: total price = price × quantity, discount = price × discount%, tax = price × tax rate. This is a core, everyday skill.", "analogy": "Think of the Math object as a calculator built directly into JavaScript, always sitting there ready with useful buttons like 'round' and 'random'.", "syntax": "Math.round(value)\nMath.random()"}, "teacher": {"intro": "Let's calculate a cart total, including a rounded discount.", "code": "let price = 999;\nlet quantity = 3;\nlet total = price * quantity;\nconsole.log(total); // 2997\n\nlet discountPercent = 0.15;\nlet discountAmount = total * discountPercent;\nconsole.log(Math.round(discountAmount)); // rounds to nearest whole number\n\nlet finalPrice = total - discountAmount;\nconsole.log(Math.round(finalPrice));", "explanation": ["price * quantity multiplies two numbers to get the subtotal.", "total * discountPercent calculates 15% of the total as a discount amount.", "Math.round(...) rounds a decimal number to the nearest whole number - useful since money usually isn't shown with long decimals.", "total - discountAmount subtracts the discount to get the final price."]}, "practice": {"easy": {"task": "Calculate the total price for 4 units of a ₹449 product.", "answerCode": "let price = 449;\nlet quantity = 4;\nconsole.log(price * quantity);", "answerExplain": "Multiplication (*) gives the total cost for multiple units.", "output": "1796"}, "medium": {"task": "Calculate a 10% discount on a ₹1299 product, round it, and log the final discounted price.", "answerCode": "let price = 1299;\nlet discount = price * 0.10;\nlet finalPrice = price - discount;\nconsole.log(Math.round(finalPrice));", "answerExplain": "Multiply to find the discount amount, subtract it from the price, then round for a clean display value.", "output": "1169"}, "challenge": {"task": "Use Math.random() to simulate picking a random discount between 5 and 20 percent (hint: Math.random() gives a decimal between 0 and 1 - you'll need to multiply and add to shift the range, then round it).", "answerCode": "let randomDiscount = Math.round(Math.random() * (20 - 5) + 5);\nconsole.log(randomDiscount); // a number between 5 and 20", "answerExplain": "Math.random() * 15 gives a number between 0-15; adding 5 shifts the range to 5-20; Math.round() removes decimals.", "output": "(a different number 5-20 each time you run it)"}}, "realworld": {"text": "Every 'flash sale' countdown or randomized 'Spin the Wheel' discount widget on e-commerce sites relies on Math.random() combined with basic arithmetic like what you just practiced.", "code": "let flashDiscount = Math.round(Math.random() * 30); // random discount up to 30%"}, "review": {"keyPoints": ["JavaScript supports +, -, *, / for basic math directly.", "Math.round() rounds a number to the nearest whole number.", "Math.random() generates a random decimal between 0 and 1 - useful for randomization features."], "quiz": [{"q": "What does Math.round(4.6) return?", "options": ["4", "5", "4.6"], "answerIndex": 1, "explain": "4.6 rounds up to the nearest whole number, 5."}, {"q": "What range of values does Math.random() return by default?", "options": ["0 to 1", "1 to 10", "0 to 100"], "answerIndex": 0, "explain": "Math.random() always returns a decimal between 0 (inclusive) and 1 (exclusive)."}], "interview": {"q": "How would you generate a random whole number between 1 and 10 using Math.random()?", "answer": "Math.floor(Math.random() * 10) + 1 - multiply by the range size (10), floor it to remove decimals, then add 1 to shift the range to start at 1 instead of 0."}, "tomorrow": "Day 9 - Operators: the full set of symbols JS uses for math, comparison, and assignment."}}, {"day": 9, "title": "Operators", "time": "60 minutes", "learn": {"en": "Operators are symbols that perform actions: arithmetic (+ - * / %), comparison (=== !== > <), and assignment (= += -=). Today we connect the dots between all the ones you've already been using.", "hi": "Operators woh symbols hain jo koi action perform karte hain: arithmetic (+ - * / %), comparison (=== !== > <), aur assignment (= += -=). Aaj hum yeh dekhenge ki yeh sab kaise ek saath fit hote hain.", "why": "Comparison operators are the foundation of every decision your code makes later (if/else) - 'is stock greater than 0?', 'is the entered password the same as the saved one?'", "analogy": "Think of operators like tools in a toolbox: a hammer (+) builds things up, a measuring tape (===) checks if two things match exactly, and a wrench (+=) tightens/updates an existing value.", "syntax": "===  !==  >  <  >=  <=  &&  ||"}, "teacher": {"intro": "Let's explore the operators you'll use constantly, especially === for comparison.", "code": "let stock = 5;\n\nconsole.log(stock > 0);      // true\nconsole.log(stock === 5);   // true (strict equality)\nconsole.log(stock === \"5\"); // false! Number 5 is not the same TYPE as string \"5\"\nconsole.log(stock == \"5\");  // true (loose equality - converts types first, avoid this!)\n\nlet cartCount = 2;\ncartCount += 1; // shorthand for: cartCount = cartCount + 1\nconsole.log(cartCount); // 3", "explanation": ["=== checks both VALUE and TYPE - this is called strict equality, and it's the one you should almost always use.", "== (double equals) only checks value, ignoring type - it 'converts' types secretly, which can cause confusing bugs. Avoid == in modern JS.", "cartCount += 1 is shorthand for cartCount = cartCount + 1 - a quick way to update a variable based on itself.", "stock > 0 returns a Boolean (true/false) - this is exactly what we'll feed into if/else starting Day 11."]}, "practice": {"easy": {"task": "Check (using ===) whether a stock variable equal to 0 means the product is out of stock.", "answerCode": "let stock = 0;\nconsole.log(stock === 0);", "answerExplain": "=== compares the exact value and type - here both are Number 0, so it returns true.", "output": "true"}, "medium": {"task": "Create a cartCount variable starting at 1. Simulate a user clicking '+' twice using += , then clicking '-' once using -=. Log the final count.", "answerCode": "let cartCount = 1;\ncartCount += 1; // click +\ncartCount += 1; // click +\ncartCount -= 1; // click -\nconsole.log(cartCount);", "answerExplain": "+= and -= update the variable based on its current value - exactly how a live cart quantity counter works.", "output": "2"}, "challenge": {"task": "Predict, then test: what does 5 === \"5\" return? What about 5 == \"5\"? Explain the difference in your own words.", "answerCode": "console.log(5 === \"5\"); // false\nconsole.log(5 == \"5\");  // true", "answerExplain": "=== requires matching type AND value (Number vs String don't match, so false). == only checks value after silently converting types, so it returns true - which is exactly why === is safer and preferred.", "output": "false\ntrue"}}, "realworld": {"text": "Every 'Add to Cart' button disables itself using a comparison like stock <= 0 to check if a product is sold out, before allowing the click to proceed.", "code": "let stock = 0;\nlet canAddToCart = stock > 0;\nconsole.log(canAddToCart); // false - button should be disabled"}, "review": {"keyPoints": ["=== checks both value and type (strict equality) - always prefer this over ==.", "+=, -=, *=, /= are shorthand ways to update a variable based on itself.", "Comparison operators (>, <, ===, etc.) return true/false - the foundation for decisions in code."], "quiz": [{"q": "Which operator checks value AND type?", "options": ["==", "===", "="], "answerIndex": 1, "explain": "=== is strict equality - checks both value and type."}, {"q": "What is cartCount += 1 shorthand for?", "options": ["cartCount = 1", "cartCount = cartCount + 1", "cartCount = cartCount - 1"], "answerIndex": 1, "explain": "+= adds to the existing value and reassigns it."}], "interview": {"q": "Why should === be preferred over == in JavaScript?", "answer": "== performs type coercion (silently converts types before comparing), which can lead to unexpected results like '' == 0 being true. === avoids this by requiring both value and type to match, making code more predictable."}, "tomorrow": "Day 10 - Boolean: a closer look at true/false and how they drive logic."}}, {"day": 10, "title": "Boolean", "time": "60 minutes", "learn": {"en": "A Boolean is a value that's either true or false - nothing else. Booleans are usually the RESULT of a comparison, and they control which path your code takes.", "hi": "Boolean ek aisi value hoti hai jo sirf true ya false hoti hai - kuch aur nahi. Booleans usually kisi comparison ka RESULT hote hain, aur yeh decide karte hain ki code kis raste jaayega.", "why": "Every 'yes/no' decision in code - is the user logged in? is the item in stock? is the form valid? - is represented as a Boolean under the hood.", "analogy": "Think of a Boolean like a light switch - it's either ON (true) or OFF (false). There's no 'half-on' state.", "syntax": "true / false"}, "teacher": {"intro": "Let's see how Booleans naturally come out of comparisons and get stored just like any other value.", "code": "let isInStock = true;\nlet isOnSale = false;\n\nconsole.log(isInStock);\nconsole.log(isOnSale);\n\nlet stockCount = 5;\nlet hasStock = stockCount > 0; // Boolean result stored in a variable\nconsole.log(hasStock); // true", "explanation": ["isInStock and isOnSale are variables directly assigned true/false.", "stockCount > 0 is a comparison - JS evaluates it immediately and gives back true or false.", "hasStock now HOLDS that Boolean result, so you can reuse it later without repeating the comparison.", "Notice: true and false are written WITHOUT quotes - with quotes, \"true\" would just be a String, not a real Boolean!"]}, "practice": {"easy": {"task": "Create two Boolean variables: isFreeShipping and isGiftWrapped, and log both.", "answerCode": "let isFreeShipping = true;\nlet isGiftWrapped = false;\nconsole.log(isFreeShipping);\nconsole.log(isGiftWrapped);", "answerExplain": "Booleans are written directly as true/false, no quotes.", "output": "true\nfalse"}, "medium": {"task": "Given a cartTotal variable, create a Boolean qualifiesForFreeShipping that is true if cartTotal is 999 or more.", "answerCode": "let cartTotal = 1200;\nlet qualifiesForFreeShipping = cartTotal >= 999;\nconsole.log(qualifiesForFreeShipping);", "answerExplain": ">= checks 'greater than or equal to', producing a Boolean stored in a clearly-named variable.", "output": "true"}, "challenge": {"task": "Predict then test: what does typeof true return? And what does typeof \"true\" (with quotes) return? Explain the difference.", "answerCode": "console.log(typeof true);    // 'boolean'\nconsole.log(typeof \"true\");  // 'string'", "answerExplain": "Without quotes, true is a real Boolean. With quotes, \"true\" is just text that happens to say 'true' - a common beginner trap when reading data from forms or APIs.", "output": "boolean\nstring"}}, "realworld": {"text": "A 'Wishlist' heart icon on a product usually toggles a Boolean like isWishlisted between true and false each time you click it, which then decides whether the heart icon appears filled or outlined.", "code": "let isWishlisted = false;\n// after clicking the heart icon:\nisWishlisted = true;"}, "review": {"keyPoints": ["A Boolean is only ever true or false.", "Comparisons (>, <, ===, etc.) produce Boolean results.", "\"true\" (with quotes) is a String, NOT a real Boolean - a common beginner mistake."], "quiz": [{"q": "Which of these is a real Boolean?", "options": ["\"true\"", "true", "1"], "answerIndex": 1, "explain": "true without quotes is the real Boolean value."}, {"q": "What does the comparison 10 > 5 return?", "options": ["10", "5", "true"], "answerIndex": 2, "explain": "Comparisons return Boolean results - here true."}], "interview": {"q": "Why might comparing a Boolean using === true be considered unnecessary/redundant in code?", "answer": "Since a Boolean is already true or false, writing if (isInStock === true) is redundant - if (isInStock) already checks the same thing more simply and is the preferred style."}, "tomorrow": "Day 11 - if / else: making your code actually make decisions."}}, {"day": 11, "title": "if / else", "time": "60 minutes", "learn": {"en": "if/else lets your code make decisions: 'IF this condition is true, do this - ELSE do that.' This is the foundation of all logic in programming.", "hi": "if/else se code decisions le sakta hai: 'AGAR yeh condition true hai, toh yeh karo - WARNA woh karo.' Yeh programming ke har logic ka foundation hai.", "why": "Almost nothing in a real app happens unconditionally - showing a discount only if eligible, blocking checkout if the cart is empty, showing 'Out of Stock' only when stock is 0 - all use if/else.", "analogy": "Think of if/else like a fork in a road with a signboard: 'IF you have a ticket, go through this gate. ELSE, go to the ticket counter first.'", "syntax": "if (condition) {\n  // runs if true\n} else {\n  // runs if false\n}"}, "teacher": {"intro": "Let's write logic to check if a product is in stock.", "code": "let stock = 0;\n\nif (stock > 0) {\n  console.log(\"In Stock - Add to Cart\");\n} else {\n  console.log(\"Out of Stock\");\n}", "explanation": ["if (stock > 0) checks the condition inside the parentheses - it must evaluate to true or false.", "If the condition is true, the code INSIDE the first { } curly braces runs.", "If the condition is false, the code inside else { } runs instead.", "Only ONE of the two blocks ever runs - never both."]}, "practice": {"easy": {"task": "Write an if/else that logs 'Eligible for discount' if a customer's total purchases are 5000 or more, otherwise logs 'Not eligible yet'.", "answerCode": "let totalPurchases = 6000;\n\nif (totalPurchases >= 5000) {\n  console.log(\"Eligible for discount\");\n} else {\n  console.log(\"Not eligible yet\");\n}", "answerExplain": ">= 5000 checks the threshold; the matching block runs based on the result.", "output": "Eligible for discount"}, "medium": {"task": "Write an if/else that checks a password variable against a stored value \"secure123\" and logs 'Access granted' or 'Access denied'.", "answerCode": "let enteredPassword = \"secure123\";\nlet correctPassword = \"secure123\";\n\nif (enteredPassword === correctPassword) {\n  console.log(\"Access granted\");\n} else {\n  console.log(\"Access denied\");\n}", "answerExplain": "=== ensures an exact match on both value and type before granting access.", "output": "Access granted"}, "challenge": {"task": "Write an if/else that checks BOTH conditions manually with nested if: is the product in stock AND is the price under budget? (You'll properly learn && tomorrow-ish, but try nesting if statements inside each other for now.)", "answerCode": "let stock = 5;\nlet price = 799;\nlet budget = 1000;\n\nif (stock > 0) {\n  if (price <= budget) {\n    console.log(\"You can buy this!\");\n  } else {\n    console.log(\"Too expensive.\");\n  }\n} else {\n  console.log(\"Out of stock.\");\n}", "answerExplain": "Nesting if statements lets you check multiple conditions step by step - though tomorrow's Logical Operators (&&, ||) will let us do this more cleanly in one line.", "output": "You can buy this!"}}, "realworld": {"text": "The 'Add to Cart' button on every e-commerce product page is wrapped in logic like this: if the item is in stock, the button is active; otherwise, it shows 'Notify Me' instead.", "code": "let stock = 3;\n\nif (stock > 0) {\n  console.log(\"Button: Add to Cart\");\n} else {\n  console.log(\"Button: Notify Me When Available\");\n}"}, "review": {"keyPoints": ["if (condition) { } runs code only when the condition is true.", "else { } runs when the condition is false - only one branch ever executes.", "Conditions are usually built using comparison operators (===, >, <, >=, etc.)."], "quiz": [{"q": "What runs if the if-condition is false and there's an else block?", "options": ["Nothing runs", "The if block runs anyway", "The else block runs"], "answerIndex": 2, "explain": "The else block runs specifically when the condition is false."}, {"q": "Can both the if AND else blocks run in the same execution?", "options": ["Yes, always", "No, never", "Only with loops"], "answerIndex": 1, "explain": "Only one of if/else ever runs for a given check."}], "interview": {"q": "What happens if you write an if statement without curly braces around a single line of code?", "answer": "JavaScript allows omitting curly braces for a single statement (e.g. if (x) console.log(x);), but it's considered risky style since adding a second line later without braces would cause a bug - most style guides recommend always using braces."}, "tomorrow": "Day 12 - else if: handling more than two possible outcomes."}}, {"day": 12, "title": "else if", "time": "60 minutes", "learn": {"en": "'else if' lets you check MULTIPLE conditions in order, not just a simple true/false split. JavaScript checks each condition top to bottom and runs the FIRST one that matches.", "hi": "'else if' se hum EK se zyada conditions ko order mein check kar sakte hain, sirf simple true/false nahi. JavaScript har condition ko top se bottom check karta hai aur jo pehli match ho, wahi chalta hai.", "why": "Real logic often has more than 2 outcomes - e.g. shipping cost might differ for 'under ₹500', '₹500-999', and '₹1000+' - three separate ranges, not just two.", "analogy": "Think of else if like a customer support call menu: 'Press 1 for Sales, press 2 for Support, press 3 for Returns, otherwise stay on the line' - each option is checked one after another.", "syntax": "if (condition1) {\n  //\n} else if (condition2) {\n  //\n} else {\n  //\n}"}, "teacher": {"intro": "Let's calculate shipping cost based on cart total, using three price ranges.", "code": "let cartTotal = 750;\n\nif (cartTotal >= 1000) {\n  console.log(\"Shipping: Free\");\n} else if (cartTotal >= 500) {\n  console.log(\"Shipping: ₹49\");\n} else {\n  console.log(\"Shipping: ₹99\");\n}", "explanation": ["JS checks cartTotal >= 1000 first - since 750 is NOT >= 1000, it skips this block.", "Next it checks cartTotal >= 500 - since 750 IS >= 500, THIS block runs, and JS stops checking further.", "The final else only runs if NONE of the above conditions matched.", "Order matters! If we'd written >= 500 BEFORE >= 1000, even a ₹1500 cart would incorrectly match the ₹49 shipping tier first."]}, "practice": {"easy": {"task": "Write if/else if/else that logs a grade message based on a score: 90+ 'Excellent', 60-89 'Good', below 60 'Needs Improvement'.", "answerCode": "let score = 75;\n\nif (score >= 90) {\n  console.log(\"Excellent\");\n} else if (score >= 60) {\n  console.log(\"Good\");\n} else {\n  console.log(\"Needs Improvement\");\n}", "answerExplain": "Checking from highest to lowest threshold ensures each score lands in the correct bucket.", "output": "Good"}, "medium": {"task": "Write shipping-cost logic for FOUR tiers: ₹1500+ free, ₹1000-1499 ₹29, ₹500-999 ₹49, below ₹500 ₹99.", "answerCode": "let cartTotal = 1200;\n\nif (cartTotal >= 1500) {\n  console.log(\"Shipping: Free\");\n} else if (cartTotal >= 1000) {\n  console.log(\"Shipping: ₹29\");\n} else if (cartTotal >= 500) {\n  console.log(\"Shipping: ₹49\");\n} else {\n  console.log(\"Shipping: ₹99\");\n}", "answerExplain": "Each else if narrows the range further, always checked in descending order.", "output": "Shipping: ₹29"}, "challenge": {"task": "What happens if you accidentally write the conditions in the WRONG order (lowest threshold first)? Try it with the shipping example and observe the (wrong) result for cartTotal = 2000.", "answerCode": "let cartTotal = 2000;\n\n// WRONG ORDER:\nif (cartTotal >= 500) {\n  console.log(\"Shipping: ₹49\"); // this runs first - WRONG!\n} else if (cartTotal >= 1500) {\n  console.log(\"Shipping: Free\");\n}", "answerExplain": "Since 2000 also satisfies >= 500 (the first check), that block runs and JS never even looks at the >= 1500 check. Always order else-if chains from most specific/highest to least specific/lowest.", "output": "Shipping: ₹49  (incorrect! should have been Free)"}}, "realworld": {"text": "Tiered discount systems ('Buy 1: 0% off, Buy 2-3: 10% off, Buy 4+: 20% off') on e-commerce product pages are built almost exactly like the shipping example you just practiced.", "code": "let quantity = 4;\n\nif (quantity >= 4) {\n  console.log(\"20% off applied\");\n} else if (quantity >= 2) {\n  console.log(\"10% off applied\");\n} else {\n  console.log(\"No discount\");\n}"}, "review": {"keyPoints": ["else if lets you check multiple conditions in sequence.", "JavaScript runs the FIRST matching condition and skips the rest.", "Order conditions carefully - usually from most specific/highest to least specific/lowest."], "quiz": [{"q": "How many blocks run in an if/else if/else chain?", "options": ["All of them", "Only the first matching one", "None"], "answerIndex": 1, "explain": "Only the first true condition's block runs; the rest are skipped."}, {"q": "Why does order matter in else-if chains?", "options": ["It doesn't matter", "Wrong order can cause an earlier, less specific condition to match first", "JS reorders them automatically"], "answerIndex": 1, "explain": "JS checks top to bottom, so a broad condition placed too early can 'steal' cases meant for a later, more specific one."}], "interview": {"q": "How would you rewrite a long else-if chain checking a single variable against many exact values, using a cleaner construct? (just name the concept, we'll cover it later if needed)", "answer": "A switch statement is often used for checking one variable against many exact values, though modern JS often still prefers if/else if for readability with complex conditions."}, "tomorrow": "Day 13 - Logical Operators: combining multiple conditions with && and ||."}}, {"day": 13, "title": "Logical Operators", "time": "60 minutes", "learn": {"en": "Logical operators let you combine multiple conditions: && (AND - both must be true), || (OR - at least one must be true), and ! (NOT - flips true/false).", "hi": "Logical operators se hum multiple conditions ko combine kar sakte hain: && (AND - dono true hone chahiye), || (OR - kam se kam ek true ho), aur ! (NOT - true/false ko ulta kar deta hai).", "why": "Real conditions are rarely just one check - 'is in stock AND is within budget', 'is a new customer OR has a coupon' - these need && / || to express properly, cleaner than nested if statements.", "analogy": "Think of && like needing BOTH a ticket AND an ID to enter a concert - missing either one blocks you. || is like a discount that applies if you're a student OR a senior citizen - either one qualifies.", "syntax": "condition1 && condition2\ncondition1 || condition2\n!condition"}, "teacher": {"intro": "Let's rewrite yesterday's nested if-statement challenge using && instead.", "code": "let stock = 5;\nlet price = 799;\nlet budget = 1000;\n\nif (stock > 0 && price <= budget) {\n  console.log(\"You can buy this!\");\n} else {\n  console.log(\"Cannot buy - check stock or budget.\");\n}\n\nlet isNewCustomer = false;\nlet hasCoupon = true;\n\nif (isNewCustomer || hasCoupon) {\n  console.log(\"Discount applies!\");\n}", "explanation": ["stock > 0 && price <= budget - BOTH conditions must be true for this whole expression to be true.", "This replaces yesterday's nested if statements with a single, cleaner line.", "isNewCustomer || hasCoupon - only ONE of these needs to be true for the discount to apply.", "Since hasCoupon is true, the || expression is true, even though isNewCustomer is false."]}, "practice": {"easy": {"task": "Write a condition using && that checks if a product is in stock (stock > 0) AND on sale (isOnSale is true), logging 'Buy now!' if both are true.", "answerCode": "let stock = 3;\nlet isOnSale = true;\n\nif (stock > 0 && isOnSale) {\n  console.log(\"Buy now!\");\n}", "answerExplain": "Both conditions must be true for the && expression to be true.", "output": "Buy now!"}, "medium": {"task": "Write a condition using || that grants free shipping if EITHER cartTotal is 999+ OR the customer isVIP is true.", "answerCode": "let cartTotal = 400;\nlet isVIP = true;\n\nif (cartTotal >= 999 || isVIP) {\n  console.log(\"Free shipping applied!\");\n} else {\n  console.log(\"Standard shipping cost applies.\");\n}", "answerExplain": "Even though cartTotal doesn't qualify, isVIP being true makes the || expression true overall.", "output": "Free shipping applied!"}, "challenge": {"task": "Combine && and || in one condition: apply a discount if (stock > 0 AND isOnSale) OR isVIP is true. Test it with values where only isVIP is true.", "answerCode": "let stock = 0;\nlet isOnSale = false;\nlet isVIP = true;\n\nif ((stock > 0 && isOnSale) || isVIP) {\n  console.log(\"Discount applied!\");\n} else {\n  console.log(\"No discount.\");\n}", "answerExplain": "Parentheses group the && condition first (which is false here since stock is 0), but the || with isVIP still makes the overall expression true.", "output": "Discount applied!"}}, "realworld": {"text": "A 'Checkout' button is often disabled unless: the cart is not empty AND all required fields (address, payment) are filled AND terms are accepted - a real-world use of chained && conditions.", "code": "let cartNotEmpty = true;\nlet addressFilled = true;\nlet termsAccepted = true;\n\nlet canCheckout = cartNotEmpty && addressFilled && termsAccepted;\nconsole.log(canCheckout); // true"}, "review": {"keyPoints": ["&& (AND) requires ALL conditions to be true.", "|| (OR) requires AT LEAST ONE condition to be true.", "! (NOT) flips a Boolean - !true becomes false."], "quiz": [{"q": "For (true && false), what's the result?", "options": ["true", "false", "Error"], "answerIndex": 1, "explain": "&& requires BOTH sides true; since one is false, the result is false."}, {"q": "For (true || false), what's the result?", "options": ["true", "false", "Error"], "answerIndex": 0, "explain": "|| only needs ONE side true; since one is true, the result is true."}], "interview": {"q": "What is 'short-circuit evaluation' in the context of && and ||?", "answer": "JavaScript stops evaluating as soon as the result is determined - for &&, if the first condition is false, it won't even check the second (since the result must be false); for ||, if the first is true, it skips checking the second. This can be used cleverly, but can also cause subtle bugs if a skipped condition had a side effect."}, "tomorrow": "Day 14 - The Ternary Operator: a shorter way to write simple if/else."}}, {"day": 14, "title": "Ternary Operator", "time": "60 minutes", "learn": {"en": "The ternary operator (condition ? valueIfTrue : valueIfFalse) is a compact, one-line way to write simple if/else logic - especially useful when you just want to pick between two VALUES.", "hi": "Ternary operator (condition ? valueIfTrue : valueIfFalse) simple if/else ko ek line mein likhne ka tarika hai - khaaskar jab tumhe sirf do VALUES mein se ek choose karna ho.", "why": "For simple 'pick A or B' decisions, a full if/else block feels heavy. The ternary operator keeps code short and is extremely common in real projects, especially inside template literals.", "analogy": "Think of it like answering a yes/no question in one breath: 'Raining? Take umbrella : Leave it home' - same decision, said in one compact line instead of a whole paragraph.", "syntax": "condition ? valueIfTrue : valueIfFalse"}, "teacher": {"intro": "Let's rewrite a simple if/else as a ternary expression.", "code": "let stock = 0;\n\n// if/else version:\nlet messageOld;\nif (stock > 0) {\n  messageOld = \"In Stock\";\n} else {\n  messageOld = \"Out of Stock\";\n}\n\n// Ternary version (same result, one line):\nlet message = stock > 0 ? \"In Stock\" : \"Out of Stock\";\nconsole.log(message);", "explanation": ["stock > 0 is the condition, just like in if/else.", "The ? symbol separates the condition from the two possible outcomes.", "\"In Stock\" is the value used if the condition is true; \"Out of Stock\" (after the :) is used if false.", "The ternary operator returns a VALUE directly - so it can be assigned to a variable or dropped straight into a template literal."]}, "practice": {"easy": {"task": "Use a ternary to set a variable stockLabel to
