rn": {"en": "Today, before writing any code, you'll PLAN your own final capstone project - choosing a scope, listing required features, and breaking it into small, buildable pieces, exactly like a real developer would before starting real work.", "hi": "Aaj, koi code likhne se pehle, tum apna khud ka final capstone project PLAN karoge - scope choose karna, required features list karna, aur use chhote, buildable pieces mein todna, exactly jaise ek real developer real kaam shuru karne se pehle karta hai.", "why": "Jumping straight into code without a plan usually leads to a messy, half-finished project. Professional developers ALWAYS plan first - today you practice that exact discipline.", "analogy": "Think of today like an architect drawing blueprints before any construction begins - the plan itself doesn't build the house, but skipping it leads to serious structural problems later.", "syntax": "(Planning day - no new code syntax)"}, "teacher": {"intro": "Let's plan a final project using the exact same structured approach real teams use: requirements, features, and a build order.", "code": "// EXAMPLE PROJECT PLAN: \"Personal Recipe Organizer\"\n// (You'll create YOUR OWN plan for YOUR chosen project idea)\n\n// 1. CORE REQUIREMENT (what problem does this solve?)\n// \"Let users save, search, and organize recipes they want to cook.\"\n\n// 2. MUST-HAVE FEATURES (the minimum for it to be useful)\n// - Add a new recipe (name, ingredients, steps)\n// - View a list of all saved recipes\n// - Search recipes by name\n// - Delete a recipe\n// - Data persists using localStorage\n\n// 3. NICE-TO-HAVE FEATURES (only if time allows)\n// - Filter by category (breakfast, dinner, dessert)\n// - Mark recipes as \"favorites\"\n// - Edit an existing recipe\n\n// 4. BUILD ORDER (smallest working piece first)\n// Day 87: Data structure + adding/viewing recipes\n// Day 88: Search + delete functionality\n// Day 89: Polish, error handling, edge cases\n// Day 90: Final review and completion", "explanation": ["Starting with the CORE REQUIREMENT (one clear sentence) keeps the whole project anchored to an actual PURPOSE, not just a random collection of features.", "Separating MUST-HAVE from NICE-TO-HAVE is critical - it's the difference between a project you can realistically FINISH versus one that never feels 'done'.", "The BUILD ORDER deliberately starts with the smallest genuinely WORKING piece (add + view), then layers additional features on top - exactly like how JS Store was built incrementally across 15 days.", "Your own project doesn't need to be a store - it could be a habit tracker, a quiz app, a budget calculator, anything genuinely interesting to YOU, using the same JS skills from Phases 1-6."]}, "practice": {"easy": {"task": "Write your OWN core requirement sentence for a final project idea of your choosing.", "answerCode": "// Example: \"Let users track daily water intake and see their progress toward a daily goal.\"\n// Write YOUR OWN idea here.", "answerExplain": "A single, clear sentence keeps your entire project focused on solving one real, specific problem.", "output": "(your own project's core requirement, in your own words)"}, "medium": {"task": "List at least 4 MUST-HAVE features and 2 NICE-TO-HAVE features for your project idea.", "answerCode": "// MUST-HAVE:\n// 1. ...\n// 2. ...\n// 3. ...\n// 4. ...\n//\n// NICE-TO-HAVE:\n// 1. ...\n// 2. ...", "answerExplain": "Explicitly separating these two categories protects you from scope creep - trying to build EVERYTHING at once, and finishing NOTHING.", "output": "(your own categorized feature list)"}, "challenge": {"task": "Write a build order for Days 87-90, breaking your MUST-HAVE features into a sensible sequence (smallest working piece first).", "answerCode": "// Day 87: [smallest working core feature]\n// Day 88: [next layer of functionality]\n// Day 89: [polish, error handling, edge cases]\n// Day 90: [final review and completion]", "answerExplain": "A clear day-by-day plan (even if it shifts slightly as you build) gives you a concrete target for each remaining day, rather than open-ended uncertainty.", "output": "(your own 4-day build plan)"}}, "realworld": {"text": "Every real software project - from a solo weekend hobby app to a massive company product - starts with exactly this kind of requirements-and-planning phase before serious coding begins.", "code": "// The plan you write today is the blueprint for your\n// OWN final project across Days 87-90!"}, "review": {"keyPoints": ["Starting with one clear CORE REQUIREMENT keeps a project focused on solving a real, specific problem.", "Separating MUST-HAVE from NICE-TO-HAVE features protects against scope creep and unfinished projects.", "A sensible BUILD ORDER (smallest working piece first) makes even an ambitious project achievable incrementally."], "quiz": [{"q": "Why separate MUST-HAVE from NICE-TO-HAVE features?", "options": ["It's unnecessary busywork", "To protect against scope creep and ensure the project can actually be finished", "It's required for all code"], "answerIndex": 1, "explain": "Without this separation, projects often try to do everything and end up finishing nothing."}, {"q": "What should a build order generally start with?", "options": ["The most complex feature", "The smallest genuinely working piece", "Whatever looks the most impressive"], "answerIndex": 1, "explain": "Starting small and working ensures you always have something functional to build on top of, exactly like JS Store's incremental approach."}], "interview": {"q": "Why do experienced developers insist on planning (even briefly) before writing code, rather than just 'figuring it out as they go'?", "answer": "Planning surfaces important questions and potential problems EARLY, when they're cheap to address - discovering a fundamental design flaw halfway through coding is far more costly and frustrating than catching it during a 20-minute planning session beforehand. Planning also creates a shared, clear target, which is essential once more than one person is involved."}, "tomorrow": "Day 87 - Build: Core Features - starting to actually build YOUR final project."}}, {"day": 87, "title": "Build: Core Features", "time": "60 minutes", "learn": {"en": "Today you start BUILDING your final project - implementing the smallest genuinely working version of your core feature, following yesterday's plan.", "hi": "Aaj tum apna final project BUILD karna shuru karte ho - kal ke plan ko follow karte hue apne core feature ka sabse chhota genuinely working version implement karte ho.", "why": "A working (even if very simple) version of your core feature, built TODAY, gives you real momentum and something concrete to improve over the remaining days - far better than an ambitious plan that never actually runs.", "analogy": "Think of today like laying the first row of bricks after yesterday's blueprint - not the whole building yet, but the first genuinely REAL, standing piece of it.", "syntax": "(Applying Phases 1-6 skills to YOUR specific project)"}, "teacher": {"intro": "Let's walk through building the core feature for the EXAMPLE project (Recipe Organizer) - adapt this same APPROACH to your own chosen project.", "code": "// Example: Recipe Organizer - core data + add/view functionality\nlet recipes = JSON.parse(localStorage.getItem(\"recipes\")) || [];\n\nfunction addRecipe(name, ingredients, steps) {\n  const newRecipe = {\n    id: Date.now(), // a quick, simple way to generate a unique id\n    name,\n    ingredients,\n    steps\n  };\n  recipes.push(newRecipe);\n  localStorage.setItem(\"recipes\", JSON.stringify(recipes));\n  renderRecipes();\n}\n\nfunction renderRecipes() {\n  const container = document.getElementById(\"recipeList\");\n  container.innerHTML = recipes.map((r) => `\n    <div class=\"recipe-card\">\n      <h3>${r.name}</h3>\n      <p>${r.ingredients}</p>\n    </div>\n  `).join(\"\");\n}\n\ndocument.getElementById(\"addRecipeBtn\").addEventListener(\"click\", function() {\n  const name = document.getElementById(\"recipeName\").value.trim();\n  const ingredients = document.getElementById(\"recipeIngredients\").value.trim();\n  const steps = document.getElementById(\"recipeSteps\").value.trim();\n\n  if (name === \"\") return; // basic guard, refine tomorrow\n\n  addRecipe(name, ingredients, steps);\n});\n\nrenderRecipes(); // initial render on page load", "explanation": ["Date.now() returns the current timestamp as a number - a quick, genuinely unique-enough id generator for a learning project like this (real production systems use more robust id generation).", "This structure directly reuses patterns from JS Store: load-from-localStorage-with-fallback (Day 75), a render function that rebuilds the display (Day 64), and an add function that updates data + saves + re-renders (Day 70).", "Notice this is DELIBERATELY minimal - no search, no delete, no fancy validation yet. That's exactly right for today: get ONE thing working end-to-end first.", "Your own project will look different in the DETAILS, but the same SHAPE applies: define your data structure, write an add function, write a render function, wire up the form."]}, "practice": {"easy": {"task": "Set up your project's basic data structure (an array of objects) and localStorage load/save, matching your OWN plan from yesterday.", "answerCode": "// Adapt this pattern to YOUR project idea:\nlet myData = JSON.parse(localStorage.getItem(\"myData\")) || [];\n\nfunction saveData() {\n  localStorage.setItem(\"myData\", JSON.stringify(myData));\n}", "answerExplain": "This load/save foundation, proven throughout Phase 5-6, works as a starting point for almost any data-driven project.", "output": "(your own project's data foundation, ready to build on)"}, "medium": {"task": "Implement the 'add new item' functionality for your core feature, including saving to localStorage and re-rendering.", "answerCode": "// Adapt this pattern:\nfunction addItem(itemData) {\n  myData.push({ id: Date.now(), ...itemData });\n  saveData();\n  renderItems();\n}", "answerExplain": "This mirrors the addRecipe() pattern - capture data, add a unique id, save, and re-render.", "output": "(your own working 'add item' feature)"}, "challenge": {"task": "Implement the 'view all items' rendering function for your project, confirming previously-added items display correctly, INCLUDING after a page refresh (persistence check).", "answerCode": "// Adapt this pattern:\nfunction renderItems() {\n  const container = document.getElementById(\"itemList\"); // your container's actual id\n  container.innerHTML = myData.map((item) => `<div>${item.name}</div>`).join(\"\");\n}\n\nrenderItems(); // call on page load too!", "answerExplain": "Confirming persistence works (via a real page refresh test) validates the SAME localStorage pattern from Day 75 applies correctly to your new project.", "output": "(your project correctly shows previously added items, even after refreshing the page)"}}, "realworld": {"text": "This 'get ONE core feature genuinely working end-to-end before adding more' approach is exactly how real developers build MVPs (Minimum Viable Products) - a small, real, working thing beats a large, ambitious, half-finished one.", "code": "// Today's working core feature is YOUR project's actual foundation -\n// everything else over the next few days builds on top of it."}, "review": {"keyPoints": ["Building the smallest genuinely WORKING version of your core feature first creates real, buildable momentum.", "Patterns from JS Store (load/save with localStorage, render functions, add functions) transfer directly to new, different projects.", "Deliberately deferring extra features (search, delete, polish) until later keeps today's scope focused and achievable."], "quiz": [{"q": "What does Date.now() return?", "options": ["The current date as text", "The current timestamp as a number", "Nothing useful"], "answerIndex": 1, "explain": "Date.now() returns the number of milliseconds since a fixed reference point, making it a simple unique-enough id source for learning projects."}, {"q": "Why deliberately build a MINIMAL version today, rather than trying to include everything?", "options": ["Minimal is always better forever", "To get something genuinely working end-to-end first, before adding complexity", "It's required"], "answerIndex": 1, "explain": "A working minimal version provides a solid foundation and real momentum, versus an ambitious but incomplete attempt."}], "interview": {"q": "What does 'MVP' (Minimum Viable Product) mean, and why is building one a common strategy in real software development?", "answer": "An MVP is the smallest version of a product that's genuinely usable and delivers real value. Building an MVP first lets developers/teams validate that the core idea actually works (and get real feedback) before investing time in additional features - reducing the risk of spending months building something nobody ends up wanting or needing."}, "tomorrow": "Day 88 - Build: Cart & Checkout (or your project's equivalent secondary features)."}}, {"day": 88, "title": "Build: Cart & Checkout", "time": "60 minutes", "learn": {"en": "Today you build your project's SECONDARY features - for JS Store, this was cart/checkout; for YOUR project, it's whatever functionality builds on top of yesterday's core (search, delete, categories, editing, etc.).", "hi": "Aaj tum apne project ke SECONDARY features banate ho - JS Store ke liye yeh cart/checkout tha; TUMHARE project ke liye, yeh jo bhi functionality kal ke core pe build hoti hai (search, delete, categories, editing, etc.).", "why": "A single core feature rarely makes a complete, useful application - today's layer is what makes your project feel genuinely functional and complete, not just a bare-bones demo.", "analogy": "Think of today like adding the plumbing and electrical systems after yesterday's foundation and frame - not the most visible part, but what makes the building genuinely LIVABLE.", "syntax": "(Applying array methods, DOM manipulation, and event handling to your specific secondary features)"}, "teacher": {"intro": "Let's continue the example project (Recipe Organizer), adding search and delete - adapt this to whatever YOUR secondary features are.", "code": "// Example: Recipe Organizer - adding search and delete\ndocument.getElementById(\"searchInput\").addEventListener(\"input\", function() {\n  const query = this.value.toLowerCase().trim();\n  const filtered = recipes.filter((r) => r.name.toLowerCase().includes(query));\n  renderRecipes(filtered);\n});\n\nfunction renderRecipes(list = recipes) {\n  const container = document.getElementById(\"recipeList\");\n\n  if (list.length === 0) {\n    container.innerHTML = \"<p>No recipes found.</p>\";\n    return;\n  }\n\n  container.innerHTML = list.map((r) => `\n    <div class=\"recipe-card\">\n      <h3>${r.name}</h3>\n      <p>${r.ingredients}</p>\n      <button class=\"delete-btn\" data-id=\"${r.id}\">Delete</button>\n    </div>\n  `).join(\"\");\n\n  document.querySelectorAll(\".delete-btn\").forEach((btn) => {\n    btn.addEventListener(\"click\", function() {\n      const id = Number(btn.getAttribute(\"data-id\"));\n      recipes = recipes.filter((r) => r.id !== id);\n      localStorage.setItem(\"recipes\", JSON.stringify(recipes));\n      renderRecipes();\n    });\n  });\n}", "explanation": ["renderRecipes(list = recipes) uses a DEFAULT PARAMETER - if called with no argument, it uses the full 'recipes' array; if called WITH an argument (like a filtered list), it uses that instead. This is a clean way to make one function serve both the 'show everything' and 'show search results' cases.", "The search input listener follows the EXACT pattern from Day 65 (JS Store's search feature) - filter on every keystroke, then re-render.", "Delete buttons follow the EXACT pattern from Day 71 (remove from cart) - filter OUT the matching id, save, re-render.", "Notice how much of TODAY's code is directly adapting patterns you ALREADY built and understand deeply from Phases 5-6 - this is the payoff of having built JS Store thoroughly."]}, "practice": {"easy": {"task": "Implement search/filtering for your OWN project's items, following the input-event + filter() + re-render pattern.", "answerCode": "// Adapt this pattern to your project:\ndocument.getElementById(\"searchInput\").addEventListener(\"input\", function() {\n  const query = this.value.toLowerCase().trim();\n  const filtered = myData.filter((item) => item.name.toLowerCase().includes(query));\n  renderItems(filtered);\n});", "answerExplain": "This exact pattern, proven in JS Store, transfers directly to searching any array of objects with a 'name' field.", "output": "(your project's search now filters items live as you type)"}, "medium": {"task": "Implement delete functionality for your project's items, including updating localStorage and re-rendering.", "answerCode": "// Adapt this pattern:\nfunction deleteItem(id) {\n  myData = myData.filter((item) => item.id !== id);\n  saveData();\n  renderItems();\n}", "answerExplain": "Filtering out the matching id, saving, and re-rendering is the same reliable pattern from Day 71.", "output": "(your project's delete button correctly removes items and persists the change)"}, "challenge": {"task": "Implement AT LEAST ONE more secondary feature from your own plan (e.g. categories, favorites, editing, sorting) - adapting whichever relevant pattern from Phases 1-6 best fits.", "answerCode": "// This is genuinely specific to YOUR project idea - look back\n// at similar features from Phase 5/6 (filtering, wishlist, sorting)\n// and adapt the closest matching pattern.", "answerExplain": "Recognizing which PAST pattern best fits a NEW situation is one of the most valuable general programming skills you can develop.", "output": "(your own additional secondary feature, working correctly)"}}, "realworld": {"text": "Real applications are built exactly this way - a solid core, then layer after layer of features, each REUSING and adapting patterns proven to work elsewhere in the same codebase (or from past projects/experience).", "code": "// Today's secondary features make your project feel genuinely\n// complete and useful, building directly on yesterday's foundation."}, "review": {"keyPoints": ["Secondary features (search, delete, filtering) round out a core feature into a genuinely complete, useful application.", "Default parameters (function(list = defaultValue)) let one function elegantly serve multiple related use cases.", "Recognizing and adapting PROVEN patterns from past work (like JS Store) is faster and more reliable than reinventing solutions from scratch."], "quiz": [{"q": "What does a default parameter like function renderItems(list = myData) do?", "options": ["Requires 'list' to always be provided", "Uses 'myData' automatically if no argument is passed", "Causes an error"], "answerIndex": 1, "explain": "Default parameters provide a fallback value used only when no argument is given for that parameter."}, {"q": "Why does today's delete function look almost identical to JS Store's Day 71 remove-from-cart function?", "options": ["Coincidence", "Because it's the same underlying pattern (filter out by id, save, re-render) applied to new data", "It's required to be identical"], "answerIndex": 1, "explain": "The same reliable pattern applies naturally to any 'remove an item from a list by id' situation."}], "interview": {"q": "Why is it valuable, as a developer, to consciously recognize 'I've solved a similar problem before' and reuse/adapt that pattern, rather than always solving each new problem completely from scratch?", "answer": "Recognizing and reusing proven patterns is faster, less error-prone (the pattern already works), and reflects genuine, accumulated experience - this is exactly how experienced developers work efficiently, drawing on a mental library of patterns they've built and refined over many projects, rather than reinventing solutions every single time."}, "tomorrow": "Day 89 - Build: Polish & Error Handling - refining your project into something genuinely solid."}}, {"day": 89, "title": "Build: Polish & Error Handling", "time": "60 minutes", "learn": {"en": "Today you polish your project - adding proper validation, handling edge cases (empty states, invalid input), and generally making it feel solid and trustworthy, not just 'technically working'.", "hi": "Aaj tum apna project polish karte ho - proper validation add karna, edge cases handle karna (empty states, invalid input), aur generally use solid aur trustworthy feel karwana, sirf 'technically working' nahi.", "why": "The difference between a rough prototype and a genuinely GOOD project is almost always in this polish - handling the edge cases and rough spots that a first working version usually misses.", "analogy": "Think of today like sanding, painting, and fitting doors properly after yesterday's plumbing/electrical work - the parts that make something feel finished and professional, not just functionally present.", "syntax": "(Applying validation, error handling, and empty-state patterns from Phases 1, 3, and 4)"}, "teacher": {"intro": "Let's polish the example project with validation and empty states - apply the SAME thinking to your own project's rough edges.", "code": "// Example: Recipe Organizer - adding validation and empty states\ndocument.getElementById(\"addRecipeBtn\").addEventListener(\"click\", function() {\n  const name = document.getElementById(\"recipeName\").value.trim();\n  const ingredients = document.getElementById(\"recipeIngredients\").value.trim();\n  const errorEl = document.getElementById(\"formError\");\n\n  if (name === \"\") {\n    errorEl.textContent = \"Recipe name is required.\";\n    return;\n  }\n  if (ingredients === \"\") {\n    errorEl.textContent = \"Please list at least one ingredient.\";\n    return;\n  }\n\n  errorEl.textContent = \"\";\n  addRecipe(name, ingredients);\n\n  // Clear the form after successful add - a nice usability touch\n  document.getElementById(\"recipeName\").value = \"\";\n  document.getElementById(\"recipeIngredients\").value = \"\";\n});\n\nfunction renderRecipes(list = recipes) {\n  const container = document.getElementById(\"recipeList\");\n\n  if (recipes.length === 0) {\n    container.innerHTML = \"<p>You haven't added any recipes yet. Add your first one above!</p>\";\n    return;\n  }\n  if (list.length === 0) {\n    container.innerHTML = \"<p>No recipes match your search.</p>\";\n    return;\n  }\n\n  container.innerHTML = list.map((r) => `<div class=\"recipe-card\"><h3>${r.name}</h3></div>`).join(\"\");\n}", "explanation": ["Validation (Day 44, Day 78) now blocks genuinely invalid submissions, with clear, specific error messages.", "Clearing the form fields after a SUCCESSFUL add is a small but meaningful usability improvement - the customer/user doesn't have to manually clear it themselves for their next entry.", "Notice TWO different empty states in renderRecipes(): 'you haven't added any yet' (genuinely empty data) versus 'no recipes match your search' (filtered result is empty, but data exists) - these are DIFFERENT situations deserving different messages.", "This kind of careful, empathetic attention to edge cases - what does the user see in EVERY possible situation, not just the 'happy path' - is exactly what separates polished projects from rough prototypes."]}, "practice": {"easy": {"task": "Add basic validation to your project's 'add item' form, preventing empty/invalid submissions with a clear error message.", "answerCode": "// Adapt this pattern:\nif (name === \"\") {\n  errorEl.textContent = \"This field is required.\";\n  return;\n}", "answerExplain": "Even simple presence-checking prevents a surprising number of real-world usability issues.", "output": "(your form now blocks empty submissions with a clear message)"}, "medium": {"task": "Add a proper 'genuinely empty' state message to your project (shown when there's no data at all yet, distinct from a search returning no results).", "answerCode": "// Adapt this pattern:\nif (myData.length === 0) {\n  container.innerHTML = \"<p>Nothing here yet - add your first item above!</p>\";\n  return;\n}", "answerExplain": "A welcoming, encouraging empty-state message (rather than a confusing blank area) genuinely improves first-time user experience.", "output": "(your project shows a friendly message when no data exists yet)"}, "challenge": {"task": "Find and fix at least ONE rough edge or bug in your own project by actually using it yourself, end to end, as if you were a genuine first-time user.", "answerCode": "// This is genuinely specific to YOUR project - actually use it,\n// try to break it, and fix whatever issue you discover.", "answerExplain": "This kind of honest, hands-on self-testing (exactly like Day 85's JS Store review) is how real developers catch the issues that pure code-reading misses.", "output": "(your own bug fix, specific to whatever you found)"}}, "realworld": {"text": "This polish phase - validation, empty states, clearing forms after success, honest self-testing - is what real teams call 'QA' (Quality Assurance) and UX refinement, and it's just as important as the original feature-building work.", "code": "// Polish is what makes a project feel trustworthy and complete,\n// not just technically functional."}, "review": {"keyPoints": ["Proper validation with clear error messages prevents invalid data and confusing failures.", "Different empty states (no data at all vs. no search results) deserve different, situation-appropriate messages.", "Honest, hands-on self-testing as a genuine user is how real developers catch rough edges that code-reading alone misses."], "quiz": [{"q": "Why distinguish between 'no data exists yet' and 'search found nothing' as separate empty states?", "options": ["No real reason", "They're genuinely different situations that deserve different, clearer messaging", "It's required syntax"], "answerIndex": 1, "explain": "Clear, situation-specific messaging helps users understand exactly what's happening in each case."}, {"q": "Why clear form fields after a SUCCESSFUL add?", "options": ["It's unnecessary", "A small usability improvement so users don't have to manually clear it for their next entry", "It's required by JavaScript"], "answerIndex": 1, "explain": "Small usability touches like this contribute meaningfully to how polished a project feels overall."}], "interview": {"q": "Why might 'polish' work like this (validation, empty states, edge cases) often take AS MUCH TIME as building the original core features, even though it can feel less exciting?", "answer": "Core features often represent the 'happy path' (everything working perfectly), but real usage involves countless edge cases, mistakes, and unusual situations - properly handling ALL of these takes real, careful effort, and directly determines whether users trust and enjoy using the finished product, or find it frustrating and unreliable."}, "tomorrow": "Day 90 - Final Project Completion 🏆 - the final review and celebration of your 90-day journey!"}}, {"day": 90, "title": "Final Project Completion 🏆", "time": "60 minutes", "learn": {"en": "Congratulations - today is the final day of your 90-day journey. You'll do a complete review of your final project, reflect on everything you've learned since Day 1, and plan your next steps beyond this course.", "hi": "Congratulations - aaj tumhari 90-day journey ka final din hai. Tum apne final project ka complete review karoge, Day 1 se ab tak jo kuch seekha uspe reflect karoge, aur is course ke aage ke next steps plan karoge.", "why": "Genuinely completing something - reviewing it honestly, celebrating the real progress made, and planning what comes next - is just as important a skill as the technical learning itself.", "analogy": "Think of today like graduation day: not just receiving a certificate, but genuinely reflecting on the journey, and thoughtfully planning your very next steps forward.", "syntax": "(Reflection and completion day - no new syntax; this is about YOU)"}, "teacher": {"intro": "Let's do a structured final review of your 90-day journey and your completed final project.", "code": "// FINAL PROJECT REVIEW CHECKLIST:\n// 1. Does your core feature (Day 87) work reliably, end to end?\n// 2. Do your secondary features (Day 88) work correctly together with the core?\n// 3. Is your validation/error handling (Day 89) genuinely solid?\n// 4. Does your data persist correctly across page refreshes?\n// 5. Have you tested it as a genuine first-time user, not just as its builder?\n\n// PERSONAL REFLECTION QUESTIONS:\n// - Which single day/concept felt like the biggest breakthrough for you?\n// - Which concept do you still feel LEAST confident about?\n// - What real project (at work or personally) could you now build or improve,\n//   using what you've learned in these 90 days?\n\nconsole.log(\"90 days ago, this course started with console.log('Hello, JavaScript!')\");\nconsole.log(\"Today, you've built complete, interactive, data-driven applications.\");\nconsole.log(\"That is genuinely significant progress. Well done.\");", "explanation": ["The final project review checklist mirrors Day 85's JS Store review - this SAME disciplined, holistic review habit is valuable for any project you build in the future, not just this course.", "The personal reflection questions matter just as much as the technical checklist - genuine learning includes knowing your own strengths AND honestly identifying what still needs more practice.", "Identifying a REAL project (at work, or personal) you could now tackle is the single best way to keep growing - the skills from this course only truly solidify through continued real use.", "From Day 1's single console.log() to a complete, multi-feature e-commerce project (Phase 5-6) and your own original final project (Phase 7) - that progression represents genuine, substantial growth in 90 days."]}, "practice": {"easy": {"task": "Run through the Final Project Review Checklist above on YOUR completed project, noting the results honestly.", "answerCode": "// Genuinely test your own final project against each checklist item.", "answerExplain": "An honest final review, rather than just assuming everything works, is the right way to close out any real project.", "output": "(your own honest checklist results)"}, "medium": {"task": "Write your own answers to the three Personal Reflection Questions above.", "answerCode": "// - Biggest breakthrough day/concept: ...\n// - Concept you feel least confident about: ...\n// - A real project you could now build/improve: ...", "answerExplain": "Honest self-reflection is a genuinely valuable skill, helping you direct your CONTINUED learning efficiently after this course ends.", "output": "(your own thoughtful reflections)"}, "challenge": {"task": "Write a short plan (3-5 bullet points) for what you'll learn or build NEXT, beyond this 90-day course, to keep growing as a developer.", "answerCode": "// Example next steps:\n// 1. Learn React, building on the strong vanilla JS foundation from this course\n// 2. Rebuild JS Store's cart/checkout logic using React components\n// 3. Apply Phase 4's fetch/API skills to a REAL public API (weather, news, etc.)\n// 4. Revisit and refactor my final project with what I'll learn in React\n// 5. Start reading real open-source JavaScript project code for exposure to professional patterns", "answerExplain": "A concrete next-steps plan turns the END of this course into the BEGINNING of your next stage of growth, rather than a stopping point.", "output": "(your own personalized next-steps plan)"}}, "realworld": {"text": "Every genuinely skilled developer continuously does exactly this: build something, review it honestly, reflect on what was learned, and deliberately plan the next thing to tackle - a cycle that never really stops, even for senior engineers.", "code": "// You didn't just complete a course - you built the genuine\n// HABITS and THINKING PATTERNS of a real developer, over 90 real days."}, "review": {"keyPoints": ["A disciplined final review (checklist + honest reflection) is valuable practice for any project, not just this course.", "Identifying both your breakthroughs AND your weaker areas honestly helps direct future learning efficiently.", "Planning concrete next steps turns course completion into the start of continued growth, not an ending."], "quiz": [{"q": "Why review your final project against a checklist rather than just assuming it's finished?", "options": ["It's unnecessary busywork", "An honest, structured review catches issues assumption alone would miss", "It's required for all code"], "answerIndex": 1, "explain": "Structured review is a genuinely valuable habit that catches real issues, exactly like Day 85's JS Store review."}, {"q": "Why identify concepts you're still LEAST confident about, rather than only celebrating what went well?", "options": ["To feel bad about yourself", "To honestly direct where your continued learning/practice should focus next", "It's required"], "answerIndex": 1, "explain": "Honest self-assessment of weaker areas is how you efficiently direct future learning, rather than only reinforcing existing strengths."}], "interview": {"q": "Reflecting on this entire 90-day journey - from Day 1's console.log() through building complete applications - what do you think matters more for a developer's long-term growth: memorizing syntax, or the habits of incremental building, testing, and honest self-review practiced throughout this course?", "answer": "(Genuinely open-ended, and there's no single correct answer - but most experienced developers would emphasize that syntax can always be looked up, while the HABITS of breaking problems into small pieces, testing rigorously, debugging patiently, and honestly reviewing one's own work are what truly compound over a long career, and are exactly what this 90-day course has been building throughout, from Day 1's simple console.log() onward.)"}, "tomorrow": "There is no 'tomorrow' in this course - but there IS a next project, a next feature, a next thing to learn. Congratulations on completing all 90 days! 🏆"}}]</script>

<script>
/* ===================== Data ===================== */
const CURRICULUM = JSON.parse(document.getElementById('curriculum-data').textContent);
const DAYS = JSON.parse(document.getElementById('days-data').textContent);
const DAYS_MAP = {};
DAYS.forEach(d => DAYS_MAP[d.day] = d);
const TOTAL_DAYS = 90;

/* ===================== Progress (localStorage) ===================== */
const STORAGE_KEY = 'jsCourseProgress90';

function loadProgress(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return { completedDays: [], currentDay: 1, streak: 0, lastCompletedDate: null };
    const parsed = JSON.parse(raw);
    return {
      completedDays: parsed.completedDays || [],
      currentDay: parsed.currentDay || 1,
      streak: parsed.streak || 0,
      lastCompletedDate: parsed.lastCompletedDate || null
    };
  }catch(e){
    return { completedDays: [], currentDay: 1, streak: 0, lastCompletedDate: null };
  }
}

function saveProgress(p){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(p));
}

let progress = loadProgress();
let activeDay = progress.currentDay || 1;

function markDayComplete(dayNum){
  if(!progress.completedDays.includes(dayNum)){
    progress.completedDays.push(dayNum);
  }
  const today = new Date().toDateString();
  if(progress.lastCompletedDate !== today){
    progress.streak = (progress.streak || 0) + 1;
    progress.lastCompletedDate = today;
  }
  if(dayNum >= progress.currentDay && dayNum < TOTAL_DAYS){
    progress.currentDay = dayNum + 1;
  }
  saveProgress(progress);
  renderSidebar();
  renderMain();
}

function resetProgress(){
  if(!confirm('Reset all progress? This cannot be undone.')) return;
  progress = { completedDays: [], currentDay: 1, streak: 0, lastCompletedDate: null };
  saveProgress(progress);
  activeDay = 1;
  renderSidebar();
  renderMain();
}

/* ===================== Sidebar ===================== */
const openPhases = new Set();
function phaseOf(num){ const p = CURRICULUM.find(p => p.days.some(d => d[0] === num)); return p ? p.phase : 1; }
openPhases.add(phaseOf(activeDay));

function renderSidebar(){
  const nav = document.getElementById('sidebarNav');
  nav.innerHTML = '';
  CURRICULUM.forEach(phase => {
    const group = document.createElement('div');
    group.className = 'phase-group' + (openPhases.has(phase.phase) ? '' : ' collapsed');
    const doneN = phase.days.filter(d => progress.completedDays.includes(d[0])).length;
    const head = document.createElement('button');
    head.className = 'phase-title';
    head.innerHTML = `<span>Phase ${phase.phase} · ${phase.name}</span><span>${doneN}/${phase.days.length} <i>▾</i></span>`;
    head.onclick = () => {
      group.classList.toggle('collapsed');
      if(group.classList.contains('collapsed')) openPhases.delete(phase.phase); else openPhases.add(phase.phase);
    };
    group.appendChild(head);
    phase.days.forEach(([num, dayTitle]) => {
      const hasContent = !!DAYS_MAP[num];
      const item = document.createElement('button');
      item.className = 'day-item' + (hasContent ? '' : ' locked') + (progress.completedDays.includes(num) ? ' done' : '') + (num === activeDay ? ' active' : '');
      item.innerHTML = `<span class="marker">${progress.completedDays.includes(num) ? '✓' : ''}</span><span class="day-num">Day ${num}</span><span class="day-title"></span>`;
      item.querySelector('.day-title').textContent = hasContent ? dayTitle : dayTitle + ' (coming soon)';
      if(hasContent) item.onclick = () => goDay(num);
      group.appendChild(item);
    });
    nav.appendChild(group);
  });
  const pct = Math.round((progress.completedDays.length / TOTAL_DAYS) * 100);
  document.getElementById('sbProgressText').textContent = `Day ${progress.currentDay > TOTAL_DAYS ? TOTAL_DAYS : progress.currentDay} / ${TOTAL_DAYS}`;
  document.getElementById('sbProgressPct').textContent = pct + '%';
  document.getElementById('sbProgressFill').style.width = pct + '%';
}

/* ===================== Mobile sidebar toggle ===================== */
function openSidebarMobile(){
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('sidebarOverlay').classList.add('show');
}
function closeSidebarMobile(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('show');
}
document.getElementById('hamburgerBtn').addEventListener('click', openSidebarMobile);
document.getElementById('sidebarOverlay').addEventListener('click', closeSidebarMobile);

/* ===================== Progress Ring ===================== */
function ringSVG(pct, size=110, stroke=10){
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  const offset = c - (pct/100) * c;
  return `
  <div class="ring-wrap">
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
      <circle class="ring-bg" cx="${size/2}" cy="${size/2}" r="${r}" />
      <circle class="ring-fill" cx="${size/2}" cy="${size/2}" r="${r}" stroke-dasharray="${c}" stroke-dashoffset="${offset}" />
    </svg>
    <div class="ring-label"><div class="pct">${pct}%</div><div class="sub">complete</div></div>
  </div>`;
}

/* ===================== Dashboard ===================== */
function renderDashboard(){
  const pct = Math.round((progress.completedDays.length / TOTAL_DAYS) * 100);
  const nextDay = Math.min(progress.currentDay, TOTAL_DAYS);
  const nextDayData = DAYS_MAP[nextDay];
  const nextTitle = nextDayData ? nextDayData.title : findTitle(nextDay);
  const phases = CURRICULUM.map(p => {
    const dn = p.days.filter(d => progress.completedDays.includes(d[0])).length;
    const first = p.days.find(d => !progress.completedDays.includes(d[0]) && DAYS_MAP[d[0]]) || p.days[0];
    return `<button class="phase-card" data-day="${first[0]}"><div class="pc-top"><strong>Phase ${p.phase}</strong><span>${dn}/${p.days.length} days</span></div><div class="pc-name">${escapeHtml(p.name)}</div><div class="pc-bar"><i style="width:${Math.round(dn/p.days.length*100)}%"></i></div><div class="pc-sub">Days ${p.days[0][0]}–${p.days[p.days.length-1][0]}</div></button>`;
  }).join('');
  return `
  <div class="dashboard-hero">
    <div>
      <div class="eyebrow">WELCOME BACK</div>
      <h2>Day ${nextDay} of 90</h2>
      <div class="meta">Next: <strong>${escapeHtml(nextTitle)}</strong> · about 60 minutes</div>
      <div class="hero-actions">
        <button class="btn btn-primary" id="continueBtn">Continue Learning →</button>
        <span class="streak-chip">🔥 ${progress.streak} day${progress.streak===1?'':'s'} streak</span>
      </div>
    </div>
    ${ringSVG(pct)}
  </div>
  <div class="time-block">
    <h3>How each day works</h3>
    <p style="margin:0;color:var(--ink-soft)">Six small steps. Do one at a time — tap Next when you are ready.</p>
    <div class="how-grid">${STEPS.map(s => `<div class="how-chip"><b>${s[1]} ${s[0]}</b>${s[3]}</div>`).join('')}</div>
  </div>
  <h3 style="margin:22px 0 10px">Your roadmap</h3>
  <div class="phase-grid">${phases}</div>
  <button class="btn btn-ghost" id="resetBtn">Reset Progress</button>
  `;
}

function findTitle(num){
  for(const phase of CURRICULUM){
    for(const [n, t] of phase.days){
      if(n === num) return t;
    }
  }
  return '';
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

/* ===================== Code highlighting ===================== */
function paintCode(code){
  const re = /(\/\/.*$)|("[^"\n]*"|'[^'\n]*'|`[^`]*`)|\b(const|let|var|function|return|if|else|for|while|of|in|new|true|false|null|undefined|async|await|try|catch|throw|break|continue|switch|case)\b|\b(\d+(?:\.\d+)?)\b/gm;
  return escapeHtml(code).replace(re, (m, c, s, k, n) => c ? `<span class="cm">${m}</span>` : s ? `<span class="str">${m}</span>` : k ? `<span class="kw">${m}</span>` : `<span class="num">${m}</span>`);
}

/* ===================== Learning state ===================== */
const LANG_KEY = 'jsCourseLang';
let lang = 'en';
try{ lang = localStorage.getItem(LANG_KEY) || 'en'; }catch(e){}
let activeStep = 0, pendingCode = null, codeStore = [];
const STEPS = [
  ['Learn','📖','Learn the idea','~10 min'],
  ['Code','👨‍💻','Code with the teacher','~15 min'],
  ['Practice','✍️','Practice','~20 min'],
  ['Use','🛒','Real-world use','~10 min'],
  ['Review','✅','Review & quiz','~5 min'],
  ['Play','🧪','Playground','free time']
];

function goDay(n){
  if(!DAYS_MAP[n]) return;
  activeDay = n; activeStep = 0; pendingCode = null;
  openPhases.add(phaseOf(n));
  closeSidebarMobile(); renderSidebar(); renderMain(); window.scrollTo(0,0);
}
function goStep(i){
  activeStep = Math.max(0, Math.min(STEPS.length - 1, i));
  renderMain(); window.scrollTo(0,0);
  const on = document.querySelector('.step-pill.on');
  if(on) on.scrollIntoView({inline:'center', block:'nearest'});
}
function tryCode(text){ pendingCode = text; goStep(5); }

function codeBlock(code, tryIt){
  const i = codeStore.push(code) - 1;
  return `<div class="code-wrap"><div class="code-bar"><span>JavaScript</span><span><button class="mini-btn" data-copy="${i}">Copy</button>${tryIt ? `<button class="mini-btn go" data-try="${i}">▶ Try it</button>` : ''}</span></div><pre class="code-block">${paintCode(code)}</pre></div>`;
}

/* ===================== Step renderers ===================== */
function stepLearn(day){
  const L = day.learn;
  const seg = [['en','English'],['hi','हिंदी'],['both','Both']].map(([k,t]) => `<button class="${lang===k?'on':''}" data-lang="${k}">${t}</button>`).join('');
  let cards = '';
  if(lang !== 'hi') cards += `<div class="lang-card"><div class="flag">ENGLISH</div><p style="margin:0">${escapeHtml(L.en)}</p></div>`;
  if(lang !== 'en') cards += `<div class="lang-card"><div class="flag">HINDI / HINGLISH</div><p style="margin:0">${escapeHtml(L.hi)}</p></div>`;
  return `<div class="seg" role="group" aria-label="Language">${seg}</div>
  <div class="lang-pair" style="grid-template-columns:1fr">${cards}</div>
  <div class="callout"><strong>Why we need it:</strong> ${escapeHtml(L.why)}</div>
  <div class="callout analogy"><strong>Analogy:</strong> ${escapeHtml(L.analogy)}</div>
  ${L.syntax ? codeBlock(L.syntax, true) : ''}`;
}
function stepCode(day){
  const T = day.teacher;
  return `<p>${escapeHtml(T.intro)}</p>${codeBlock(T.code, true)}
  <p style="font-weight:600;margin:16px 0 0">What each part does</p>
  <ul class="explain-list">${T.explanation.map(l => `<li>${escapeHtml(l)}</li>`).join('')}</ul>`;
}
function practiceCard(level, label, item){
  const id = level + '-' + Math.random().toString(36).slice(2,8);
  const i = codeStore.push('// Task: ' + item.task + '\n\n') - 1;
  return `<div class="practice-card">
    <span class="tag tag-${level}">${label}</span>
    <p style="margin:6px 0 0">${escapeHtml(item.task)}</p>
    <div class="actions">
      <button class="mini-btn go" style="color:var(--teal-dark)" data-try="${i}">▶ Try it</button>
      <button class="show-answer-btn" data-answer-target="${id}">Show Answer</button>
    </div>
    <div class="answer-box" id="${id}">
      ${codeBlock(item.answerCode, false)}
      <p style="font-size:14.5px;color:var(--ink-soft);margin:8px 0 0">${escapeHtml(item.answerExplain)}</p>
      <div class="output-line">${escapeHtml(item.output)}</div>
    </div></div>`;
}
function stepPractice(day){
  const P = day.practice;
  return `<div class="tip">💡 Try it yourself first, then peek at the answer. Mistakes are how you learn.</div>
  <div class="practice-grid">
    ${practiceCard('easy','🟢 Easy · 5 min',P.easy)}
    ${practiceCard('medium','🟡 Medium · 10 min',P.medium)}
    ${practiceCard('challenge','🔴 Challenge · optional',P.challenge)}
  </div>`;
}
function stepUse(day){
  return `<p>${escapeHtml(day.realworld.text)}</p>${codeBlock(day.realworld.code, true)}`;
}
function quizCard(dayNum, qi, q){
  const qid = `q-${dayNum}-${qi}`;
  return `<div class="quiz-card">
    <p style="margin:0 0 4px;font-weight:500">${escapeHtml(q.q)}</p>
    <div class="quiz-options" id="${qid}-opts">
      ${q.options.map((opt, oi) => `<button class="quiz-opt" data-qid="${qid}" data-oi="${oi}" data-correct="${q.answerIndex}">${escapeHtml(opt)}</button>`).join('')}
    </div>
    <div class="quiz-explain" id="${qid}-explain">${escapeHtml(q.explain)}</div>
  </div>`;
}
function stepReview(day){
  const R = day.review;
  return `<p style="font-weight:600;margin-bottom:6px">3 key points to remember</p>
  <ul class="explain-list" style="margin-bottom:20px">${R.keyPoints.map(k => `<li>${escapeHtml(k)}</li>`).join('')}</ul>
  <p style="font-weight:600;margin-bottom:8px">Quick quiz</p>
  ${R.quiz.map((q, qi) => quizCard(day.day, qi, q)).join('')}
  <p style="font-weight:600;margin:20px 0 8px">Interview question</p>
  <div class="interview-card">
    <p style="margin-bottom:10px">${escapeHtml(R.interview.q)}</p>
    <button class="show-answer-btn" data-answer-target="interview-${day.day}">Show Answer</button>
    <div class="answer-box" id="interview-${day.day}"><p style="margin:10px 0 0">${escapeHtml(R.interview.answer)}</p></div>
  </div>
  <div class="tomorrow-strip"><div><strong>Tomorrow:</strong> ${escapeHtml(R.tomorrow)}</div></div>`;
}
function stepPlay(day){
  const syms = ['()','{}','[]','""',"''",'``','${}',';','=','=>','.',',','+','!'];
  const start = pendingCode !== null ? pendingCode : `console.log("Hello from Day ${day.day}!");`;
  return `<p style="color:var(--ink-soft)">Write JavaScript and press Run. Your <code class="inline">console.log()</code> output shows below. Tip: Ctrl/⌘ + Enter also runs.</p>
  <div class="playground">
    <textarea id="playgroundInput" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off">${escapeHtml(start)}</textarea>
    <div class="sym-bar">${syms.map(s => `<button type="button" class="sym" data-ins="${escapeHtml(s)}">${escapeHtml(s)}</button>`).join('')}</div>
    <div class="pg-actions"><button class="run-btn" id="runCodeBtn">▶ Run</button><button class="run-btn alt" id="clearCodeBtn">Clear</button></div>
    <div class="playground-output" id="playgroundOutput">Output will appear here...</div>
  </div>`;
}

/* ===================== Day View ===================== */
function renderDay(day){
  codeStore = [];
  const done = progress.completedDays.includes(day.day);
  const last = activeStep === STEPS.length - 1;
  const pills = STEPS.map((s, i) => `<button class="step-pill${i===activeStep?' on':''}${i<activeStep?' past':''}" data-step="${i}" ${i===activeStep?'aria-current="step"':''}><span class="sp-ic">${i<activeStep?'✓':s[1]}</span>${s[0]}</button>`).join('');
  const body = [stepLearn, stepCode, stepPractice, stepUse, stepReview, stepPlay][activeStep](day);
  const back = activeStep > 0
    ? `<button class="btn btn-secondary" data-step="${activeStep-1}">← Back</button>`
    : (DAYS_MAP[day.day-1] ? `<button class="btn btn-secondary" data-day="${day.day-1}">← Day ${day.day-1}</button>` : '');
  let next;
  if(!last) next = `<button class="btn btn-primary grow" data-step="${activeStep+1}">Next: ${STEPS[activeStep+1][2]} →</button>`;
  else if(!done) next = `<button class="btn btn-primary grow" id="markCompleteBtn">✓ Finish Day ${day.day}</button>`;
  else if(DAYS_MAP[day.day+1]) next = `<button class="btn btn-primary grow" data-day="${day.day+1}">Start Day ${day.day+1} →</button>`;
  else next = `<span class="streak-chip">🏆 Course complete</span>`;
  return `
  <div class="day-head">
    <div class="eyebrow">DAY ${day.day} OF 90 · ${escapeHtml(day.time)}${done ? ' · ✓ Completed' : ''}</div>
    <h2>${escapeHtml(day.title)}</h2>
  </div>
  <div class="step-bar" role="tablist">${pills}</div>
  <div class="step-title"><h3>${STEPS[activeStep][1]} ${STEPS[activeStep][2]}</h3><span class="time-range">${STEPS[activeStep][3]}</span></div>
  <div class="time-block">${body}</div>
  <div class="stepnav">${back}${next}</div>`;
}

/* ===================== Main render dispatcher ===================== */
function renderMain(){
  const main = document.getElementById('mainContent');
  const dayData = DAYS_MAP[activeDay];
  if(activeDay === 0 || !dayData){
    main.innerHTML = renderDashboard();
    document.getElementById('mobileTitle').textContent = 'Dashboard';
  }else{
    main.innerHTML = renderDay(dayData);
    document.getElementById('mobileTitle').textContent = 'Day ' + dayData.day + ' · ' + dayData.title;
  }
  attachMainListeners();
}

function insertAtCursor(ta, s){
  const a = ta.selectionStart, b = ta.selectionEnd;
  ta.value = ta.value.slice(0, a) + s + ta.value.slice(b);
  const mid = ['()','{}','[]','""',"''",'``'].includes(s) ? 1 : (s === '${}' ? 2 : s.length);
  ta.focus(); ta.selectionStart = ta.selectionEnd = a + mid;
}
function runPlayground(){
  const code = document.getElementById('playgroundInput').value;
  const outputEl = document.getElementById('playgroundOutput');
  const logs = [];
  const fmt = a => typeof a === 'object' ? JSON.stringify(a) : String(a);
  const fakeConsole = {
    log: (...a) => logs.push(a.map(fmt).join(' ')),
    error: (...a) => logs.push('Error: ' + a.map(fmt).join(' ')),
    warn: (...a) => logs.push('Warning: ' + a.map(fmt).join(' '))
  };
  try{
    new Function('console', code)(fakeConsole);
    outputEl.textContent = logs.length ? logs.join('\n') : '(no console.log output)';
  }catch(err){ outputEl.textContent = '⚠ ' + err.message; }
}

function attachMainListeners(){
  const main = document.getElementById('mainContent');
  main.onpointerdown = e => { if(e.target.closest('.sym')) e.preventDefault(); };
  main.onkeydown = e => {
    if(e.target.id !== 'playgroundInput') return;
    if((e.ctrlKey || e.metaKey) && e.key === 'Enter'){ e.preventDefault(); runPlayground(); }
    if(e.key === 'Tab'){ e.preventDefault(); insertAtCursor(e.target, '  '); }
  };
  main.onclick = e => {
    const t = e.target.closest('button');
    if(!t) return;
    const d = t.dataset;
    if(d.step !== undefined) return goStep(+d.step);
    if(d.day !== undefined) return goDay(+d.day);
    if(d.lang){ lang = d.lang; try{ localStorage.setItem(LANG_KEY, lang); }catch(_){} return renderMain(); }
    if(d.copy !== undefined){
      const txt = codeStore[+d.copy];
      const ok = () => { t.textContent = 'Copied ✓'; setTimeout(() => t.textContent = 'Copy', 1500); };
      if(navigator.clipboard) navigator.clipboard.writeText(txt).then(ok, () => {});
      return;
    }
    if(d.try !== undefined) return tryCode(codeStore[+d.try]);
    if(d.ins !== undefined) return insertAtCursor(document.getElementById('playgroundInput'), d.ins);
    if(d.answerTarget){
      const box = document.getElementById(d.answerTarget);
      const shown = box.classList.toggle('shown');
      t.textContent = shown ? 'Hide Answer' : 'Show Answer';
      return;
    }
    if(t.classList.contains('quiz-opt')){
      const wrap = document.getElementById(d.qid + '-opts');
      if(wrap.dataset.answered === 'true') return;
      wrap.dataset.answered = 'true';
      const correct = +d.correct, oi = +d.oi;
      wrap.querySelectorAll('.quiz-opt').forEach((o, i) => {
        if(i === correct) o.classList.add('correct'); else if(i === oi) o.classList.add('wrong');
      });
      const ex = document.getElementById(d.qid + '-explain');
      ex.innerHTML = `<strong>${oi === correct ? '✓ Correct! ' : '✗ Not quite. '}</strong>` + ex.innerHTML;
      ex.classList.add('shown');
      return;
    }
    switch(t.id){
      case 'continueBtn': return goDay(Math.min(progress.currentDay, TOTAL_DAYS));
      case 'resetBtn': return resetProgress();
      case 'markCompleteBtn': return markDayComplete(activeDay);
      case 'runCodeBtn': return runPlayground();
      case 'clearCodeBtn': document.getElementById('playgroundInput').value = ''; document.getElementById('playgroundOutput').textContent = 'Output will appear here...'; return;
    }
  };
}

document.addEventListener('keydown', e => { if(e.key === 'Escape') closeSidebarMobile(); });
document.getElementById('hamburgerBtn').addEventListener('click', () => setTimeout(() => {
  const a = document.querySelector('.day-item.active');
  if(a) a.scrollIntoView({block:'center'});
}, 60));

/* ===================== Init ===================== */
renderSidebar();
renderMain();

</script>
