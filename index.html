User(\"Priya\", function() {\n  console.log(\"Callback executed!\");\n});", "answerExplain": "The callback runs AFTER the greeting, exactly where we placed callback() inside the function.", "output": "Hello, Priya!\nCallback executed!"}, "medium": {"task": "Write a function calculateAndReport(price, quantity, callback) that calculates a total and passes that total INTO the callback as an argument.", "answerCode": "function calculateAndReport(price, quantity, callback) {\n  const total = price * quantity;\n  callback(total);\n}\n\ncalculateAndReport(999, 3, function(total) {\n  console.log(`Your total is ₹${total}`);\n});", "answerExplain": "Callbacks can receive arguments too - here, the calculated 'total' is passed INTO the callback function when it's called.", "output": "Your total is ₹2997"}, "challenge": {"task": "Rewrite the calculateAndReport example, but pass an ARROW function as the callback instead of a regular function expression.", "answerCode": "function calculateAndReport(price, quantity, callback) {\n  const total = price * quantity;\n  callback(total);\n}\n\ncalculateAndReport(799, 2, (total) => {\n  console.log(`Your total is ₹${total}`);\n});", "answerExplain": "Arrow functions work perfectly as callbacks too, and are actually the more common modern style for this exact use case.", "output": "Your total is ₹1598"}}, "realworld": {"text": "Every addEventListener(\"click\", callback) call you've written uses this exact pattern - the browser calls YOUR callback function whenever the click actually happens, which is a callback in disguise.", "code": "button.addEventListener(\"click\", function() {\n  console.log(\"This is a callback function!\");\n});"}, "review": {"keyPoints": ["A callback is a function passed as an argument to another function, to be called later.", "map(), filter(), and addEventListener() all use callbacks internally - you've been using this pattern already.", "Callbacks can receive arguments too, letting the outer function pass data INTO them."], "quiz": [{"q": "What is a callback function?", "options": ["A function that calls itself", "A function passed as an argument to another function", "A function with no parameters"], "answerIndex": 1, "explain": "A callback is passed into another function to be invoked later."}, {"q": "Have you already used callbacks before today, even without the name?", "options": ["No, this is entirely new", "Yes - in map(), filter(), and addEventListener()", "Only in loops"], "answerIndex": 1, "explain": "These methods all rely on callback functions you provide."}], "interview": {"q": "What is 'callback hell', and why did it become a known problem in JavaScript?", "answer": "Callback hell refers to deeply nested callbacks (a callback inside a callback inside another callback), which becomes hard to read and maintain - especially common with sequential asynchronous operations. This problem is a big reason Promises and async/await (which we'll cover in a few days) were introduced."}, "tomorrow": "Day 48 - Error Handling: dealing gracefully with things that go wrong."}}, {"day": 48, "title": "Error Handling", "time": "60 minutes", "learn": {"en": "Errors happen - invalid input, missing data, failed calculations. Error handling means your code detects and responds to problems gracefully, instead of crashing completely.", "hi": "Errors hoti hain - invalid input, missing data, failed calculations. Error handling ka matlab hai ki tumhara code problems ko detect aur handle kare gracefully, poori tarah crash hone ke bajaye.", "why": "A single unexpected error shouldn't break your ENTIRE page - proper handling lets you show a friendly message instead, while the rest of the app keeps working.", "analogy": "Think of error handling like a car's airbag system - it doesn't prevent every accident, but it catches the impact gracefully instead of letting it be catastrophic.", "syntax": "if (somethingIsWrong) {\n  console.log(\"Handle it gracefully\");\n}"}, "teacher": {"intro": "Let's write defensive checks before performing an operation that could fail.", "code": "function calculateDiscount(price, percent) {\n  if (typeof price !== \"number\" || typeof percent !== \"number\") {\n    console.log(\"Error: price and percent must both be numbers.\");\n    return null;\n  }\n  if (percent < 0 || percent > 100) {\n    console.log(\"Error: percent must be between 0 and 100.\");\n    return null;\n  }\n  return price * (percent / 100);\n}\n\nconsole.log(calculateDiscount(999, 10));      // valid\nconsole.log(calculateDiscount(\"999\", 10));    // invalid type\nconsole.log(calculateDiscount(999, 150));     // invalid range", "explanation": ["Checking typeof price !== \"number\" catches an entire category of bad input BEFORE attempting any math with it.", "Checking percent < 0 || percent > 100 validates the VALUE makes logical sense, not just its type.", "Returning null (and logging a clear message) lets the calling code know something went wrong, without crashing.", "This kind of upfront checking is called 'defensive programming' - anticipating what could go wrong and guarding against it."]}, "practice": {"easy": {"task": "Write a function safeDivide(a, b) that checks if b is 0 before dividing, logging an error message instead of dividing by zero.", "answerCode": "function safeDivide(a, b) {\n  if (b === 0) {\n    console.log(\"Error: Cannot divide by zero.\");\n    return null;\n  }\n  return a / b;\n}\nconsole.log(safeDivide(10, 2));\nconsole.log(safeDivide(10, 0));", "answerExplain": "Dividing by zero in JS doesn't throw an error (it returns Infinity), so explicitly checking for it prevents confusing results.", "output": "5\nError: Cannot divide by zero.\nnull"}, "medium": {"task": "Write a function getFirstProduct(products) that checks if the array is empty before returning products[0], logging a message if it is.", "answerCode": "function getFirstProduct(products) {\n  if (products.length === 0) {\n    console.log(\"No products available.\");\n    return null;\n  }\n  return products[0];\n}\nconsole.log(getFirstProduct([]));\nconsole.log(getFirstProduct([\"Vitamin C\"]));", "answerExplain": "Checking .length === 0 upfront avoids returning undefined silently, giving a clearer signal about what happened.", "output": "No products available.\nnull\nVitamin C"}, "challenge": {"task": "Write a function applyCoupon(cartTotal, couponCode) that validates couponCode is a non-empty string AND cartTotal is a positive number, handling BOTH potential problems clearly.", "answerCode": "function applyCoupon(cartTotal, couponCode) {\n  if (typeof couponCode !== \"string\" || couponCode.trim() === \"\") {\n    console.log(\"Error: Please provide a valid coupon code.\");\n    return null;\n  }\n  if (typeof cartTotal !== \"number\" || cartTotal <= 0) {\n    console.log(\"Error: Cart total must be a positive number.\");\n    return null;\n  }\n  console.log(`Applying ${couponCode} to ₹${cartTotal}`);\n}\napplyCoupon(999, \"\");\napplyCoupon(-50, \"SAVE10\");\napplyCoupon(999, \"SAVE10\");", "answerExplain": "Checking multiple independent conditions, each with its OWN clear error message, helps pinpoint exactly what went wrong.", "output": "Error: Please provide a valid coupon code.\nError: Cart total must be a positive number.\nApplying SAVE10 to ₹999"}}, "realworld": {"text": "Before submitting a checkout form, real e-commerce sites validate every field (address, payment, quantity) this way, showing SPECIFIC error messages next to whatever's actually wrong, rather than one generic failure.", "code": "function validateCheckout(address, paymentMethod) {\n  if (!address) {\n    console.log(\"Please enter a shipping address.\");\n    return false;\n  }\n  return true;\n}"}, "review": {"keyPoints": ["Error handling means checking for and gracefully responding to problems, instead of crashing.", "Checking types (typeof) and value ranges upfront prevents many bugs before they happen.", "Clear, specific error messages help both users and developers understand exactly what went wrong."], "quiz": [{"q": "What does 10 / 0 return in JavaScript?", "options": ["An error", "Infinity", "undefined"], "answerIndex": 1, "explain": "JS returns Infinity for division by zero, rather than throwing an error - which is why explicit checks matter."}, {"q": "What is 'defensive programming'?", "options": ["Writing code that never runs", "Anticipating and guarding against potential problems", "Using only const"], "answerIndex": 1, "explain": "Defensive programming means proactively checking for issues before they cause bugs."}], "interview": {"q": "What's the difference between the manual 'if-check' style of error handling shown today, and using try/catch (which we'll cover tomorrow)?", "answer": "If-checks work well for EXPECTED, checkable conditions (wrong type, empty string, out of range) that you can test in advance. try/catch is for catching UNEXPECTED runtime errors (like a function call that throws) that you can't always predict or check for beforehand - the two approaches often work together in real code."}, "tomorrow": "Day 49 - try/catch: catching errors that happen while code is running."}}, {"day": 49, "title": "try/catch", "time": "60 minutes", "learn": {"en": "try/catch lets you attempt (try) risky code, and if it throws an error, CATCH it and handle it gracefully instead of letting the whole script crash.", "hi": "try/catch se risky code attempt (try) kar sakte ho, aur agar error aaye, toh use CATCH karke gracefully handle kar sakte ho, poora script crash hone ke bajaye.", "why": "Some errors can't be checked for in advance (like a broken API response, or unpredictable data) - try/catch handles these AFTER they happen, protecting the rest of your code from crashing.", "analogy": "Think of try/catch like a safety net under a tightrope walker - you're still attempting the risky walk (the try block), but if something goes wrong, the net (catch block) stops it from being disastrous.", "syntax": "try {\n  // risky code\n} catch (error) {\n  // runs if the try block threw an error\n}"}, "teacher": {"intro": "Let's deliberately cause an error and catch it gracefully.", "code": "try {\n  const data = JSON.parse(\"{ this is not valid JSON }\");\n  console.log(data);\n} catch (error) {\n  console.log(\"Something went wrong:\", error.message);\n}\n\nconsole.log(\"The script keeps running after this!\");", "explanation": ["JSON.parse() with invalid JSON throws a real error - normally, this would stop your entire script right there.", "Wrapping it in try { } means JavaScript ATTEMPTS the risky code, ready to catch any error that happens.", "catch (error) { } only runs IF the try block threw an error - 'error' is an object containing details, including error.message (a human-readable description).", "Crucially, the line AFTER the try/catch block still runs - the error was caught and handled, so the rest of the script continues normally."]}, "practice": {"easy": {"task": "Wrap a JSON.parse() call on invalid JSON in try/catch, logging the error's message in the catch block.", "answerCode": "try {\n  JSON.parse(\"not valid json\");\n} catch (error) {\n  console.log(\"Caught an error:\", error.message);\n}", "answerExplain": "The catch block runs because JSON.parse() threw an error on invalid input.", "output": "Caught an error: Unexpected token o in JSON at position 1"}, "medium": {"task": "Write a function safeJsonParse(jsonString) that uses try/catch internally, returning the parsed data if valid, or null if it fails.", "answerCode": "function safeJsonParse(jsonString) {\n  try {\n    return JSON.parse(jsonString);\n  } catch (error) {\n    console.log(\"Invalid JSON, returning null.\");\n    return null;\n  }\n}\nconsole.log(safeJsonParse('{\"name\":\"Vitamin C\"}'));\nconsole.log(safeJsonParse(\"bad json\"));", "answerExplain": "Wrapping the risky operation inside a reusable function makes safe JSON parsing available anywhere in your project.", "output": "{ name: 'Vitamin C' }\nInvalid JSON, returning null.\nnull"}, "challenge": {"task": "Add a 'finally' block (code that runs regardless of success or failure) to a try/catch, and explain when this might be useful.", "answerCode": "try {\n  JSON.parse(\"bad json\");\n} catch (error) {\n  console.log(\"Error occurred.\");\n} finally {\n  console.log(\"This always runs, error or not.\");\n}", "answerExplain": "finally runs no matter what - useful for cleanup tasks (like hiding a loading spinner) that should happen whether the operation succeeded or failed.", "output": "Error occurred.\nThis always runs, error or not."}}, "realworld": {"text": "When fetching data from a server (which we'll cover in a few days), the response is often parsed with JSON.parse() inside a try/catch, since malformed or unexpected server responses shouldn't crash the entire page.", "code": "try {\n  const data = JSON.parse(serverResponse);\n  console.log(data);\n} catch (error) {\n  console.log(\"Failed to read server response.\");\n}"}, "review": {"keyPoints": ["try/catch attempts risky code and gracefully handles any error it throws.", "error.message gives a human-readable description of what went wrong.", "Code after a try/catch block continues running normally, even if the try block failed."], "quiz": [{"q": "What happens to code AFTER a try/catch block if the try block throws an error?", "options": ["The whole script stops", "It continues running normally", "It also throws an error"], "answerIndex": 1, "explain": "Once caught, the error is handled, and the script continues past the try/catch block."}, {"q": "What does error.message provide?", "options": ["The error's line number only", "A human-readable description of the error", "Nothing useful"], "answerIndex": 1, "explain": "error.message contains a descriptive string explaining what went wrong."}], "interview": {"q": "Should you wrap EVERY single line of code in try/catch, just to be safe?", "answer": "No - overusing try/catch everywhere makes code harder to read and can accidentally hide real bugs you should actually be fixing. It's best reserved for genuinely risky operations (parsing external data, network requests) where failure is a realistic, expected possibility outside your control."}, "tomorrow": "Day 50 - JSON: the standard format for exchanging data between JavaScript and servers."}}, {"day": 50, "title": "JSON", "time": "60 minutes", "learn": {"en": "JSON (JavaScript Object Notation) is a text-based data format that looks almost identical to JS objects/arrays - it's the standard way data travels between your JavaScript and a server (or API).", "hi": "JSON (JavaScript Object Notation) ek text-based data format hai jo JS objects/arrays jaisa hi dikhta hai - yeh data ka standard tarika hai JavaScript aur server (ya API) ke beech travel karne ka.", "why": "Starting Day 53, you'll fetch real data from APIs - and that data almost always arrives as JSON text, which you'll need to convert into a real JS object/array to actually use.", "analogy": "Think of JSON like a universal shipping label format - any system (JavaScript, Python, a mobile app) can read it, because it follows the same simple, agreed-upon structure everywhere.", "syntax": "JSON.stringify(jsObject)  // JS object -> JSON text\nJSON.parse(jsonText)      // JSON text -> JS object"}, "teacher": {"intro": "Let's convert a JS object to JSON text and back again.", "code": "const product = {\n  name: \"Vitamin C\",\n  price: 999,\n  inStock: true\n};\n\nconst jsonText = JSON.stringify(product);\nconsole.log(jsonText);        // now it's a STRING\nconsole.log(typeof jsonText); // 'string'\n\nconst parsedBack = JSON.parse(jsonText);\nconsole.log(parsedBack);       // back to a real object\nconsole.log(typeof parsedBack); // 'object'", "explanation": ["JSON.stringify(product) converts the JS OBJECT into a JSON-formatted STRING - useful for sending data TO a server, or saving to storage (tomorrow's topic!).", "Notice jsonText looks almost identical to the original object, but it's now genuinely a STRING, not a real usable object (you can't do jsonText.price directly).", "JSON.parse(jsonText) does the REVERSE - converting a JSON string back into a real, usable JS object.", "This stringify/parse round-trip is exactly what happens whenever your app saves data or talks to a server."]}, "practice": {"easy": {"task": "Convert a simple object with name and price into a JSON string using JSON.stringify(), and log both the result and its type.", "answerCode": "const product = { name: \"Zinc\", price: 449 };\nconst json = JSON.stringify(product);\nconsole.log(json);\nconsole.log(typeof json);", "answerExplain": "stringify() turns the object into a plain text string representation.", "output": "{\"name\":\"Zinc\",\"price\":449}\nstring"}, "medium": {"task": "Take a JSON string (write it manually) representing a product, parse it with JSON.parse(), and log a specific property from the resulting object.", "answerCode": "const jsonText = '{\"name\":\"Omega 3\",\"price\":799}';\nconst product = JSON.parse(jsonText);\nconsole.log(product.name);", "answerExplain": "Once parsed, you have a real object and can use dot notation normally.", "output": "Omega 3"}, "challenge": {"task": "Stringify an object containing a NESTED object and an array, then parse it back and confirm the nested structure survived the round trip.", "answerCode": "const order = {\n  orderId: \"WW1023\",\n  customer: { name: \"Priya\" },\n  items: [\"Vitamin C\", \"Omega 3\"]\n};\n\nconst json = JSON.stringify(order);\nconst parsed = JSON.parse(json);\n\nconsole.log(parsed.customer.name); // still accessible!\nconsole.log(parsed.items[0]);       // still accessible!", "answerExplain": "JSON fully supports nested objects and arrays - the entire structure survives the stringify/parse round trip intact.", "output": "Priya\nVitamin C"}}, "realworld": {"text": "When a real e-commerce API sends back product data, it arrives as JSON text over the network - your code calls JSON.parse() (often done automatically by fetch, which we'll see on Day 54) to turn it into usable JS objects.", "code": "const apiResponseText = '{\"name\":\"Vitamin C\",\"price\":999}';\nconst product = JSON.parse(apiResponseText);\nconsole.log(product.name);"}, "review": {"keyPoints": ["JSON is a text-based format for representing data, closely resembling JS object/array syntax.", "JSON.stringify() converts a JS object/array INTO a JSON string.", "JSON.parse() converts a JSON string BACK INTO a real JS object/array."], "quiz": [{"q": "What does JSON.stringify() produce?", "options": ["A JS object", "A JSON-formatted string", "An array"], "answerIndex": 1, "explain": "stringify() converts a JS value into its JSON string representation."}, {"q": "What does JSON.parse() do?", "options": ["Converts a JS object to a string", "Converts a JSON string back into a JS object", "Deletes the object"], "answerIndex": 1, "explain": "parse() is the reverse of stringify() - text back into a usable object."}], "interview": {"q": "Can JSON represent EVERY JavaScript value, like functions or undefined?", "answer": "No - JSON only supports strings, numbers, booleans, null, objects, and arrays. Functions, undefined, and a few other JS-specific values are simply DROPPED (ignored) when you stringify an object containing them - this is worth remembering when debugging 'missing data' after a stringify/parse round trip."}, "tomorrow": "Day 51 - LocalStorage: saving data in the browser that persists even after closing the tab."}}, {"day": 51, "title": "LocalStorage", "time": "60 minutes", "learn": {"en": "localStorage lets you save data directly in the user's browser, which PERSISTS even after closing the tab or restarting the computer - perfect for remembering cart contents or preferences.", "hi": "localStorage se data user ke browser mein directly save ho sakta hai, jo tab close karne ya computer restart karne ke baad bhi PERSIST karta hai - cart contents ya preferences yaad rakhne ke liye perfect.", "why": "Without localStorage, a customer's cart would vanish every time they refreshed the page - a dealbreaker for any real e-commerce site.", "analogy": "Think of localStorage like a small personal locker built into each visitor's browser - whatever you put in it stays there, specifically for that website, until someone empties it.", "syntax": "localStorage.setItem(\"key\", \"value\");\nlocalStorage.getItem(\"key\");\nlocalStorage.removeItem(\"key\");"}, "teacher": {"intro": "Let's save and retrieve a simple value using localStorage, then combine it with JSON for a real object.", "code": "localStorage.setItem(\"lastVisited\", \"Vitamin C page\");\nconsole.log(localStorage.getItem(\"lastVisited\"));\n\n// localStorage only stores STRINGS - use JSON for objects/arrays\nconst cart = [{ name: \"Vitamin C\", price: 999 }];\nlocalStorage.setItem(\"cart\", JSON.stringify(cart));\n\nconst savedCartText = localStorage.getItem(\"cart\");\nconst savedCart = JSON.parse(savedCartText);\nconsole.log(savedCart);", "explanation": ["setItem(\"key\", \"value\") saves a value under a named key - both key and value must be STRINGS.", "getItem(\"key\") retrieves the saved value later - even after a page reload, since it's stored in the browser, not in your JS variables.", "Since our cart is an array of objects (not a string), we JSON.stringify() it before saving, and JSON.parse() it after retrieving - the combo we learned yesterday.", "This data survives page refreshes and even closing the browser entirely - it only goes away if explicitly removed, or the user clears their browser data."]}, "practice": {"easy": {"task": "Save a customer's name to localStorage, then retrieve and log it.", "answerCode": "localStorage.setItem(\"customerName\", \"Priya\");\nconsole.log(localStorage.getItem(\"customerName\"));", "answerExplain": "setItem saves, getItem retrieves - both working with plain strings here.", "output": "Priya"}, "medium": {"task": "Save an array of favorite product names (as JSON) to localStorage, then retrieve and parse it back into a real array.", "answerCode": "const favorites = [\"Vitamin C\", \"Omega 3\"];\nlocalStorage.setItem(\"favorites\", JSON.stringify(favorites));\n\nconst saved = JSON.parse(localStorage.getItem(\"favorites\"));\nconsole.log(saved);\nconsole.log(saved[0]);", "answerExplain": "Arrays (and objects) must be stringified before saving, and parsed after retrieving, since localStorage only holds strings.", "output": "[ 'Vitamin C', 'Omega 3' ]\nVitamin C"}, "challenge": {"task": "Write a function saveCart(cartArray) and a function loadCart() that wrap the stringify/setItem and getItem/parse logic - and handle the case where nothing has been saved yet (getItem returns null).", "answerCode": "function saveCart(cartArray) {\n  localStorage.setItem(\"cart\", JSON.stringify(cartArray));\n}\n\nfunction loadCart() {\n  const saved = localStorage.getItem(\"cart\");\n  return saved ? JSON.parse(saved) : [];\n}\n\nsaveCart([{ name: \"Zinc\", price: 449 }]);\nconsole.log(loadCart());", "answerExplain": "Using a ternary to check if 'saved' exists before parsing avoids errors from trying to JSON.parse(null) when nothing was saved yet.", "output": "[ { name: 'Zinc', price: 449 } ]"}}, "realworld": {"text": "Every 'your cart is saved even if you leave' feature on e-commerce sites relies on localStorage (or a similar mechanism) to persist the cart data between visits, exactly as you just practiced.", "code": "function addToCartAndSave(item, cart) {\n  cart.push(item);\n  localStorage.setItem(\"cart\", JSON.stringify(cart));\n}"}, "review": {"keyPoints": ["localStorage saves data in the browser that persists across page reloads and browser restarts.", "It only stores STRINGS - use JSON.stringify()/JSON.parse() to save/load objects and arrays.", "getItem() returns null if the key was never saved - always handle that case safely."], "quiz": [{"q": "Does localStorage data disappear when you refresh the page?", "options": ["Yes", "No, it persists", "Only on mobile"], "answerIndex": 1, "explain": "localStorage is specifically designed to survive page reloads and browser restarts."}, {"q": "What data type does localStorage store natively?", "options": ["Objects", "Strings only", "Arrays only"], "answerIndex": 1, "explain": "localStorage only stores strings - other data types must be converted (usually via JSON)."}], "interview": {"q": "What's a key limitation or risk of relying on localStorage for something like a shopping cart?", "answer": "localStorage is specific to ONE browser on ONE device - a customer's cart won't follow them if they switch devices or browsers, and clearing browser data wipes it. Real production sites often sync cart data to a server/account as well, using localStorage mainly as a fast, immediate local cache."}, "tomorrow": "Day 52 - SessionStorage: similar to localStorage, but only for the current tab session."}}, {"day": 52, "title": "SessionStorage", "time": "60 minutes", "learn": {"en": "sessionStorage works just like localStorage, but the data is cleared automatically when the TAB is closed - useful for temporary data that shouldn't outlive the current visit.", "hi": "sessionStorage localStorage jaisa hi kaam karta hai, lekin data automatically clear ho jata hai jab TAB close hoti hai - temporary data ke liye useful jo current visit se aage nahi rehna chahiye.", "why": "Not everything should be permanent - a temporary 'applied coupon this session' or a multi-step form's progress might only matter for the current visit, not forever.", "analogy": "Think of sessionStorage like a sticky note on your desk for TODAY's tasks only - useful while you're working, but you throw it away at the end of the day (closing the tab), unlike a permanent filing cabinet (localStorage).", "syntax": "sessionStorage.setItem(\"key\", \"value\");\nsessionStorage.getItem(\"key\");\nsessionStorage.removeItem(\"key\");"}, "teacher": {"intro": "Let's use sessionStorage to track a temporary 'currently viewing' product during this browsing session.", "code": "sessionStorage.setItem(\"currentlyViewing\", \"Vitamin C\");\nconsole.log(sessionStorage.getItem(\"currentlyViewing\"));\n\n// The same API as localStorage, just different lifespan behavior\nsessionStorage.removeItem(\"currentlyViewing\");\nconsole.log(sessionStorage.getItem(\"currentlyViewing\")); // null now", "explanation": ["The METHODS (setItem, getItem, removeItem) are IDENTICAL to localStorage - only the LIFESPAN differs.", "This data survives page reloads WITHIN the same tab, but disappears the moment that tab is closed.", "removeItem() explicitly deletes a specific key, whether in sessionStorage or localStorage.", "Choosing between localStorage and sessionStorage is purely about how long you WANT the data to last."]}, "practice": {"easy": {"task": "Save a 'sessionId' value to sessionStorage and retrieve it.", "answerCode": "sessionStorage.setItem(\"sessionId\", \"abc123\");\nconsole.log(sessionStorage.getItem(\"sessionId\"));", "answerExplain": "Works exactly the same way as localStorage's setItem/getItem.", "output": "abc123"}, "medium": {"task": "Save a temporary 'appliedCoupon' value to sessionStorage, then remove it and confirm it's gone.", "answerCode": "sessionStorage.setItem(\"appliedCoupon\", \"SAVE10\");\nconsole.log(sessionStorage.getItem(\"appliedCoupon\"));\n\nsessionStorage.removeItem(\"appliedCoupon\");\nconsole.log(sessionStorage.getItem(\"appliedCoupon\"));", "answerExplain": "removeItem() deletes just that one key, and getItem() afterward correctly returns null.", "output": "SAVE10\nnull"}, "challenge": {"task": "Explain (in comments) which of localStorage or sessionStorage you'd choose for: (a) a saved cart, (b) a 'don't show this popup again today' flag, (c) a logged-in user's saved theme preference.", "answerCode": "// (a) Saved cart -> localStorage (should survive closing the browser)\n// (b) 'Don't show popup again today' -> sessionStorage (only relevant for this visit/session)\n// (c) Saved theme preference -> localStorage (should persist across visits)", "answerExplain": "The right choice always depends on how long the data SHOULD reasonably last - permanent-feeling features use localStorage, truly temporary ones use sessionStorage.", "output": "(conceptual exercise - reasoning, not runtime output)"}}, "realworld": {"text": "A multi-step checkout form might use sessionStorage to remember which step you're on if you accidentally refresh mid-checkout - but clear that progress if you close the tab and come back another day.", "code": "sessionStorage.setItem(\"checkoutStep\", \"2\");\nconsole.log(`Resuming at step: ${sessionStorage.getItem(\"checkoutStep\")}`);"}, "review": {"keyPoints": ["sessionStorage shares the same API as localStorage (setItem/getItem/removeItem).", "Data in sessionStorage is cleared automatically when the tab is closed.", "Choose localStorage for data that should persist long-term; sessionStorage for temporary, visit-only data."], "quiz": [{"q": "When is sessionStorage data cleared?", "options": ["Never", "When the tab is closed", "Every hour automatically"], "answerIndex": 1, "explain": "sessionStorage data is tied to the current tab's session and clears when it closes."}, {"q": "Are the setItem/getItem methods different between localStorage and sessionStorage?", "options": ["Yes, completely different", "No, they're identical - only lifespan differs", "sessionStorage has no getItem"], "answerIndex": 1, "explain": "Both storage types share the exact same simple API."}], "interview": {"q": "If you open the SAME website in two different tabs, do they share the same sessionStorage data?", "answer": "No - sessionStorage is scoped to that specific tab (technically, that specific browsing context), so two tabs of the same site have completely separate sessionStorage, while they WOULD share the same localStorage, since localStorage is scoped to the origin (website), not the tab."}, "tomorrow": "Day 53 - What is an API? Understanding how apps talk to servers."}}, {"day": 53, "title": "What is an API?", "time": "60 minutes", "learn": {"en": "An API (Application Programming Interface) is how your JavaScript code requests data from (or sends data to) a server - like asking a waiter (the API) to fetch food (data) from the kitchen (the server/database).", "hi": "API (Application Programming Interface) yeh hai ki tumhara JavaScript code server se data kaise request karta hai (ya server ko data kaise bhejta hai) - jaise waiter (API) se kitchen (server/database) se khana (data) laane ko kehna.", "why": "Real product data, prices, and stock levels don't live inside your JavaScript file - they live on a server/database, and APIs are the standard way to fetch that live data into your page.", "analogy": "Think of an API like a restaurant menu + waiter system: you (the customer/frontend) don't walk into the kitchen (database) yourself - you order from a MENU (the API's defined endpoints), and the waiter (the API) brings back exactly what you asked for.", "syntax": "(No new code syntax today - this is a conceptual foundation before Day 54's Fetch API)"}, "teacher": {"intro": "Let's understand the SHAPE of a typical API response, even before we learn to fetch one for real tomorrow.", "code": "// This is what a REAL API response often looks like (as JSON text):\nconst exampleApiResponse = `\n[\n  { \"id\": \"P1\", \"name\": \"Vitamin C\", \"price\": 999 },\n  { \"id\": \"P2\", \"name\": \"Omega 3\", \"price\": 799 }\n]\n`;\n\nconst products = JSON.parse(exampleApiResponse);\nconsole.log(products);\nconsole.log(products[0].name);", "explanation": ["Real APIs return data as JSON text - exactly the format we studied on Day 50.", "An 'endpoint' is a specific URL that returns specific data - e.g. /api/products might return this exact list.", "Once parsed with JSON.parse() (or, as we'll see tomorrow, automatically handled by fetch), the response becomes a normal, usable JS array/object.", "Tomorrow, instead of a hardcoded example string, we'll fetch this kind of data from a REAL API endpoint over the network."]}, "practice": {"easy": {"task": "Given a JSON string representing a single product from an 'API', parse it and log its name.", "answerCode": "const apiResponse = '{\"id\":\"P3\",\"name\":\"Zinc\",\"price\":449}';\nconst product = JSON.parse(apiResponse);\nconsole.log(product.name);", "answerExplain": "This is exactly what happens conceptually after receiving data from a real API - it arrives as text, then gets parsed.", "output": "Zinc"}, "medium": {"task": "Given a JSON string representing an ARRAY of products from an 'API', parse it and use .map() to log just the names.", "answerCode": "const apiResponse = '[{\"name\":\"Vitamin C\"},{\"name\":\"Omega 3\"}]';\nconst products = JSON.parse(apiResponse);\nconst names = products.map((p) => p.name);\nconsole.log(names);", "answerExplain": "Once parsed, API data is just a normal array - all your array methods (map, filter, find, reduce) work on it exactly as before.", "output": "[ 'Vitamin C', 'Omega 3' ]"}, "challenge": {"task": "Given a simulated 'API error response' (a JSON object with an 'error' field instead of product data), write logic to detect and handle this case differently from a successful response.", "answerCode": "const apiResponse = '{\"error\":\"Product not found\"}';\nconst data = JSON.parse(apiResponse);\n\nif (data.error) {\n  console.log(`API Error: ${data.error}`);\n} else {\n  console.log(\"Success:\", data);\n}", "answerExplain": "Real APIs often signal failures by including an 'error' field rather than the expected data - checking for this BEFORE assuming success is a real-world necessity.", "output": "API Error: Product not found"}}, "realworld": {"text": "When you browse any real e-commerce site, nearly every product/price/stock number you see was originally fetched from an API - your browser is constantly acting as the 'customer' asking a server 'waiter' for fresh data.", "code": "// Tomorrow, we'll actually fetch data like this from a REAL API endpoint,\n// instead of using a hardcoded example string."}, "review": {"keyPoints": ["An API is how your code requests/sends data to a server.", "API data typically arrives as JSON text, which you parse into usable JS objects/arrays.", "Real API responses can also signal ERRORS, which your code should check for and handle."], "quiz": [{"q": "What format does API data typically arrive in?", "options": ["Plain unstructured text", "JSON", "HTML only"], "answerIndex": 1, "explain": "JSON is the standard, widely-used format for API data exchange."}, {"q": "What is an 'endpoint' in the context of an API?", "options": ["A type of error", "A specific URL that returns specific data", "A JavaScript function"], "answerIndex": 1, "explain": "An endpoint is a defined URL/address that serves particular data when requested."}], "interview": {"q": "What's the difference between a 'frontend' (your JavaScript running in the browser) and a 'backend' (the API/server), at a conceptual level?", "answer": "The frontend is what runs in the USER's browser (what they see and interact with), while the backend runs on a SERVER elsewhere, managing data, business logic, and security - the frontend talks to the backend via APIs to get or send data, since the frontend generally shouldn't access databases directly."}, "tomorrow": "Day 54 - Fetch API: actually requesting real data from a server, in code."}}, {"day": 54, "title": "Fetch API", "time": "60 minutes", "learn": {"en": "fetch() is JavaScript's built-in way to actually REQUEST data from a real API/server over the network - turning yesterday's concept into real, working code.", "hi": "fetch() JavaScript ka built-in tarika hai real API/server se actually data REQUEST karne ka network ke through - kal ke concept ko aaj real, working code mein badalte hain.", "why": "Every real app needs LIVE data, not hardcoded examples - fetch() is the foundational tool for getting that live data from anywhere on the internet into your JavaScript.", "analogy": "Think of fetch() like actually placing that restaurant order from yesterday's analogy - you're no longer just imagining the menu, you're really sending the request and waiting for a real response to come back.", "syntax": "fetch(url)\n  .then((response) => response.json())\n  .then((data) => {\n    console.log(data);\n  });"}, "teacher": {"intro": "Let's fetch real data from a free public test API.", "code": "fetch(\"https://jsonplaceholder.typicode.com/users/1\")\n  .then((response) => response.json())\n  .then((data) => {\n    console.log(data);\n    console.log(data.name);\n  });\n\nconsole.log(\"This logs FIRST, before the fetched data arrives!\");", "explanation": ["fetch(url) sends a request to that URL and returns something called a PROMISE (we'll properly cover Promises on Day 55) - a placeholder for a result that arrives LATER.", ".then((response) => response.json()) converts the raw response into usable JSON data - also returning a Promise.", "The second .then((data) => { ... }) finally gives you the ACTUAL data, once it has genuinely arrived from the server.", "Notice the console.log(\"This logs FIRST...\") - fetch() doesn't pause your code while waiting; it's ASYNCHRONOUS, meaning the rest of your script keeps running immediately, and the fetched data arrives 'whenever it's ready', later."]}, "practice": {"easy": {"task": "Fetch data from https://jsonplaceholder.typicode.com/posts/1 and log the whole response.", "answerCode": "fetch(\"https://jsonplaceholder.typicode.com/posts/1\")\n  .then((response) => response.json())\n  .then((data) => {\n    console.log(data);\n  });", "answerExplain": "This basic pattern - fetch, .json(), then use the data - is the foundation of virtually all API calls.", "output": "(logs an object with id, title, body, userId properties from that test post)"}, "medium": {"task": "Fetch a list of users from https://jsonplaceholder.typicode.com/users and log just their names using .map().", "answerCode": "fetch(\"https://jsonplaceholder.typicode.com/users\")\n  .then((response) => response.json())\n  .then((users) => {\n    const names = users.map((u) => u.name);\n    console.log(names);\n  });", "answerExplain": "Once the data arrives as a real array, all your array methods work on it normally, inside the .then() callback.", "output": "(logs an array of 10 user names from the test API)"}, "challenge": {"task": "Fetch data from an INTENTIONALLY WRONG url (a typo) and observe what happens in the console - does your code crash, or does something else happen? (We'll handle this properly on Day 58.)", "answerCode": "fetch(\"https://jsonplaceholder.typicode.com/totally-fake-endpoint\")\n  .then((response) => response.json())\n  .then((data) => {\n    console.log(data);\n  });", "answerExplain": "Interestingly, the request often still 'succeeds' at the network level (getting a 404 response), but .json() on an error response can behave unexpectedly - this is exactly why proper error handling (Day 58) matters for real fetch calls.", "output": "(likely an empty object {} or an error, depending on the exact endpoint's response)"}}, "realworld": {"text": "Every product listing page's data ultimately comes from a fetch() call to the store's own API, exactly like this pattern - just with a real, private company endpoint instead of a public test one.", "code": "fetch(\"https://api.weightworld.example/products\")\n  .then((response) => response.json())\n  .then((products) => {\n    console.log(products);\n  });"}, "review": {"keyPoints": ["fetch(url) requests data from a server and returns a Promise.", ".then((response) => response.json()) converts the raw response into usable data.", "fetch() is ASYNCHRONOUS - your code doesn't pause waiting for it; the data arrives later, handled inside .then()."], "quiz": [{"q": "What does fetch() return immediately?", "options": ["The final data", "A Promise", "undefined"], "answerIndex": 1, "explain": "fetch() returns a Promise right away; the actual data arrives later."}, {"q": "Does your code PAUSE while waiting for fetch() to complete?", "options": ["Yes", "No, it keeps running (asynchronous)", "Only on mobile"], "answerIndex": 1, "explain": "fetch() is non-blocking - the rest of your script continues immediately."}], "interview": {"q": "Why is fetch() described as 'asynchronous', and why does that matter for how you write code around it?", "answer": "Asynchronous means the operation happens in the background, without freezing/pausing the rest of your code - the RESULT isn't available immediately, only once the network request completes. This means you must use .then() (or async/await, Day 56) to run code that depends on the fetched data, rather than expecting it to be ready on the very next line."}, "tomorrow": "Day 55 - Promises: understanding the mechanism behind .then() properly."}}, {"day": 55, "title": "Promises", "time": "60 minutes", "learn": {"en": "A Promise is an object representing a value that will be available LATER - either successfully (resolved) or with a failure (rejected). fetch() returns a Promise, and now we'll understand WHY that matters.", "hi": "Promise ek object hai jo represent karta hai ek value jo LATER available hogi - either successfully (resolved) ya failure ke saath (rejected). fetch() ek Promise return karta hai, aaj samjhenge ki yeh kyun matter karta hai.", "why": "Understanding Promises properly (not just copying .then() syntax) helps you debug async code confidently, and prepares you for async/await tomorrow, which is built entirely on top of Promises.", "analogy": "Think of a Promise like a food delivery tracking number: right when you order, you don't have the food yet, but you have a TRACKING PROMISE that will eventually either deliver the food (resolve) or report a failed delivery (reject).", "syntax": "promise.then((result) => {\n  // runs if successful\n}).catch((error) => {\n  // runs if failed\n});"}, "teacher": {"intro": "Let's create our OWN simple Promise from scratch, to see exactly what's happening under the hood.", "code": "const orderPromise = new Promise((resolve, reject) => {\n  const orderSuccessful = true; // simulate a result\n\n  if (orderSuccessful) {\n    resolve(\"Order placed successfully!\");\n  } else {\n    reject(\"Order failed - payment declined.\");\n  }\n});\n\norderPromise\n  .then((message) => {\n    console.log(\"Success:\", message);\n  })\n  .catch((error) => {\n    console.log(\"Error:\", error);\n  });", "explanation": ["new Promise((resolve, reject) => { ... }) creates a Promise - you decide when to call resolve() (success) or reject() (failure) inside it.", "resolve(\"...\") triggers the .then() callback, passing that value along.", "reject(\"...\") triggers the .catch() callback instead, skipping .then() entirely.", "This is EXACTLY what fetch() does internally - it resolves with the response on success, or rejects if the network request genuinely fails (like no internet connection)."]}, "practice": {"easy": {"task": "Create a Promise that always resolves with 'Task complete!' and log it using .then().", "answerCode": "const taskPromise = new Promise((resolve, reject) => {\n  resolve(\"Task complete!\");\n});\n\ntaskPromise.then((result) => {\n  console.log(result);\n});", "answerExplain": "Calling resolve() immediately triggers the .then() callback with that value.", "output": "Task complete!"}, "medium": {"task": "Create a Promise that rejects with an error message, and handle it using .catch() instead of .then().", "answerCode": "const riskyPromise = new Promise((resolve, reject) => {\n  reject(\"Something went wrong!\");\n});\n\nriskyPromise\n  .then((result) => {\n    console.log(\"Success:\", result);\n  })\n  .catch((error) => {\n    console.log(\"Caught error:\", error);\n  });", "answerExplain": "Since we called reject() (not resolve()), only .catch() runs - .then() is skipped entirely.", "output": "Caught error: Something went wrong!"}, "challenge": {"task": "Create a Promise that resolves or rejects based on a random condition (Math.random() > 0.5), and run it a few times to see different outcomes.", "answerCode": "function checkStock() {\n  return new Promise((resolve, reject) => {\n    if (Math.random() > 0.5) {\n      resolve(\"In stock!\");\n    } else {\n      reject(\"Out of stock.\");\n    }\n  });\n}\n\ncheckStock()\n  .then((msg) => console.log(msg))\n  .catch((err) => console.log(err));", "answerExplain": "This simulates a real-world scenario where you genuinely don't know in advance whether an operation (like a stock check) will succeed or fail - exactly why Promises exist.", "output": "(randomly logs either 'In stock!' or 'Out of stock.' each time you run it)"}}, "realworld": {"text": "fetch() itself returns a Promise - understanding today's lesson means you now understand EXACTLY what's happening when you write fetch(url).then(...).catch(...) in real code.", "code": "fetch(\"https://jsonplaceholder.typicode.com/posts/1\")\n  .then((response) => response.json())\n  .catch((error) => console.log(\"Network error:\", error));"}, "review": {"keyPoints": ["A Promise represents a value that will be available later, either resolved (success) or rejected (failure).", "resolve() triggers .then(); reject() triggers .catch().", "fetch() returns a real Promise - this is exactly why .then()/.catch() work with it."], "quiz": [{"q": "What triggers a Promise's .then() callback?", "options": ["Calling reject()", "Calling resolve()", "Nothing, it's automatic"], "answerIndex": 1, "explain": "resolve() fulfills the Promise, triggering .then()."}, {"q": "What triggers a Promise's .catch() callback?", "options": ["Calling resolve()", "Calling reject()", "Waiting long enough"], "answerIndex": 1, "explain": "reject() causes the Promise to fail, triggering .catch()."}], "interview": {"q": "What are the three possible states of a Promise?", "answer": "Pending (still waiting for the result), Fulfilled/Resolved (completed successfully), and Rejected (failed) - a Promise starts as pending and eventually settles into exactly one of the other two states, never both."}, "tomorrow": "Day 56 - async/await: a cleaner, more readable way to work with Promises."}}, {"day": 56, "title": "async/await", "time": "60 minutes", "learn": {"en": "async/await is modern syntax that lets you write asynchronous (Promise-based) code that READS like simple, top-to-bottom synchronous code - much easier to follow than chains of .then().", "hi": "async/await modern syntax hai jisse asynchronous (Promise-based) code likh sakte ho jo simple, top-to-bottom synchronous code jaisa PADHTA hai - .then() ki chains se kaafi asaan follow karna.", "why": "Real projects almost always use async/await instead of raw .then() chains today - it's considered cleaner, and you'll see it constantly in modern JavaScript and React code.", "analogy": "Think of async/await like literally pausing to wait in line at a counter, versus .then() being like leaving your phone number and getting called back later - both eventually get you the result, but 'waiting in line' (await) often reads more naturally, step by step.", "syntax": "async function myFunction() {\n  const result = await somePromise;\n  console.log(result);\n}"}, "teacher": {"intro": "Let's rewrite yesterday's fetch example using async/await instead of .then() chains.", "code": "async function getUser() {\n  const response = await fetch(\"https://jsonplaceholder.typicode.com/users/1\");\n  const data = await response.json();\n  console.log(data.name);\n}\n\ngetUser();\nconsole.log(\"This still logs FIRST - async functions don't block either!\");", "explanation": ["'async' before a function marks it as asynchronous - this is REQUIRED to use 'await' inside it.", "await fetch(...) PAUSES this specific function (not your whole script) until the fetch actually completes, then continues with the resolved value.", "await response.json() similarly waits for the JSON conversion to finish before moving to the next line.", "Even though it LOOKS synchronous (top to bottom), the function is still asynchronous overall - other code outside it keeps running normally, which is why 'This still logs FIRST' still applies."]}, "practice": {"easy": {"task": "Write an async function that fetches a single post from https://jsonplaceholder.typicode.com/posts/1 and logs its title, using await.", "answerCode": "async function getPost() {\n  const response = await fetch(\"https://jsonplaceholder.typicode.com/posts/1\");\n  const data = await response.json();\n  console.log(data.title);\n}\ngetPost();", "answerExplain": "Two awaits in sequence: first for the raw response, then for converting it to JSON.", "output": "(logs the title of that test post)"}, "medium": {"task": "Write an async function that fetches a list of users and logs how many were returned, using .length on the resulting array.", "answerCode": "async function getUserCount() {\n  const response = await fetch(\"https://jsonplaceholder.typicode.com/users\");\n  const users = await response.json();\n  console.log(`Found ${users.length} users`);\n}\ngetUserCount();", "answerExplain": "Once awaited and parsed, 'users' is a normal array - .length works exactly as expected.", "output": "Found 10 users"}, "challenge": {"task": "Wrap an async function's fetch call in try/catch to handle potential errors gracefully (combining Day 49's try/catch with today's await).", "answerCode": "async function getPostSafely() {\n  try {\n    const response = await fetch(\"https://jsonplaceholder.typicode.com/posts/1\");\n    const data = await response.json();\n    console.log(data.title);\n  } catch (error) {\n    console.log(\"Failed to fetch post:\", error.message);\n  }\n}\ngetPostSafely();", "answerExplain": "try/catch works naturally with async/await - if ANY awaited operation fails, execution jumps straight to the catch block, just like synchronous error handling.", "output": "(logs the post title, or an error message if the fetch genuinely fails)"}}, "realworld": {"text": "Modern real-world code almost always uses async/await with try/catch for API calls, exactly like the challenge exercise - it's considered the current best practice over raw .then()/.catch() chains.", "code": "async function loadProducts() {\n  try {\n    const response = await fetch(\"/api/products\");\n    const products = await response.json();\n    console.log(products);\n  } catch (error) {\n    console.log(\"Could not load products.\");\n  }\n}"}, "review": {"keyPoints": ["async before a function allows using 'await' inside it.", "await pauses that function (not the whole script) until a Promise resolves, then continues with the result.", "try/catch works naturally with async/await for clean error handling."], "quiz": [{"q": "What keyword must precede a function to use 'await' inside it?", "options": ["promise", "async", "wait"], "answerIndex": 1, "explain": "Only 'async' functions can use the 'await' keyword internally."}, {"q": "Does 'await' pause the ENTIRE script, or just that function?", "options": ["The entire script", "Just that specific async function", "Nothing is paused"], "answerIndex": 1, "explain": "Other code outside the async function keeps running normally."}], "interview": {"q": "Is async/await a completely different mechanism from Promises, or is it built on top of them?", "answer": "async/await is 'syntactic sugar' built directly on top of Promises - under the hood, it's still using the exact same Promise mechanism (resolve/reject), just presented in a way that reads more like traditional, sequential code. Understanding Promises (yesterday) is what makes async/await genuinely make sense, rather than feeling like magic."}, "tomorrow": "Day 57 - Loading API Data: rendering real fetched data onto the page."}}, {"day": 57, "title": "Loading API Data", "time": "60 minutes", "learn": {"en": "Today we combine fetch/async-await with DOM manipulation (Phase 3) - taking real API data and actually RENDERING it onto the page as HTML, not just logging it to the console.", "hi": "Aaj hum fetch/async-await ko DOM manipulation (Phase 3) ke saath combine karte hain - real API data ko actually page pe HTML ki tarah RENDER karte hain, sirf console mein log karne ke bajaye.", "why": "Data sitting in the console isn't useful to real users - the whole POINT of fetching data is to show it, which means combining everything you've learned across all 4 phases so far.", "analogy": "Think of today like finally plating and serving that food order from earlier analogies - you've fetched it (ordered), now it needs to actually appear in front of the customer (rendered on the page).", "syntax": "(Combining fetch/await from recent days with createElement/innerHTML from Phase 3)"}, "teacher": {"intro": "Let's fetch a list of users and render them as cards on the page.", "code": "// HTML: <div id=\"userList\"></div>\nasync function loadUsers() {\n  const response = await fetch(\"https://jsonplaceholder.typicode.com/users\");\n  const users = await response.json();\n\n  const container = document.getElementById(\"userList\");\n  container.innerHTML = \"\"; // clear before rendering\n\n  users.forEach((user) => {\n    const card = document.createElement(\"div\");\n    card.classList.add(\"user-card\");\n    card.textContent = `${user.name} (${user.email})`;\n    container.appendChild(card);\n  });\n}\n\nloadUsers();", "explanation": ["We await BOTH the fetch AND the .json() conversion before doing anything with the data - only proceeding once real data is actually available.", "container.innerHTML = \"\" clears any placeholder/loading content before rendering the real data (we'll build a proper loading STATE tomorrow-ish).", "users.forEach((user) => { ... }) - forEach is another array method (like map, but it doesn't return anything - it's purely for 'do something for each item', perfect for rendering).", "Each user becomes its own createElement + appendChild, exactly like the mini-project on Day 45 - just with REAL fetched data instead of hardcoded values."]}, "practice": {"easy": {"task": "Fetch posts from https://jsonplaceholder.typicode.com/posts?_limit=3 (returns only 3) and render each post's title as a list item inside a container.", "answerCode": "// HTML: <ul id=\"postList\"></ul>\nasync function loadPosts() {\n  const response = await fetch(\"https://jsonplaceholder.typicode.com/posts?_limit=3\");\n  const posts = await response.json();\n\n  const list = document.getElementById(\"postList\");\n  posts.forEach((post) => {\n    const li = document.createElement(\"li\");\n    li.textContent = post.title;\n    list.appendChild(li);\n  });\n}\nloadPosts();", "answerExplain": "The ?_limit=3 query parameter is a real API feature that restricts how many results come back - useful to know when working with real APIs.", "output": "(renders 3 <li> elements, one per post title)"}, "medium": {"task": "Fetch users and render each one's name in a <strong> tag using innerHTML instead of textContent, inside individual divs.", "answerCode": "async function loadUsers() {\n  const response = await fetch(\"https://jsonplaceholder.typicode.com/users\");\n  const users = await response.json();\n  const container = document.getElementById(\"userList\");\n\n  users.forEach((user) => {\n    const div = document.createElement(\"div\");\n    div.innerHTML = `<strong>${user.name}</strong> - ${user.email}`;\n    container.appendChild(div);\n  });\n}\nloadUsers();", "answerExplain": "Using innerHTML with a template literal lets you insert actual formatted HTML (like bold names), not just plain text.", "output": "(renders each user's name in bold, followed by their email)"}, "challenge": {"task": "Fetch users, and render ONLY those whose name starts with a letter in the first half of the alphabet (A-M), combining filter() with your rendering loop.", "answerCode": "async function loadFilteredUsers() {\n  const response = await fetch(\"https://jsonplaceholder.typicode.com/users\");\n  const users = await response.json();\n\n  const filtered = users.filter((user) => user.name[0].toUpperCase() <= \"M\");\n\n  const container = document.getElementById(\"userList\");\n  filtered.forEach((user) => {\n    const div = document.createElement(\"div\");\n    div.textContent = user.name;\n    container.appendChild(div);\n  });\n}\nloadFilteredUsers();", "answerExplain": "Combining filter() (from Phase 2) with fetched data (Phase 4) and DOM rendering (Phase 3) shows how everything you've learned works together in real applications.", "output": "(renders only users whose names start with A through M)"}}, "realworld": {"text": "This exact pattern - fetch, await, then loop + createElement/appendChild to render - is literally how real product listing pages, user directories, and comment sections are built.", "code": "async function loadProducts() {\n  const response = await fetch(\"/api/products\");\n  const products = await response.json();\n  products.forEach((p) => renderProductCard(p));\n}"}, "review": {"keyPoints": ["Fetched data becomes genuinely useful once it's rendered onto the page, not just logged.", "forEach() is ideal for 'do something for each item' tasks like rendering, since it doesn't need to return a new array.", "This lesson combines fetch/await (Phase 4) with DOM manipulation (Phase 3) - real apps constantly blend concepts from different 'phases' together."], "quiz": [{"q": "What's the key difference between forEach() and map()?", "options": ["forEach() doesn't return a new array; map() does", "They are identical", "forEach() is faster always"], "answerIndex": 0, "explain": "map() builds and returns a new transformed array; forEach() just runs code per item without returning anything."}, {"q": "Why clear a container's innerHTML before rendering fetched data into it?", "options": ["It's required by fetch()", "To avoid old/placeholder content mixing with new content", "It makes fetch() faster"], "answerIndex": 1, "explain": "Clearing first ensures you don't end up with duplicate or stale content alongside the newly rendered items."}], "interview": {"q": "Why might rendering elements one by one inside a forEach loop (each with its own appendChild call) be less efficient than building an HTML string first and setting innerHTML once?", "answer": "Each individual appendChild can trigger the browser to recalculate the page's layout - doing this many times in a loop is less efficient than building the complete HTML (or a document fragment) first, then updating the DOM just once, especially noticeable with large lists."}, "tomorrow": "Day 58 - Handling API Errors: what to do when a fetch request fails."}}, {"day": 58, "title": "Handling API Errors", "time": "60 minutes", "learn": {"en": "Real API calls can fail - no internet, a wrong URL, or a server error. Today we properly handle these failures so users see a helpful message instead of a silently broken page.", "hi": "Real API calls fail bhi ho sakte hain - internet na ho, URL galat ho, ya server error ho. Aaj hum yeh failures properly handle karenge, taaki users ko helpful message dikhe, ek silently broken page nahi.", "why": "A page that just... does nothing when an API fails is a poor experience. Proper error handling means users always know what's happening, even when something goes wrong.", "analogy": "Think of proper error handling like a delivery app that tells you 'Delivery failed, please retry' instead of just leaving the order status stuck on a spinning wheel forever with no explanation.", "syntax": "try {\n  const response = await fetch(url);\n  if (!response.ok) {\n    throw new Error(\"Request failed\");\n  }\n} catch (error) {\n  // handle it\n}"}, "teacher": {"intro": "Let's properly handle both network failures AND 'bad response' failures (like a 404) from a fetch call.", "code": "async function loadUser(userId) {\n  try {\n    const response = await fetch(`https://jsonplaceholder.typicode.com/users/${userId}`);\n\n    if (!response.ok) {\n      throw new Error(`Request failed with status ${response.status}`);\n    }\n\n    const user = await response.json();\n    console.log(user.name);\n\n  } catch (error) {\n    console.log(\"Could not load user:\", error.message);\n  }\n}\n\nloadUser(1);   // should succeed\nloadUser(9999); // likely 'not found'", "explanation": ["response.ok is a Boolean that's TRUE only for successful responses (status codes 200-299) - a fetch can 'succeed' at the network level while still representing a failure (like a 404 Not Found).", "if (!response.ok) { throw new Error(...) } manually triggers an error for these 'technically responded, but failed' cases - fetch() does NOT do this automatically, which surprises many beginners.", "The try/catch wraps EVERYTHING - genuine network failures (no internet) AND our manually thrown error both get caught here.", "Always logging error.message (rather than a generic 'something went wrong') helps you debug real issues faster."]}, "practice": {"easy": {"task": "Fetch a user with a clearly invalid ID (e.g. 99999) and check response.ok, logging whether it succeeded or failed.", "answerCode": "async function checkUser() {\n  const response = await fetch(\"https://jsonplaceholder.typicode.com/users/99999\");\n  console.log(\"Success:\", response.ok);\n}\ncheckUser();", "answerExplain": "response.ok directly tells you whether the request was genuinely successful, regardless of whether fetch() itself 'worked' at the network level.", "output": "Success: false"}, "medium": {"task": "Write a function that throws a custom error if response.ok is false, and catches it with a friendly console message.", "answerCode": "async function loadPost(id) {\n  try {\n    const response = await fetch(`https://jsonplaceholder.typicode.com/posts/${id}`);\n    if (!response.ok) {\n      throw new Error(\"Post not found\");\n    }\n    const post = await response.json();\n    console.log(post.title);\n  } catch (error) {\n    console.log(\"Error:\", error.message);\n  }\n}\nloadPost(99999);", "answerExplain": "Manually throwing a descriptive error gives you (and users) a clearer message than a generic failure.", "output": "Error: Post not found"}, "challenge": {"task": "Simulate a complete network failure by fetching an invalid domain (not just a wrong path) and confirm try/catch still catches it cleanly.", "answerCode": "async function testNetworkFailure() {\n  try {\n    const response = await fetch(\"https://this-domain-does-not-exist-xyz123.com/data\");\n    const data = await response.json();\n    console.log(data);\n  } catch (error) {\n    console.log(\"Network error caught:\", error.message);\n  }\n}\ntestNetworkFailure();", "answerExplain": "A genuinely broken domain causes fetch() ITSELF to reject (not just return a bad response), and try/catch handles this exactly the same way as our manually thrown errors.", "output": "Network error caught: Failed to fetch"}}, "realworld": {"text": "Every real e-commerce site shows a message like 'Unable to load products, please try again' when its API call fails - built with exactly this try/catch + response.ok pattern, rather than leaving the page blank.", "code": "try {\n  const response = await fetch(\"/api/products\");\n  if (!response.ok) throw new Error(\"Failed to load products\");\n} catch (error) {\n  console.log(\"Show user-friendly error message here\");\n}"}, "review": {"keyPoints": ["fetch() does NOT automatically treat 404s/500s as errors - you must check response.ok yourself.", "Manually throwing an error (throw new Error(...)) when response.ok is false lets try/catch handle it uniformly.", "Genuine network failures (no internet, invalid domain) DO cause fetch() itself to reject, caught the same way."], "quiz": [{"q": "Does fetch() automatically throw an error for a 404 response?", "options": ["Yes", "No - you must check response.ok yourself", "Only in Chrome"], "answerIndex": 1, "explain": "A 404 is still a 'successful' network response as far as fetch() is concerned - checking response.ok is essential."}, {"q": "What does response.ok being false usually indicate?", "options": ["A successful request", "A request that reached the server but failed (like 404/500)", "No internet connection"], "answerIndex": 1, "explain": "response.ok being false means the server responded, but with a failure status code."}], "interview": {"q": "What's the difference between a fetch() call that REJECTS versus one that resolves with response.ok === false?", "answer": "fetch() rejects (goes to .catch or triggers the catch block) only for genuine network-level failures (no connection, invalid domain, CORS issues). If the request reaches the server but the server responds with an error status (404, 500), fetch() still RESOLVES successfully - it's just that response.ok will be false, which is why checking it explicitly is necessary."}, "tomorrow": "Day 59 - Loading States: showing users something WHILE data is being fetched."}}, {"day": 59, "title": "Loading States", "time": "60 minutes", "learn": {"en": "A loading state shows the user SOMETHING (like 'Loading...' or a spinner) while data is being fetched, instead of a blank, confusing page during that wait.", "hi": "Loading state user ko KUCH dikhata hai (jaise 'Loading...' ya spinner) jab tak data fetch ho raha hota hai, blank confusing page ke bajaye us wait ke dauran.", "why": "Network requests take time (even if usually just milliseconds) - without a loading indicator, users might think the page is broken or unresponsive during that gap.", "analogy": "Think of a loading state like a restaurant giving you a table number and saying 'we'll call you' - it doesn't speed up the wait, but it reassures you that something IS actually happening.", "syntax": "element.textContent = \"Loading...\";\n// ... fetch happens ...\nelement.textContent = \"\"; // clear once done"}, "teacher": {"intro": "Let's add a proper loading state around our user-fetching example from Day 57.", "code": "// HTML: <div id=\"status\"></div> <div id=\"userList\"></div>\nasync function loadUsers() {\n  const statusEl = document.getElementById(\"status\");\n  const container = document.getElementById(\"userList\");\n\n  statusEl.textContent = \"Loading users...\"; // show loading state\n  container.innerHTML = \"\";\n\n  try {\n    const response = await fetch(\"https://jsonplaceholder.typicode.com/users\");\n    if (!response.ok) throw new Error(\"Failed to load users\");\n\n    const users = await response.json();\n\n    statusEl.textContent = \"\"; // clear loading state - success\n    users.forEach((user) => {\n      const div = document.createElement(\"div\");\n      div.textContent = user.name;\n      container.appendChild(div);\n    });\n\n  } catch (error) {\n    statusEl.textContent = \"Could not load users. Please try again.\"; // error state\n  }\n}\n\nloadUsers();", "explanation": ["statusEl.textContent = \"Loading users...\" is set IMMEDIATELY, before the await even starts - the user sees feedback right away.", "Only once the data successfully arrives do we clear the loading message and render the real content.", "If something goes wrong (caught in the catch block), we show a DIFFERENT message - a proper error state, not just a stuck loading message.", "This 3-state pattern (loading → success OR error) is the foundation of virtually every real data-driven UI you've ever used."]}, "practice": {"easy": {"task": "Add a loading message before a fetch call, and clear it once the data (a single post) has loaded.", "answerCode": "async function loadPost() {\n  const status = document.getElementById(\"status\");\n  status.textContent = \"Loading post...\";\n\n  const response = await fetch(\"https://jsonplaceholder.typicode.com/posts/1\");\n  const post = await response.json();\n\n  status.textContent = \"\";\n  console.log(post.title);\n}\nloadPost();", "answerExplain": "The loading message appears immediately, then disappears once the awaited data is ready.", "output": "(the status element briefly shows 'Loading post...' then clears; the title logs)"}, "medium": {"task": "Add BOTH a loading state and a proper error state (using try/catch) for a fetch call to an intentionally broken URL.", "answerCode": "async function loadData() {\n  const status = document.getElementById(\"status\");\n  status.textContent = \"Loading...\";\n\n  try {\n    const response = await fetch(\"https://jsonplaceholder.typicode.com/totally-fake-endpoint-xyz\");\n    if (!response.ok) throw new Error(\"Not found\");\n    const data = await response.json();\n    status.textContent = \"\";\n    console.log(data);\n  } catch (error) {\n    status.textContent = \"Something went wrong. Please try again.\";\n  }\n}\nloadData();", "answerExplain": "Because the endpoint is broken, the catch block runs, replacing the loading message with a clear error message instead of leaving it stuck.", "output": "(the status element ends up showing 'Something went wrong. Please try again.')"}, "challenge": {"task": "Disable a 'Refresh' button WHILE loading (so users can't spam-click it), then re-enable it once loading finishes (success or error).", "answerCode": "async function refreshData() {\n  const btn = document.getElementById(\"refreshBtn\");\n  const status = document.getElementById(\"status\");\n\n  btn.disabled = true;\n  status.textContent = \"Refreshing...\";\n\n  try {\n    const response = await fetch(\"https://jsonplaceholder.typicode.com/posts/1\");\n    const data = await response.json();\n    status.textContent = \"Updated!\";\n    console.log(data);\n  } catch (error) {\n    status.textContent = \"Refresh failed.\";\n  } finally {\n    btn.disabled = false; // re-enable regardless of success or failure\n  }\n}\ndocument.getElementById(\"refreshBtn\").addEventListener(\"click\", refreshData);", "answerExplain": "Using 'finally' (from Day 49) guarantees the button is re-enabled whether the fetch succeeded OR failed - a clean way to handle 'cleanup that must always happen'.", "output": "(the button becomes disabled during loading, then re-enabled afterward, regardless of outcome)"}}, "realworld": {"text": "Every skeleton-loading animation, spinner, or 'Loading products...' message you've seen on real e-commerce sites is exactly this pattern - toggling visible states based on where the fetch currently stands (loading, success, or error).", "code": "// The 3-state pattern: Loading -> Success or Error.\n// This IS the mental model behind most real data-fetching UIs."}, "review": {"keyPoints": ["A loading state shows the user something WHILE waiting for data, preventing confusion.", "Real data-fetching UIs follow a 3-state pattern: loading → success OR error.", "'finally' is useful for cleanup (like re-enabling a button) that should happen regardless of success or failure."], "quiz": [{"q": "Why show a loading message before a fetch call, rather than after?", "options": ["It doesn't matter when", "So the user has immediate feedback that something is happening", "It makes fetch() faster"], "answerIndex": 1, "explain": "Setting the loading message BEFORE awaiting the fetch gives the user instant feedback, since the fetch itself takes time."}, {"q": "What are the three typical states of a data-fetching UI?", "options": ["Start, middle, end", "Loading, success, error", "On, off, paused"], "answerIndex": 1, "explain": "These three states cover every realistic outcome of an async data request."}], "interview": {"q": "Why might a real app add a small MINIMUM delay before hiding a loading spinner, even if the data arrives almost instantly?", "answer": "If a spinner flashes on-screen for only a few milliseconds, it can look glitchy or jarring rather than reassuring - some apps intentionally show a loading state for a minimum duration (e.g. at least 300ms) purely for a smoother, less flickery user experience."}, "tomorrow": "Day 60 - Mini Project: Product API Website, combining all of Phase 4!"}}, {"day": 60, "title": "Mini Project: Product API Website", "time": "60 minutes", "learn": {"en": "Today's Mini Project combines ALL of Phase 4: scope, callbacks, error handling, JSON, storage, fetch, Promises, async/await, and loading states - building a real, working Product API Website.", "hi": "Aaj ka Mini Project Phase 4 ka SAB kuch combine karta hai: scope, callbacks, error handling, JSON, storage, fetch, Promises, async/await, aur loading states - ek real, working Product API Website banate hain.", "why": "This is your biggest project yet - fetching REAL data, handling errors properly, showing loading states, AND saving favorites to localStorage. This is genuinely close to real production code.", "analogy": "Think of this like your first full day running an actual small online store counter - handling real customer requests, occasional problems, and remembering regular customers' preferences, all in one shift.", "syntax": "(No new syntax today - combining Days 46-59!)"}, "teacher": {"intro": "Let's build a product website that fetches real data, handles errors, shows loading states, and lets users 'favorite' products (saved to localStorage).", "code": "// HTML: <div id=\"status\"></div> <div id=\"productList\"></div>\n\nasync function loadProducts() {\n  const status = document.getElementById(\"status\");\n  const container = document.getElementById(\"productList\");\n\n  status.textContent = \"Loading products...\";\n  container.innerHTML = \"\";\n\n  try {\n    // Using a test API - imagine these are real products\n    const response = await fetch(\"https://jsonplaceholder.typicode.com/users?_limit=5\");\n    if (!response.ok) throw new Error(\"Failed to load products\");\n\n    const products = await response.json();\n    status.textContent = \"\";\n\n    const favorites = JSON.parse(localStorage.getItem(\"favorites\")) || [];\n\n    products.forEach((product) => {\n      const card = document.createElement(\"div\");\n      card.classList.add(\"product-card\");\n\n      const isFavorited = favorites.includes(product.id);\n      card.innerHTML = `\n        <strong>${product.name}</strong>\n        <button data-id=\"${product.id}\">${isFavorited ? \"★ Favorited\" : \"☆ Favorite\"}</button>\n      `;\n\n      const btn = card.querySelector(\"button\");\n      btn.addEventListener(\"click\", function() {\n        toggleFavorite(product.id, btn);\n      });\n\n      container.appendChild(card);\n    });\n\n  } catch (error) {\n    status.textContent = \"Could not load products. \" + error.message;\n  }\n}\n\nfunction toggleFavorite(productId, buttonEl) {\n  let favorites = JSON.parse(localStorage.getItem(\"favorites\")) || [];\n\n  if (favorites.includes(productId)) {\n    favorites = favorites.filter((id) => id !== productId);\n    buttonEl.textContent = \"☆ Favorite\";\n  } else {\n    favorites.push(productId);\n    buttonEl.textContent = \"★ Favorited\";\n  }\n\n  localStorage.setItem(\"favorites\", JSON.stringify(favorites));\n}\n\nloadProducts();", "explanation": ["loadProducts() follows the full loading → success/error pattern from Day 59, using async/await and try/catch together.", "We load existing favorites from localStorage FIRST, so already-favorited products show correctly the moment they're rendered.", "Each card's button gets its own event listener calling toggleFavorite(), which updates BOTH the button's text AND localStorage together.", "favorites.filter((id) => id !== productId) is how we REMOVE an id from the array (keeping everything except that one) when un-favoriting - a nice callback to Day 27!"]}, "practice": {"easy": {"task": "Add a 'Refresh' button that re-runs loadProducts() when clicked.", "answerCode": "document.getElementById(\"refreshBtn\").addEventListener(\"click\", function() {\n  loadProducts();\n});", "answerExplain": "Since loadProducts() already handles its own loading/error states internally, simply calling it again on click works correctly.", "output": "(clicking Refresh re-fetches and re-renders the product list, showing the loading state again briefly)"}, "medium": {"task": "Add a count showing how many products are currently favorited, updating it inside toggleFavorite().", "answerCode": "function updateFavoriteCount() {\n  const favorites = JSON.parse(localStorage.getItem(\"favorites\")) || [];\n  document.getElementById(\"favCount\").textContent = `${favorites.length} favorited`;\n}\n\n// Call updateFavoriteCount() inside toggleFavorite(), after localStorage.setItem(...)", "answerExplain": "Reading favorites fresh from localStorage each time ensures the count always reflects the true current state.", "output": "(a live count updates every time a product is favorited/unfavorited)"}, "challenge": {"task": "Add a 'Show Only Favorites' toggle that filters the currently rendered products to show only favorited ones, without re-fetching from the API.", "answerCode": "let allProducts = []; // store fetched products globally for reuse\n\n// Inside loadProducts(), after fetching: allProducts = products;\n\nfunction showOnlyFavorites() {\n  const favorites = JSON.parse(localStorage.getItem(\"favorites\")) || [];\n  const filtered = allProducts.filter((p) => favorites.includes(p.id));\n  // re-render using 'filtered' instead of 'allProducts'\n  console.log(filtered);\n}", "answerExplain": "Storing the fetched data in a variable OUTSIDE the function lets you re-filter and re-render WITHOUT needing another network request - an important real-world optimization.", "output": "(logs only the currently favorited products, ready to be re-rendered)"}}, "realworld": {"text": "You've just built the core architecture behind real 'favorites'/'wishlist' features on e-commerce sites - fetching real product data, persisting user choices in localStorage, and keeping the UI in sync with that saved state.", "code": "// This mini project mirrors real production features you'll recognize\n// on nearly every shopping site you've ever used."}, "review": {"keyPoints": ["Real features combine MANY concepts together: async data fetching, error handling, loading states, and persistent storage.", "Reading saved state (like favorites) BEFORE rendering ensures the UI reflects reality from the very first render.", "Storing fetched data in a variable (not just using it once) allows further client-side filtering without extra network requests."], "quiz": [{"q": "In the mini project, what does favorites.filter((id) => id !== productId) accomplish?", "options": ["Adds productId to favorites", "Removes productId from favorites, keeping everything else", "Clears all favorites"], "answerIndex": 1, "explain": "filter() keeps only the ids that DON'T match productId, effectively removing it."}, {"q": "Why check localStorage for favorites BEFORE rendering the product cards?", "options": ["It's required by fetch()", "So already-favorited items display correctly from the start", "It makes the API call faster"], "answerIndex": 1, "explain": "Reading saved state first ensures the initial render is already accurate, rather than needing a second pass."}], "interview": {"q": "Looking back at Phase 4 (Days 46-60), which concept do you think was the biggest mental shift from everything before it, and why?", "answer": "(Open-ended - many learners point to asynchronous thinking (Promises/async-await) as the biggest shift, since everything before ran predictably top-to-bottom, while async code requires thinking about 'this will happen LATER, at an unknown time' - a genuinely different mental model from synchronous code.)"}, "tomorrow": "Day 61 - Starting Phase 5: building a real e-commerce project step by step - JS Store, Day 1: Project Setup."}}, {"day": 61, "title": "Project Setup", "time": "60 minutes", "learn": {"en": "Starting today, you'll build ONE continuous project across 15 days: 'JS Store'. Today is just the foundation - project structure and a plan, so every following day builds on solid ground.", "hi": "Aaj se tum EK continuous project banaoge 15 dinon tak: 'JS Store'. Aaj sirf fou
